<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>知识增强审核 · 追光小牛管理后台</title>
  <script>window.__SKIP_AUTO_INTERNAL_AUTH__ = true;</script>
  <script src="/internal-auth.js?v=8"></script>
  <script src="/js/app-auth.js?v=3"></script>
  <style>
    :root{--bg:#f3f0ea;--card:#fff;--ink:#1f1a17;--muted:#716862;--line:#ded8d1;--brand:#d95428;--danger:#a9251b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.top{padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.top a{color:var(--muted);text-decoration:none;margin-left:16px}main{max-width:1400px;margin:auto;padding:24px}.hero,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:#211b18;color:#fff}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#d9d0ca}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.toolbar input,.toolbar select,.toolbar button,textarea{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}.toolbar button,.actions button{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}.grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(480px,1.2fr);gap:16px}.queue{display:grid;gap:8px;max-height:70vh;overflow:auto}.item{width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.item.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(217,84,40,.12)}.meta,.status{color:var(--muted);font-size:12px}.detail{white-space:pre-wrap;line-height:1.65;max-height:42vh;overflow:auto;background:#faf8f5;border-radius:10px;padding:14px}.actions{display:grid;gap:8px;margin-top:14px}.actions textarea{min-height:74px;resize:vertical}.actions div{display:flex;gap:8px}.actions .reject{background:#fff;color:var(--danger);border:1px solid #d9a09b}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:860px){main{padding:14px 12px}.grid{grid-template-columns:1fr}.queue{max-height:38vh}.detail{max-height:none}}
  </style>
</head>
<body>
  <header class="top"><strong>知识内容治理</strong><nav><a href="/admin/dashboard.html">后台首页</a><a href="/admin/knowledge-age-review.html">年龄审核</a><a href="/knowledge/">员工端知识中心</a></nav></header>
  <main>
    <section class="hero"><h1>知识增强审核</h1><p>对照完整原文、增强稿和风险标记，审核通过后进入发布准备状态。</p></section>
    <div class="toolbar"><select id="review_status"><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已退回</option><option value="">全部状态</option></select><select id="enrichment_status"><option value="">全部进度</option><option value="draft">草稿</option><option value="needs_review">需复核</option><option value="approved">已通过</option></select><select id="task_type"><option value="">全部类型</option><option value="movement">动作</option><option value="sensory">感觉统合</option><option value="fitness">体能</option><option value="teaching">教学</option><option value="development">儿童发展</option><option value="family_communication">家长沟通</option></select><select id="risk_flag"><option value="">全部风险</option><option value="professional_review">专业复核</option><option value="physical_safety">身体安全</option><option value="development_boundary">发展边界</option></select><select id="source_length"><option value="">全部长度</option><option value="short">短正文</option><option value="long">长正文</option></select><input id="keyword" placeholder="搜索编号或标题" /><input id="batch" placeholder="发布批次，例如 enrichment-20260908" /><button id="reload">刷新</button><button id="publish">发布选中</button><button id="report">查看批次报告</button><button id="rollback">回退批次</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="grid"><section class="panel"><div id="queue" class="queue"></div></section><section class="panel" id="detail"><div class="empty">选择一张增强任务查看原文</div></section></div>
  </main>
  <script>
    const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const headers=()=>window.getRequestAuthHeaders?window.getRequestAuthHeaders():{};let selected=0;
    async function api(query,options={}){const response=await fetch('/api/admin/knowledge-enrichment/index.php?'+new URLSearchParams(query),{cache:'no-store',...options,headers:{...headers(),...(options.headers||{})}});const payload=await response.json();if(!response.ok||payload.code)throw new Error(payload.message||'请求失败');return payload.data}
    async function load(){const query={action:'list'};['review_status','enrichment_status','task_type','risk_flag','source_length','keyword'].forEach(key=>{const value=$(key).value.trim();if(value)query[key]=value});$('status').textContent='正在加载';try{const data=await api(query);render(data.items||[]);$('status').textContent='当前显示 '+(data.items||[]).length+' 条'}catch(error){$('status').textContent=error.message}}
    function render(items){$('queue').innerHTML=items.length?items.map(item=>'<div class="item'+(Number(item.id)===selected?' active':'')+'"><label><input type="checkbox" data-select="'+item.id+'"> '+esc(item.title||'未命名知识')+'</label><button class="item-link" data-id="'+item.id+'"><div class="meta">'+esc(item.task_type)+' · '+esc(item.review_status)+' · version '+esc(item.source_version_id)+'</div></button></div>').join(''):'<div class="empty">当前筛选没有增强任务</div>'}
    async function openItem(id){selected=id;try{const item=await api({action:'item',id});const draft=item.enriched_content_json?JSON.parse(item.enriched_content_json):{};$('detail').innerHTML='<h2>'+esc(item.title)+'</h2><p class="meta">知识ID '+esc(item.knowledge_item_id)+' · 源版本 '+esc(item.source_version_id)+'</p><h3>完整原文</h3><div class="detail">'+esc(item.source_content||'原文为空')+'</div><h3>增强稿 JSON</h3><textarea id="content" class="detail">'+esc(JSON.stringify(draft,null,2))+'</textarea><div class="actions"><button data-action="save">保存草稿</button><textarea id="note" placeholder="填写审核意见"></textarea><div><button data-decision="approve">通过</button><button class="reject" data-decision="reject">退回</button></div></div>'}catch(error){$('status').textContent=error.message}}
    async function save(){try{await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'save',id:selected,content:$('content').value})});$('status').textContent='草稿已保存'}catch(error){$('status').textContent=error.message}}
    async function decide(decision){const note=$('note')?.value.trim()||'';if(!note){$('status').textContent='请填写审核意见';return}try{await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'decision',id:selected,decision,note})});selected=0;$('detail').innerHTML='<div class="empty">审核完成，请选择下一张</div>';await load()}catch(error){$('status').textContent=error.message}}
    async function release(action){const batch=$('batch').value.trim();if(!batch){$('status').textContent='请填写发布批次';return}if(action==='report'){try{$('status').textContent=JSON.stringify(await api({action:'report',release_batch_id:batch}));}catch(error){$('status').textContent=error.message}return}const ids=[...document.querySelectorAll('[data-select]:checked')].map(node=>Number(node.dataset.select));try{const data=action==='publish'?await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,ids,release_batch_id:batch})}):await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,release_batch_id:batch})});$('status').textContent=JSON.stringify(data);await load()}catch(error){$('status').textContent=error.message}}
    $('queue').addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(button)openItem(Number(button.dataset.id))});$('detail').addEventListener('click',event=>{const decision=event.target.closest('[data-decision]');if(decision)decide(decision.dataset.decision);const saveButton=event.target.closest('[data-action="save"]');if(saveButton)save()});$('publish').addEventListener('click',()=>release('publish'));$('report').addEventListener('click',()=>release('report'));$('rollback').addEventListener('click',()=>release('rollback'));$('reload').addEventListener('click',load);document.querySelectorAll('.toolbar select').forEach(node=>node.addEventListener('change',load));$('keyword').addEventListener('keydown',event=>{if(event.key==='Enter')load()});load();
  </script>
</body>
</html>
