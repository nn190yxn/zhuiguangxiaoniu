<body class="mobile-shell mobile-shell--workload">
<header class="header"><button class="back" id="backButton" onclick="leaveWorkload()">返回</button><div class="title">工作量日报</div><span style="width:48px"></span></header>
<main class="wrap">
  <section class="hero"><h1>今日工作量</h1><p>按岗位提交当天行为、过程和结果指标。系统会基于这些数据生成门店和总部经营看板。</p><div class="identity-card" aria-label="当前员工身份"><div class="identity-item"><span class="identity-label">姓名</span><span class="identity-value" id="identityName">读取中</span></div><div class="identity-item"><span class="identity-label">门店</span><span class="identity-value" id="identityStore">读取中</span></div><div class="identity-item"><span class="identity-label">岗位</span><span class="identity-value" id="identityRole">读取中</span></div></div></section>
    <section class="card state-panel" id="reportStatePanel"><div class="state-line"><span class="state-pill" id="statePill">读取状态</span><span class="deadline" id="deadlineText">日报截止时间读取中</span></div><div class="progress-line"><span class="daily-target">每日目标 <span id="targetPoints">4</span> 点</span><span class="save-meta" id="saveMeta">尚未保存</span></div><div class="progress-line"><span class="progress-copy" id="progressText">有效 0 点，还差 4 点</span><span class="daily-summary" id="pointBreakdown">已报 0 点，待审核 0 点，已驳回 0 点</span></div><div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div><div class="daily-note" id="dailyActionText">正在读取每日工作量状态...</div></section>
    <section class="card" id="dailyClosureCard"><div class="daily-summary" id="yesterdayMakeupText">上一工作日可补状态读取中...</div><div class="penalty-summary" id="penaltySummaryText">本月处罚状态读取中...</div><details id="conversionDetails"><summary class="conversion-summary">工作量怎么算</summary><div class="conversion-table" id="conversionTable">正在读取换算规则...</div></details></section>
  <section class="card">
    <div class="grid">
      <div class="field"><label>日期</label><input type="date" id="reportDate" onchange="onScopeChange('date')"></div>
      <div class="field"><label>岗位</label><select id="roleCode" onchange="onScopeChange('role')"><option value="sales">销售顾问</option><option value="coach">教练</option><option value="manager">店长</option><option value="teaching_supervisor">教学主管</option><option value="supervisor">督导</option></select></div>
    </div>
    <div class="field"><label>门店</label><select id="storeId" onchange="onScopeChange('store')"><option value="">请选择门店</option></select><div class="status" id="storeHint" style="margin-top:6px">正在识别门店...</div></div>
    <div class="status" id="statusText">准备加载日报模板...</div>
  </section>
  <section class="card" id="metricCard"><div class="empty">模板加载中...</div></section>
  <section class="card"><div class="field"><label>备注</label><textarea id="remarks" rows="3" oninput="markDirty()" placeholder="填写今日特殊情况或需要店长/总部关注的问题"></textarea></div><div class="success-panel" id="successPanel"></div></section>
</main>
<nav class="bottom-nav mobile-shell-nav" aria-label="一级导航"><a class="active" href="/mobile/workload-v2.html" aria-current="page">工作量</a><a href="/mobile/drill.html">演练</a><a href="/mobile/mine.html">我的</a></nav>
<div class="actions"><span class="busy-note" id="busyNote"></span><button class="btn btn-secondary" id="draftButton" onclick="saveReport('draft')">保存草稿</button><button class="btn btn-primary" id="submitButton" onclick="saveReport('submitted')">提交日报</button></div>
<div id="previewMask" class="preview-mask" role="dialog" aria-modal="true" aria-labelledby="previewTitle" aria-hidden="true" onclick="closePreview(event)"><div class="preview-dialog"><h2 id="previewTitle" class="sr-only">凭证图片预览</h2><button type="button" class="preview-close" id="previewClose" aria-label="关闭凭证预览" onclick="closePreview(event)">×</button><img id="previewImage" class="preview-image" alt="凭证预览"></div></div>
<script src="/assets/pages/workload-v2.js?v=r2"></script>
</body>
</html>
