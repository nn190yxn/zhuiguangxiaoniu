<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FAB问题训练</title><link rel="stylesheet" href="/css/mobile-shell.css"><style>body{margin:0;background:#f7f4f1;color:#201b18;font:16px sans-serif;padding:16px 16px 90px}.wrap{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;border:1px solid #eee7e2}.question{font-size:22px;font-weight:800;line-height:1.55}.muted{color:#766c66;font-size:13px;line-height:1.6}.score{background:#fff0e9;padding:12px;border-radius:12px;margin-top:12px}.answer{width:100%;min-height:150px;padding:12px;border:1px solid #eee7e2;border-radius:12px;box-sizing:border-box;font:inherit}.action{width:100%;border:0;border-radius:12px;padding:13px;background:#ff6b35;color:#fff;font-weight:800;margin-top:12px}.secondary{background:#f2ece7;color:#201b18}.nav{position:fixed;bottom:0;left:0;right:0;background:#201f25;color:#fff;padding:16px;text-align:center}.error{color:#b42318;background:#feeceb;padding:12px;border-radius:12px;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><h1>FAB问题训练</h1><a href="/mobile/drill.html">返回演练中心</a></div><p class="muted">每次5题。围绕家长问题回答，系统重点评价核心意思覆盖度、F特性、A优势、B利益、风险表达和话术自然度。</p><section id="app" class="card">正在加载 FAB 题库...</section></main><nav class="nav">FAB 独立训练</nav><script src="/js/api-client.js?v=4"></script><script src="/js/app-auth.js?v=3"></script><script>var state={session:null,question:null,index:0};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(p){return ApiClient.get(p,{redirectOnUnauthorized:true,timeout:15000})}function post(p,b){return ApiClient.post(p,b,{redirectOnUnauthorized:true,timeout:30000,idempotencyKey:'fab-'+Date.now()+'-'+Math.random()})}function showError(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message||'接口返回异常，请稍后重试')+'</div><button class="action secondary" onclick="start()">重新加载</button>'}function render(){var q=state.question||{};document.getElementById('app').innerHTML='<div class="muted">第 '+(state.index+1)+' / 5 题</div><div class="question">'+esc(q.question||'暂无题目')+'</div><div class="score">请回答：先说 F 特性，再说 A 优势，最后连接 B 对孩子和家长的实际利益。</div><textarea id="answer" class="answer" placeholder="输入你的回答"></textarea><button class="action" onclick="submitAnswer()">提交回答</button>'}async function start(){try{var r=await post('/api/drill/v2/qa/sessions.php',{action:'create',section_code:'all',question_count:5}),d=r.data||{};state.session=d.session;state.question=d.question;state.index=0;render()}catch(e){showError(e)}}async function submitAnswer(){var el=document.getElementById('answer'),answer=el.value.trim();if(!answer){el.focus();return}try{var r=await post('/api/drill/v2/qa/submit.php',{session_id:state.session.session_id,answer:answer}),d=r.data||{};if(d.question){state.question=d.question;state.index++;render()}else{document.getElementById('app').innerHTML='<h2>本次训练完成</h2><p class="muted">回答已提交，正在生成训练反馈。</p><button class="action" onclick="loadResult()">查看反馈</button>'}}catch(e){showError(e)}}async function loadResult(){try{var r=await get('/api/drill/v2/qa/detail.php?session_id='+state.session.session_id),d=r.data||{};document.getElementById('app').innerHTML='<h2>FAB训练反馈</h2><p class="muted">'+esc(d.level_name||'已完成')+'</p><div class="score">总分：'+esc(d.total_score||0)+'</div><p>'+esc(d.summary||d.feedback||'已完成本次 FAB 问答。')+'</p>'}catch(e){showError(e)}}start();</script></body></html>
