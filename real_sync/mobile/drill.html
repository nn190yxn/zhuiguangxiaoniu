<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/pwa/icon.svg">
<script src="/js/app-auth.js?v=3"></script>
<script src="/js/api-client.js?v=3"></script>
<script defer src="/js/mobile-pwa.js"></script>
<style>
:root{--orange:#ff6b35;--ink:#201b18;--muted:#766c66;--line:#eee7e2;--bg:#f7f4f1;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:84px}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0}.top button,.chip,.action{border:0;border-radius:12px;padding:9px 12px;font-weight:700}.top button,.chip{background:#f2ece7;color:var(--ink)}main{max-width:680px;margin:auto;padding:14px}.notice{display:none;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff1d6;color:#8a5a00;font-size:13px;line-height:1.5}.notice.show{display:block}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#ff6b35,#ff995e);color:#fff}.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:0;line-height:1.65;font-size:13px}.statrow,.grid{display:grid;gap:10px}.statrow{grid-template-columns:repeat(3,1fr);margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:12px}.stat b{display:block;font-size:21px;color:var(--orange)}.stat span,.muted{color:var(--muted);font-size:12px}.section{margin-top:18px}.section h3{font-size:16px;margin:0 0 10px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:15px}.card h4{font-size:15px;margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.card button{margin-top:12px}.action{background:var(--orange);color:#fff;width:100%}.action.secondary{background:#fff0e9;color:#bd4c20}.list{display:grid;gap:9px}.row{padding:13px;border-radius:14px;background:#fff;border:1px solid var(--line)}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-block;margin-top:7px;border-radius:99px;padding:3px 7px;background:#fff1d6;color:#8a5a00;font-size:11px;font-weight:700}.dialog{display:none;position:fixed;inset:0;z-index:9;background:#0007;padding:18px;align-items:end}.dialog.show{display:flex}.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;margin:auto;background:#fff;border-radius:22px 22px 16px 16px;padding:18px}.sheet h2{font-size:19px;margin:0 0 10px}.sheet textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}.turns{max-height:200px;overflow:auto;margin:10px 0}.turn{padding:9px 11px;margin:7px 0;border-radius:12px;background:#f7f3f0;line-height:1.5}.turn.employee{background:#fff0e9}.progress{height:8px;background:#eee6e0;border-radius:99px;overflow:hidden;margin:7px 0}.progress i{display:block;height:100%;background:var(--orange)}.audio-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.audio-tools button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700}.audio-tools button.recording{background:#feeceb;color:#b42318}.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;padding:7px 0 max(7px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:4px}.nav a.active{color:var(--orange);font-weight:800}.empty{padding:16px;text-align:center;color:var(--muted);background:#fff;border-radius:14px}@media(max-width:380px){.statrow{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(min-width:700px){body{padding-bottom:24px}.nav{position:static;max-width:680px;margin:auto;border:0;background:transparent}.nav a{background:#fff;margin:4px;border-radius:12px}}
</style>
<link rel="stylesheet" href="/css/mobile-shell.css">
</head>
<body class="mobile-shell mobile-shell--drill">
<header class="top"><h1>销售演练</h1><button type="button" onclick="refreshAll()">刷新状态</button></header>
<main>
<div id="networkNotice" class="notice" role="status"></div>
<section class="hero"><h2>把下一次沟通练得更稳</h2><p>从准备学习到多轮对练，完成后查看证据化反馈和下一步建议。</p></section>
<section class="statrow" aria-label="演练概览"><div class="stat"><b id="requiredCount">-</b><span>待处理任务</span></div><div class="stat"><b id="reviewCount">-</b><span>待复核</span></div><div class="stat"><b id="growthLevel">-</b><span>当前成长等级</span></div></section>
<section class="section"><h3>开始训练</h3><div class="grid"><article class="card"><h4>新签训练</h4><p>八个销售板块和完整流程诊断。</p><button class="action" onclick="openCatalog('new_sign')">查看新签练习</button></article><article class="card"><h4>续费训练</h4><p>按已发布的续费场景持续练习。</p><button class="action" onclick="openCatalog('renewal')">查看续费练习</button></article><article class="card"><h4>必修任务</h4><p>按截止时间完成指定训练与认证。</p><button class="action secondary" onclick="openAssignments()">查看任务</button></article><article class="card"><h4>自由对练</h4><p>选择已发布场景，进行文本或语音对话。</p><button class="action secondary" onclick="openCatalog()">开始自由练习</button></article></div></section>
<section class="section"><h3>成长等级</h3><div id="growth" class="empty">正在读取成长进度...</div></section>
<section class="section"><h3>历史与认证</h3><div id="history" class="empty">正在读取演练记录...</div></section>
</main>
<div id="sheet" class="dialog" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true"><section class="sheet" tabindex="-1"><button class="chip" type="button" onclick="closeSheet()">关闭</button><h2 id="sheetTitle">演练</h2><div id="sheetBody"></div></section></div>
<nav class="nav mobile-shell-nav" aria-label="一级导航"><a href="/mobile/workload.html">工作量</a><a class="active" href="/mobile/drill.html" aria-current="page">演练</a><a href="/mobile/mine.html">我的</a></nav>
<script>
var drill={home:null,attempt:null,recording:null,media:[],poll:null,returnFocus:null};
function id(){return 'drill-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function notice(text){var el=document.getElementById('networkNotice');el.textContent=text;el.classList.add('show')}
function apiGet(path){return ApiClient.get(path,{redirectOnUnauthorized:true,timeout:15000})}
function apiPost(path,payload){return ApiClient.post(path,payload,{redirectOnUnauthorized:true,timeout:30000,idempotencyKey:id(),onConflict:function(error){notice(error.message||'状态已更新，正在刷新权威状态');refreshAll()}})}
function sheetFocusables(){return Array.prototype.slice.call(document.querySelectorAll('#sheet button:not([disabled]),#sheet input:not([disabled]),#sheet textarea:not([disabled]),#sheet select:not([disabled]),#sheet a[href]'))}
function openSheet(title,body){var sheet=document.getElementById('sheet');if(!sheet.classList.contains('show'))drill.returnFocus=document.activeElement;document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;sheet.classList.add('show');sheet.setAttribute('aria-hidden','false');var items=sheetFocusables();if(items.length)items[0].focus();else sheet.querySelector('.sheet').focus()}
function closeSheet(){var sheet=document.getElementById('sheet');clearTimeout(drill.poll);sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');if(drill.returnFocus&&drill.returnFocus.focus)drill.returnFocus.focus();drill.returnFocus=null}
document.getElementById('sheet').addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();closeSheet();return}if(event.key!=='Tab')return;var items=sheetFocusables();if(!items.length)return;var first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
function statusLabel(s){return ({assigned:'待开始',in_progress:'进行中',awaiting_review:'待复核',coaching_required:'需辅导',passed:'已通过',retry_available:'可重练',ai_evaluating:'正在评分'})[s]||s||'处理中'}
async function refreshAll(){try{var all=await Promise.all([apiGet('/api/drill/v2/home.php'),apiGet('/api/drill/v2/progress.php'),apiGet('/api/drill/v2/results.php')]);drill.home=all[0].data||{};var a=drill.home.assignments||{};document.getElementById('requiredCount').textContent=(a.assigned||0)+(a.in_progress||0)+(a.retry_available||0);document.getElementById('reviewCount').textContent=a.awaiting_review||0;renderGrowth(all[1].data||{});renderHistory(all[2].data||{});if(navigator.onLine)document.getElementById('networkNotice').classList.remove('show')}catch(e){notice(e.message||'网络不可用，已保留最近完成的本地恢复信息。')}}
function renderGrowth(data){var levels=data.growth_levels||[], mastery=data.mastery||[], level=levels[0]||{};document.getElementById('growthLevel').textContent=level.level_name||level.level_code||'待诊断';document.getElementById('growth').innerHTML=mastery.length?mastery.map(function(x){var score=Number(x.effective_best_score||x.latest_score||0);return '<div class="row"><strong>'+esc(x.stage_name||'完整流程')+' <span class="muted">最近 '+score+' 分</span></strong><div class="progress"><i style="width:'+Math.min(100,score)+'%"></i></div><small>有效最佳 '+esc(x.effective_best_score||0)+' 分</small></div>'}).join(''):'暂无已评分记录，完成一次练习后会生成成长进度。'}
function renderHistory(data){var list=data.items||[];document.getElementById('history').innerHTML=list.length?'<div class="list">'+list.slice(0,5).map(function(x){return '<button class="row" type="button" onclick="openResult('+Number(x.attempt_id)+')"><strong>'+esc(x.evaluation_context||'销售演练')+' '+esc(x.total_score==null?'评分中':x.total_score+' 分')+'</strong><small>'+esc(x.completed_at||x.started_at||'进行中')+' · '+esc(statusLabel(x.evaluation_status||x.attempt_status))+(x.certification_id?' · 已认证':'')+'</small></button>'}).join('')+'</div>':'暂无演练历史。'}
async function openAssignments(){try{var res=await apiGet('/api/drill/v2/assignments.php'),items=res.data.items||[];openSheet('必修任务',items.length?'<div class="list">'+items.map(function(x){var item=(x.items||[])[0]||{};return '<div class="row"><strong>'+esc(x.plan_name)+'</strong><small>'+esc(item.scenario_title||'训练场景')+' · 截止 '+esc(x.due_at||'未设置')+'</small><span class="pill">'+esc(statusLabel(x.status))+'</span><button class="action" onclick="startAssignment('+Number(x.assignment_id)+','+Number(item.plan_item_id||0)+')">'+(x.current_attempt_id?'恢复演练':'开始任务')+'</button></div>'}).join('')+'</div>':'当前没有必修任务。')}catch(e){notice(e.message)}}
async function openCatalog(domain){try{var res=await apiGet('/api/drill/v2/catalog.php'),items=(res.data.items||[]).filter(function(x){return !domain||x.domain_code===domain});openSheet(domain==='new_sign'?'新签训练':domain==='renewal'?'续费训练':'自由练习',items.length?'<div class="list">'+items.map(function(x){return '<div class="row"><strong>'+esc(x.stage_name)+' · '+esc(x.title)+'</strong><small>'+esc((x.objectives||[]).join('；'))+'</small><button class="action" onclick="preparePractice('+Number(x.scenario_version_id)+')">准备学习</button></div>'}).join('')+'</div>':'当前没有可用场景。')}catch(e){notice(e.message)}}
async function preparePractice(versionId){try{var res=await apiGet('/api/drill/v2/catalog.php');var item=(res.data.items||[]).filter(function(x){return Number(x.scenario_version_id)===versionId})[0];if(!item)throw new Error('场景已更新，请刷新目录');openSheet('准备学习','<div class="row"><strong>'+esc(item.title)+'</strong><small>目标：'+esc((item.objectives||[]).join('；'))+'</small><small>关键动作：'+esc((item.key_actions||[]).join('；'))+'</small><button class="action" onclick="startSelfPractice('+Number(item.scenario_version_id)+')">开始自由练习</button></div>')}catch(e){notice(e.message)}}
async function startAssignment(assignmentId,itemId){try{var res=await apiPost('/api/drill/v2/attempts.php',{action:'create',assignment_id:assignmentId,plan_item_id:itemId,session_goal:{source:'pwa'}});openConversation((res.data||{}).attempt||{},res.data||{})}catch(e){notice(e.message)}}
async function startSelfPractice(scenarioVersionId){try{var res=await apiPost('/api/drill/v2/attempts.php',{action:'create_self_practice',scenario_version_id:scenarioVersionId,session_goal:{source:'pwa_catalog'}});openConversation((res.data||{}).attempt||{},res.data||{})}catch(e){notice(e.message)}}
function openConversation(attempt,data){attempt.id=Number(attempt.id||attempt.attempt_id||0);drill.attempt=attempt;var turns=data.turns||[];openSheet('多轮对练','<div id="turns" class="turns">'+renderTurns(turns)+'</div><div id="stageProgress">'+renderStages(data.stage_progress||[])+'</div><textarea id="turnText" placeholder="输入本轮回答。语音权限不可用时可直接使用文本。"></textarea><div class="audio-tools"><button id="recordBtn" type="button" onclick="toggleRecord()">开始录音</button><button type="button" onclick="submitTurn()">发送文本</button></div><button id="playAudio" class="chip" type="button" onclick="playLatestAudio()" disabled>播放最近录音</button><button class="action secondary" onclick="finishAttempt()">结束并进入评分</button><div class="muted" id="conversationState">语音会按分片上传；网络恢复后可继续上传并从最近完整轮次恢复。</div>')}
function renderTurns(items){return items.map(function(t){return '<div class="turn '+(t.speaker==='employee'?'employee':'')+'"><strong>'+esc(t.speaker==='employee'?'我':'AI 客户')+'</strong><br>'+esc(t.content)+'</div>'}).join('')||'<div class="muted">准备好后完成第一轮回应。</div>'}
function renderStages(items){return items.length?items.map(function(x){return '<div class="muted">'+esc(x.stage_name||'当前板块')+' '+esc(x.status||'进行中')+'</div>'}).join(''):''}
async function submitTurn(){var text=document.getElementById('turnText').value.trim();if(!text||!drill.attempt)return;try{var res=await apiPost('/api/drill/v2/turns.php',{attempt_id:drill.attempt.id,status_version:drill.attempt.status_version,content:text});var data=res.data||{};if(res.status===202||data.status==='retry_pending'){notice('客户回应正在生成，正在刷新状态');pollStatus(drill.attempt.id);return}openConversation(data.attempt||drill.attempt,data)}catch(e){notice(e.message)}}
async function finishAttempt(){if(!drill.attempt)return;try{var res=await apiPost('/api/drill/v2/attempts.php',{action:'end',attempt_id:drill.attempt.id,status_version:drill.attempt.status_version});notice('评分任务已提交，正在等待结果');pollStatus((res.data&&res.data.attempt&&res.data.attempt.id)||drill.attempt.id)}catch(e){notice(e.message)}}
async function pollStatus(attemptId){try{var res=await apiGet('/api/drill/v2/attempt-status.php?attempt_id='+encodeURIComponent(attemptId)),data=res.data||{},evaluation=(data.evaluations||[])[0]||{};document.getElementById('conversationState')&& (document.getElementById('conversationState').textContent='当前状态：'+statusLabel(evaluation.status||data.attempt&&data.attempt.status));if(['completed','failed'].indexOf(evaluation.status)>=0){await openResult(attemptId);return}drill.poll=setTimeout(function(){pollStatus(attemptId)},Math.max(2,Number(data.poll_after_seconds||2))*1000)}catch(e){notice('状态刷新失败，网络恢复后可在历史记录查看：'+e.message)}}
async function openResult(attemptId){try{var res=await apiGet('/api/drill/v2/results.php?attempt_id='+encodeURIComponent(attemptId)),item=(res.data.items||[])[0]||{},report=item.report||{},recommend=await apiGet('/api/drill/v2/learning.php');var recommendations=(recommend.data.recommendations||[]).filter(function(x){return Number(x.attempt_id||0)===Number(attemptId)});openSheet('完整流程报告','<div class="row"><strong>总分 '+esc(item.total_score==null?'评分中':item.total_score)+' · '+esc(report.evaluation_grade||'待评级')+'</strong><small>'+esc(report.overall_conclusion||report.summary||'评分完成后将展示整体结论。')+'</small></div><h3>四段反馈</h3>'+feedbackHtml(report)+'<h3>学习推荐</h3>'+recommendations.map(function(x){return '<div class="row"><strong>'+esc(x.title||x.criterion_code)+'</strong><small>'+esc(x.evidence_json||'根据本次证据推荐')+'</small></div>'}).join('')+'<h3>认证详情</h3><div class="row"><strong>'+esc(item.certification_id?'已生成认证记录':'当前尚未认证')+'</strong><small>'+esc(item.certified_at||'评分或人工复核完成后更新')+'</small></div>')}catch(e){notice(e.message)}}
function feedbackHtml(report){var sections=[['做得好的地方',report.strengths],['需要改进的地方',report.improvements],['下一次优化方法',report.smart_tasks||report.next_actions],['对应学习资源',report.learning_recommendations]];return sections.map(function(x){var v=Array.isArray(x[1])?x[1].join('；'):x[1]||'评分完成后生成';return '<div class="row"><strong>'+x[0]+'</strong><small>'+esc(v)+'</small></div>'}).join('')}
async function sha256(blob){var bytes=await blob.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
async function toggleRecord(){if(drill.recording){drill.recording.stop();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){notice('当前设备无法录音，请使用文本输入');return}try{var stream=await navigator.mediaDevices.getUserMedia({audio:true}),parts=[],rec=new MediaRecorder(stream);drill.recording=rec;document.getElementById('recordBtn').textContent='结束录音';document.getElementById('recordBtn').classList.add('recording');rec.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};rec.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});drill.recording=null;document.getElementById('recordBtn').textContent='开始录音';document.getElementById('recordBtn').classList.remove('recording');await uploadRecording(new Blob(parts,{type:rec.mimeType||'audio/webm'}))};rec.start(1000)}catch(e){notice('录音权限未授予，可使用文本辅助输入。')}}
async function uploadRecording(blob){if(!drill.attempt)return;try{var checksum=await sha256(blob),asset=await apiPost('/api/drill/v2/audio-assets.php',{attempt_id:drill.attempt.id,mime_type:blob.type||'audio/webm',byte_size:blob.size,checksum:checksum,asset_type:'turn_recording',purpose_code:'drill_training',consent_status:'not_required',retention_days:180,access_scope:{owner:true,reviewer:true}}),audio=(asset.data||{}).audio_asset||asset.data||{},assetId=audio.audio_asset_id||audio.id;if(!assetId)throw new Error('音频资源创建失败');drill.audioAssetId=assetId;document.getElementById('playAudio').disabled=false;var base64=await new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1])};reader.onerror=reject;reader.readAsDataURL(blob)});await apiPost('/api/drill/v2/audio-chunks.php',{audio_asset_id:assetId,chunk_no:1,checksum:checksum,byte_size:blob.size,content_base64:base64});var transcript=window.prompt('请确认本轮转写文本；可在语音转写服务接入后自动填充。','');if(!transcript||!transcript.trim())throw new Error('请补充本轮文本后再继续对练');var finalized=await apiPost('/api/drill/v2/turns/finalize.php',{attempt_id:drill.attempt.id,audio_asset_id:assetId,expected_chunks:1,final_transcript_text:transcript.trim(),provider:'pwa_text_fallback',status_version:drill.attempt.status_version});var turn=(finalized.data||{}).turn||{};drill.attempt.status_version=Number(turn.status_version||drill.attempt.status_version);notice('录音已上传并完成本轮对练');pollStatus(drill.attempt.id)}catch(e){try{localStorage.setItem('drill_audio_recovery_'+drill.attempt.id,JSON.stringify({at:Date.now(),size:blob.size}))}catch(ignore){}notice('上传中断，网络恢复后可从当前实例继续：'+e.message)}}
async function playLatestAudio(){if(!drill.audioAssetId)return;try{var res=await apiGet('/api/drill/v2/audio-access.php?audio_asset_id='+encodeURIComponent(drill.audioAssetId)),data=res.data||{},url=data.url||data.public_locator||data.audio_url;if(!url)throw new Error('录音仍在处理中');await new Audio(url).play()}catch(e){notice(e.message||'录音暂时无法播放')}}
window.addEventListener('online',function(){notice('网络已恢复，正在刷新服务端权威状态');refreshAll();if(drill.attempt)pollStatus(drill.attempt.id)});window.addEventListener('offline',function(){notice('当前离线：写请求保持在线发送，完成轮次与本地恢复信息已保留。')});window.addEventListener('DOMContentLoaded',function(){refreshAll()});
</script>
</body>
</html>
