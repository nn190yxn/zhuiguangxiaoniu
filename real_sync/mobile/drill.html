<style>
:root{--orange:#ff6b35;--ink:#201b18;--muted:#766c66;--line:#eee7e2;--bg:#f7f4f1;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:84px}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(14px);padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.top h1{font-size:18px;margin:0}.top button,.chip,.action{border:0;border-radius:12px;padding:9px 12px;font-weight:700}.top button,.chip{background:#f2ece7;color:var(--ink)}main{max-width:680px;margin:auto;padding:14px}.notice{display:none;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff1d6;color:#8a5a00;font-size:13px;line-height:1.5}.notice.show{display:block}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,#ff6b35,#ff995e);color:#fff}.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:0;line-height:1.65;font-size:13px}.statrow,.grid{display:grid;gap:10px}.statrow{grid-template-columns:repeat(3,1fr);margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.stat{padding:12px}.stat b{display:block;font-size:21px;color:var(--orange)}.stat span,.muted{color:var(--muted);font-size:12px}.section{margin-top:18px}.section h3{font-size:16px;margin:0 0 10px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:15px}.card h4{font-size:15px;margin:0 0 6px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.card button{margin-top:12px}.action{background:var(--orange);color:#fff;width:100%}.action.secondary{background:#fff0e9;color:#bd4c20}.list{display:grid;gap:9px}.row{padding:13px;border-radius:14px;background:#fff;border:1px solid var(--line)}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-block;margin-top:7px;border-radius:99px;padding:3px 7px;background:#fff1d6;color:#8a5a00;font-size:11px;font-weight:700}.dialog{display:none;position:fixed;inset:0;z-index:9;background:#0007;padding:18px;align-items:end}.dialog.show{display:flex}.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;margin:auto;background:#fff;border-radius:22px 22px 16px 16px;padding:18px}.sheet h2{font-size:19px;margin:0 0 10px}.sheet textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical}.turns{max-height:200px;overflow:auto;margin:10px 0}.turn{padding:9px 11px;margin:7px 0;border-radius:12px;background:#f7f3f0;line-height:1.5}.turn.employee{background:#fff0e9}.progress{height:8px;background:#eee6e0;border-radius:99px;overflow:hidden;margin:7px 0}.progress i{display:block;height:100%;background:var(--orange)}.audio-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.audio-tools button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700}.audio-tools button.recording{background:#feeceb;color:#b42318}.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;padding:7px 0 max(7px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12px;padding:4px}.nav a.active{color:var(--orange);font-weight:800}.empty{padding:16px;text-align:center;color:var(--muted);background:#fff;border-radius:14px}@media(max-width:380px){.statrow{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}@media(min-width:700px){body{padding-bottom:24px}.nav{position:static;max-width:680px;margin:auto;border:0;background:transparent}.nav a{background:#fff;margin:4px;border-radius:12px}}
</style>
<link rel="stylesheet" href="/css/mobile-shell.css">
</head>
<body class="mobile-shell mobile-shell--drill">
<header class="top"><h1>销售演练</h1><button type="button" onclick="refreshAll()">刷新状态</button></header>
<main>
<div id="networkNotice" class="notice" role="status"></div>
<section class="hero"><h2>把下一次沟通练得更稳</h2><p>从准备学习到多轮对练，完成后查看证据化反馈和下一步建议。</p></section>
<section class="statrow" aria-label="演练概览"><div class="stat"><b id="requiredCount">-</b><span>待处理任务</span></div><div class="stat"><b id="reviewCount">-</b><span>待复核</span></div><div class="stat"><b id="growthLevel">-</b><span>当前成长等级</span></div></section>
<section class="section"><h3>开始训练</h3><div class="grid"><article class="card"><h4>新签训练</h4><p>八个销售板块和完整流程诊断。</p><button class="action" onclick="openCatalog('new_signing')">查看新签练习</button></article><article class="card"><h4>续费训练</h4><p>按已发布的续费场景持续练习。</p><button class="action" onclick="openCatalog('renewal')">查看续费练习</button></article><article class="card"><h4>必修任务</h4><p>按截止时间完成指定训练与认证。</p><button class="action secondary" onclick="openAssignments()">查看任务</button></article><article class="card"><h4>自由对练</h4><p>按客户画像练习完整新签沟通。</p><button class="action secondary" onclick="openFreeChat()">选择客户开始</button></article></div></section>
<section class="section"><h3>成长等级</h3><div id="growth" class="empty">正在读取成长进度...</div></section>
<section class="section"><h3>历史与认证</h3><div id="history" class="empty">正在读取演练记录...</div></section>
</main>
<div id="sheet" class="dialog" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true"><section class="sheet" tabindex="-1"><button class="chip" type="button" onclick="closeSheet()">关闭</button><h2 id="sheetTitle">演练</h2><div id="sheetBody"></div></section></div>
<nav class="nav mobile-shell-nav" aria-label="一级导航"><a href="/mobile/workload.html">工作量</a><a class="active" href="/mobile/drill.html" aria-current="page">演练</a><a href="/mobile/mine.html">我的</a></nav>
<script>
var drill={home:null,attempt:null,recording:null,media:[],poll:null,returnFocus:null,turnDraft:null,stateDraft:null};
function id(){return 'drill-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function notice(text){var el=document.getElementById('networkNotice');el.textContent=text;el.classList.add('show');var sheet=document.getElementById('sheet'),body=document.getElementById('sheetBody');if(sheet&&sheet.classList.contains('show')&&body){var sheetNotice=document.getElementById('sheetNotice');if(!sheetNotice){sheetNotice=document.createElement('div');sheetNotice.id='sheetNotice';sheetNotice.className='notice show';body.parentNode.insertBefore(sheetNotice,body)}sheetNotice.textContent=text;sheetNotice.classList.add('show')}}
function apiGet(path){return ApiClient.get(path,{redirectOnUnauthorized:true,timeout:15000})}
function apiPost(path,payload){return ApiClient.post(path,payload,{redirectOnUnauthorized:true,timeout:30000,idempotencyKey:id(),onConflict:function(error){setConversationState('recovering');notice(error.message||'状态已更新，正在刷新权威状态');refreshAll()}})}
function sheetFocusables(){return Array.prototype.slice.call(document.querySelectorAll('#sheet button:not([disabled]),#sheet input:not([disabled]),#sheet textarea:not([disabled]),#sheet select:not([disabled]),#sheet a[href]'))}
function openSheet(title,body){var sheet=document.getElementById('sheet');if(!sheet.classList.contains('show'))drill.returnFocus=document.activeElement;var sheetNotice=document.getElementById('sheetNotice');if(sheetNotice)sheetNotice.remove();document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=body;sheet.classList.add('show');sheet.setAttribute('aria-hidden','false');var items=sheetFocusables();if(items.length)items[0].focus();else sheet.querySelector('.sheet').focus()}
function closeSheet(){var sheet=document.getElementById('sheet');clearTimeout(drill.poll);sheet.classList.remove('show');sheet.setAttribute('aria-hidden','true');if(drill.returnFocus&&drill.returnFocus.focus)drill.returnFocus.focus();drill.returnFocus=null}
document.getElementById('sheet').addEventListener('keydown',function(event){if(event.key==='Escape'){event.preventDefault();closeSheet();return}if(event.key!=='Tab')return;var items=sheetFocusables();if(!items.length)return;var first=items[0],last=items[items.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}});
function statusLabel(s){return ({assigned:'待开始',in_progress:'进行中',active:'正在对练',paused:'已暂停',turn_finalizing:'正在提交',evaluating:'正在评分',evaluated:'评分已完成',completed:'已完成',failed:'需重新开始',awaiting_review:'待复核',coaching_required:'需辅导',passed:'已通过',retry_available:'可重练',ai_evaluating:'正在评分'})[s]||s||'处理中'}
function setConversationState(status,detail){var labels={ready:'可直接输入文本继续对练。',submitting:'正在提交本轮文本。',recording:'正在录音，结束后将开始上传。',uploading:'正在上传录音。',customer_response:'客户回应生成中，正在同步最新状态。',evaluating:'评分任务已提交，正在等待结果。',recovering:'正在恢复服务端最新进度。',recoverable:'录音上传可在网络恢复后继续，文本输入保持可用。',text_fallback:'录音不可用，当前可直接使用文本输入。'},el=document.getElementById('conversationState');if(el)el.textContent=detail||labels[status]||labels.ready}
async function refreshAll(){try{var all=await Promise.all([apiGet('/api/drill/v2/home.php'),apiGet('/api/drill/v2/progress.php'),apiGet('/api/drill/v2/results.php')]);drill.home=all[0].data||{};var a=drill.home.assignments||{};document.getElementById('requiredCount').textContent=(a.assigned||0)+(a.in_progress||0)+(a.retry_available||0);document.getElementById('reviewCount').textContent=a.awaiting_review||0;renderGrowth(all[1].data||{});renderHistory(all[2].data||{});if(navigator.onLine)document.getElementById('networkNotice').classList.remove('show')}catch(e){notice(e.message||'网络不可用，已保留最近完成的本地恢复信息。')}}
function renderGrowth(data){var levels=data.growth_levels||[], mastery=data.mastery||[], level=levels[0]||{};document.getElementById('growthLevel').textContent=level.level_name||level.level_code||'待诊断';document.getElementById('growth').innerHTML=mastery.length?mastery.map(function(x){var score=Number(x.effective_best_score||x.latest_score||0);return '<div class="row"><strong>'+esc(x.stage_name||'完整流程')+' <span class="muted">最近 '+score+' 分</span></strong><div class="progress"><i style="width:'+Math.min(100,score)+'%"></i></div><small>有效最佳 '+esc(x.effective_best_score||0)+' 分</small></div>'}).join(''):'暂无已评分记录，完成一次练习后会生成成长进度。'}
function renderHistory(data){var list=data.items||[];document.getElementById('history').innerHTML=list.length?'<div class="list">'+list.slice(0,5).map(function(x){return '<button class="row" type="button" onclick="openResult('+Number(x.attempt_id)+')"><strong>'+esc(x.evaluation_context||'销售演练')+' '+esc(x.total_score==null?'评分中':x.total_score+' 分')+'</strong><small>'+esc(x.completed_at||x.started_at||'进行中')+' · '+esc(statusLabel(x.evaluation_status||x.attempt_status))+(x.certification_id?' · 已认证':'')+'</small></button>'}).join('')+'</div>':'暂无演练历史。'}
async function openAssignments(){try{var res=await apiGet('/api/drill/v2/assignments.php'),items=res.data.items||[];openSheet('必修任务',items.length?'<div class="list">'+items.map(function(x){var item=(x.items||[])[0]||{};return '<div class="row"><strong>'+esc(x.plan_name)+'</strong><small>'+esc(item.scenario_title||'训练场景')+' · 截止 '+esc(x.due_at||'未设置')+'</small><span class="pill">'+esc(statusLabel(x.status))+'</span><button class="action" onclick="startAssignment('+Number(x.assignment_id)+','+Number(item.plan_item_id||0)+')">'+(x.current_attempt_id?'恢复演练':'开始任务')+'</button></div>'}).join('')+'</div>':'当前没有必修任务。')}catch(e){notice(e.message)}}
async function openCatalog(domain){try{var res=await apiGet('/api/drill/v2/catalog.php'),items=(res.data.items||[]).filter(function(x){return !domain||x.domain_code===domain});openSheet(domain==='new_signing'?'新签训练':domain==='renewal'?'续费训练':'自由练习',items.length?'<div class="list">'+items.map(function(x){return '<div class="row"><strong>'+esc(x.stage_name)+' · '+esc(x.title)+'</strong><small>'+esc((x.objectives||[]).join('；'))+'</small><button class="action" onclick="preparePractice('+Number(x.scenario_version_id)+')">准备学习</button></div>'}).join('')+'</div>':'当前没有可用场景。')}catch(e){notice(e.message)}}
async function preparePractice(versionId){try{var res=await apiGet('/api/drill/v2/catalog.php');var item=(res.data.items||[]).filter(function(x){return Number(x.scenario_version_id)===versionId})[0];if(!item)throw new Error('场景已更新，请刷新目录');openSheet('准备学习','<div class="row"><strong>'+esc(item.title)+'</strong><small>目标：'+esc((item.objectives||[]).join('；'))+'</small><small>关键动作：'+esc((item.key_actions||[]).join('；'))+'</small><button class="action" onclick="startSelfPractice('+Number(item.scenario_version_id)+')">开始自由练习</button></div>')}catch(e){notice(e.message)}}
function optionList(items,placeholder){return '<option value="">'+esc(placeholder)+'</option>'+items.map(function(x){return '<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')}
function freeChatSelection(){var filters={};['age_band','primary_need','communication_style','current_status','course_tag'].forEach(function(key){var field=document.getElementById('free-'+key);if(field&&field.value)filters[key]=field.value});return {mode:'filtered',filters:filters}}
function freeChatQuery(selection){var query=['domain_code=new_signing'];Object.keys(selection.filters||{}).forEach(function(key){query.push(encodeURIComponent(key)+'='+encodeURIComponent(selection.filters[key]))});if(selection.mode==='random')query.push('mode=random');return '/api/drill/v2/catalog.php?'+query.join('&')}
async function openFreeChat(){try{var res=await apiGet('/api/drill/v2/catalog.php?domain_code=new_signing'),data=res.data||{},filters=data.filters||{};openSheet('自由对练：选择客户','<div class="row"><strong>随机客户</strong><small>系统从当前可用画像中抽取一位家长。</small><button class="action" onclick="startRandomFreeChat()">随机开始</button></div><div class="row"><strong>自主筛选</strong><small>可组合选择客户画像，筛选后查看具体客户。</small><label>年龄段<select id="free-age_band">'+optionList(filters.age_bands||[],'全部年龄段')+'</select></label><label>核心需求<select id="free-primary_need">'+optionList(filters.primary_needs||[],'全部核心需求')+'</select></label><label>沟通风格<select id="free-communication_style">'+optionList(filters.communication_styles||[],'全部沟通风格')+'</select></label><label>当前状态<select id="free-current_status">'+optionList(filters.current_statuses||[],'全部当前状态')+'</select></label><label>课程标签<select id="free-course_tag">'+optionList(filters.course_tags||[],'全部课程标签')+'</select></label><button class="action" onclick="showFreeChatResults()">查看匹配客户</button></div>')}catch(e){notice(e.message)}}
async function startRandomFreeChat(){try{var selection={mode:'random',filters:{}},res=await apiGet(freeChatQuery(selection)),item=(res.data.items||[])[0];if(!item)throw new Error('当前没有可随机开始的客户，请稍后重试');showFreeChatProfile(item,selection)}catch(e){notice(e.message)}}
async function showFreeChatResults(){try{var selection=freeChatSelection(),res=await apiGet(freeChatQuery(selection)),items=(res.data.items||[]);drill.freeChatSelection=selection;openSheet('匹配客户',items.length?'<div class="list">'+items.map(function(item){var profile=item.persona_summary||{};return '<div class="row"><strong>'+esc(profile.age_band||'客户')+' · '+esc(profile.primary_need||'需求待定')+'</strong><small>'+esc(profile.communication_style||'沟通风格待定')+' · '+esc(profile.current_status||'当前状态待定')+'</small><button class="action" onclick="openFreeChatProfile('+Number(item.scenario_version_id)+')">查看客户</button></div>'}).join('')+'</div>':'没有符合当前筛选条件的客户，请调整后重试。')}catch(e){notice(e.message)}}
async function openFreeChatProfile(versionId){try{var res=await apiGet(freeChatQuery(drill.freeChatSelection||freeChatSelection())),item=(res.data.items||[]).filter(function(x){return Number(x.scenario_version_id)===versionId})[0];if(!item)throw new Error('客户画像已更新，请重新筛选');showFreeChatProfile(item,drill.freeChatSelection||freeChatSelection())}catch(e){notice(e.message)}}
function showFreeChatProfile(item,selection){var profile=item.persona_summary||{},courses=profile.course_tags||[];openSheet('客户画像','<div class="row"><strong>'+esc(profile.age_band||'客户')+' · '+esc(profile.primary_need||'核心需求')+'</strong><small>沟通风格：'+esc(profile.communication_style||'待定')+'；当前状态：'+esc(profile.current_status||'待定')+'</small><small>课程匹配标签：'+esc(courses.join('、')||'待匹配')+'</small><small>对话目标：'+esc(((item.objectives||[]).join('；'))||'围绕客户需求完成诊断和方案引导。')+'</small><button class="action" onclick="startSelfPractice('+Number(item.scenario_version_id)+',drill.freeChatSelection)">开始完整对练</button></div>')}
async function startAssignment(assignmentId,itemId){try{var res=await apiPost('/api/drill/v2/attempts.php',{action:'create',assignment_id:assignmentId,plan_item_id:itemId,session_goal:{source:'pwa'}});openConversation((res.data||{}).attempt||{},res.data||{})}catch(e){notice(e.message)}}
async function startSelfPractice(scenarioVersionId,selectionContext){try{selectionContext=selectionContext||{mode:'filtered',filters:{}};if(selectionContext.mode==='random'&&!selectionContext.random_seed)selectionContext.random_seed=Date.now();var res=await apiPost('/api/drill/v2/attempts.php',{action:'create_self_practice',scenario_version_id:scenarioVersionId,session_goal:{source:'pwa_catalog'},selection_context:selectionContext});openConversation((res.data||{}).attempt||{},res.data||{})}catch(e){notice(e.message)}}
function draftIdentity(){if(!window.DraftStore||!window.AppAuth)return false;var user=window.AppAuth.getUserInfo&&window.AppAuth.getUserInfo()||{},userId=Number(user.user_id||user.id||0),staffId=Number(user.staff_id||0);if(!userId||!staffId)return false;try{window.DraftStore.setIdentity({userId:userId,staffId:staffId,sessionVersion:user.session_version||0});return true}catch(e){return false}}
function draftForAttempt(){if(!drill.attempt||!draftIdentity())return null;try{return window.DraftStore.create({domain:'sales_drill',objectType:'turn_text',objectId:String(drill.attempt.id),schemaVersion:'v2',allowedFields:['text']})}catch(e){return null}}
function activeAttemptDraft(){if(!draftIdentity())return null;try{return window.DraftStore.create({domain:'sales_drill',objectType:'active_attempt',objectId:'active',schemaVersion:'v2',allowedFields:['attempt_id','last_completed_turn_no','status_version','pending_action','recording_recovery']})}catch(e){return null}}
function saveAttemptDraft(extra){if(!drill.attempt)return;drill.stateDraft=drill.stateDraft||activeAttemptDraft();if(drill.stateDraft)drill.stateDraft.saveLocal(Object.assign({attempt_id:drill.attempt.id,last_completed_turn_no:Number(drill.attempt.last_completed_turn_no||0),status_version:Number(drill.attempt.status_version||0)},extra||{}),{baseStateVersion:drill.attempt.status_version})}
async function restoreActiveAttempt(){var draft=activeAttemptDraft(),record=draft&&draft.getLocal();if(!record||!record.payload||!record.payload.attempt_id)return;setConversationState('recovering');try{var res=await apiGet('/api/drill/v2/attempt-status.php?attempt_id='+encodeURIComponent(record.payload.attempt_id)),data=res.data||{};openConversation(data.attempt||{},data)}catch(e){setConversationState('recoverable');notice('本地演练草稿待网络恢复后继续：'+e.message)}}
function restoreTurnDraft(){drill.turnDraft=draftForAttempt();var record=drill.turnDraft&&drill.turnDraft.getLocal(),field=document.getElementById('turnText');if(record&&field&&record.payload&&record.payload.text)field.value=record.payload.text}
function saveTurnDraft(){var field=document.getElementById('turnText');if(drill.turnDraft&&field)drill.turnDraft.saveLocal({text:field.value},{baseStateVersion:drill.attempt.status_version})}
function openConversation(attempt,data){attempt.id=Number(attempt.id||attempt.attempt_id||0);drill.attempt=attempt;drill.practiceContext=data.practice_context||drill.practiceContext||{};drill.turns=data.turns||drill.turns||[];saveAttemptDraft();openSheet('多轮对练','<div id="practiceScenario">'+renderPracticeScenario(drill.practiceContext,drill.turns)+'</div><div id="turns" class="turns">'+renderTurns(drill.turns)+'</div><div id="stageProgress">'+renderStages(data.stage_progress||[])+'</div><section class="row" aria-label="录音输入"><strong>语音输入</strong><small id="microphonePermission">正在检查麦克风权限。</small><div class="audio-tools"><button id="recordBtn" type="button">开启麦克风</button><button id="submitTurnBtn" type="button">发送文本</button></div></section><label class="muted" for="turnText">文本辅助输入</label><textarea id="turnText" placeholder="输入本轮回答。麦克风权限受限时可直接使用文本。"></textarea><button id="playAudio" class="chip" type="button" onclick="playLatestAudio()" disabled>播放最近录音</button><button class="action secondary" onclick="finishAttempt()">结束并进入评分</button><div class="muted" id="conversationState"></div>');restoreTurnDraft();document.getElementById('turnText').addEventListener('input',saveTurnDraft);document.getElementById('recordBtn').addEventListener('click',toggleRecord);document.getElementById('submitTurnBtn').addEventListener('click',submitTurn);setConversationState('ready');refreshMicrophonePermission()}
function applyAttemptState(state){if(!state)return drill.attempt;var current=drill.attempt||{};var source=state.attempt||state;drill.attempt=Object.assign({},current,source);drill.attempt.id=Number(drill.attempt.id||drill.attempt.attempt_id||0);drill.attempt.status_version=Number(drill.attempt.status_version||current.status_version||0);saveAttemptDraft();return drill.attempt}
function renderTurns(items){return items.map(function(t){return '<div class="turn '+(t.speaker==='employee'?'employee':'')+'"><strong>'+esc(t.speaker==='employee'?'我':'AI 客户')+'</strong><br>'+esc(t.content)+'</div>'}).join('')||'<div class="muted">准备好后完成第一轮回应。</div>'}
function renderStages(items){if(!items.length)return '';var label=function(x){return esc(x.name||x.stage_name||x.stage_code||'未命名板块')},row=function(x){return '<div class="muted">'+label(x)+' '+esc(x.status||'进行中')+'</div>'},active=items.filter(function(x){return x.status==='active'}),completed=items.filter(function(x){return x.status==='completed'}),pending=items.filter(function(x){return x.status==='pending'}),html='';if(active.length)html+='<div class="muted"><strong>当前板块</strong></div>'+active.map(row).join('');if(completed.length)html+='<details class="muted"><summary>已完成板块（'+completed.length+'）</summary>'+completed.map(row).join('')+'</details>';if(pending.length)html+='<details class="muted"><summary>后续板块（'+pending.length+'）</summary>'+pending.map(row).join('')+'</details>';return html}
function profileText(value){var labels={attention:'专注力',height_growth:'长高',immunity:'免疫力',physical_foundation:'体能基础',exercise_habit:'运动习惯',social_confidence:'社交自信',price_sensitive:'价格敏感',detail_checking:'细节核对',result_oriented:'效果导向',goal_driven:'目标进取',rational_open:'理性开放',cautious_observer:'谨慎观望',new_to_course:'从未报课',comparing_providers:'正在比较机构'};return labels[value]||value||'待进一步了解'}
function renderPracticeScenario(context,turns){context=context||{};var scenario=context.scenario||{},persona=context.persona||{},stage=context.current_stage||{},history=(turns&&turns.length?turns:context.recent_turns||[]),latestCustomer='',objectives=scenario.objectives||[],expressions=scenario.standard_expressions||[],prompt=scenario.prompt_policy||{},pain=(persona.pain_points||[]).join('、'),role=[profileText(persona.age_band),profileText(persona.primary_need)+'需求家长'].join(' · '),situation=persona.current_status?profileText(persona.current_status):pain||scenario.title||'正在了解适合孩子的训练方案',opening=prompt.opening_question||persona.opening_question||'';for(var index=history.length-1;index>=0;index--){if(history[index].speaker==='customer'){latestCustomer=history[index].content||'';break}}if(latestCustomer)opening=latestCustomer;if(!opening)opening='孩子目前在'+profileText(persona.primary_need)+'方面让我比较担心，您会怎么建议？';if(!objectives.length)objectives=['围绕'+(stage.name||'当前环节')+'确认客户需求并给出匹配建议'];if(!expressions.length)expressions=['先确认客户的具体困扰，再结合孩子情况说明下一步建议。'];return '<section class="row" aria-label="当前环节模拟场景"><strong>当前环节模拟场景</strong><small>客户角色：'+esc(role)+'</small><small>当前情境：'+esc(situation)+'</small><small>客户开场问题：'+esc(opening)+'</small><small>练习目标：'+esc((stage.name?stage.name+'：':'')+objectives.join('；'))+'</small><small>参考表达：'+esc(expressions.join('；'))+'</small></section>'}
function showMicrophonePermission(state,detail){var el=document.getElementById('microphonePermission');if(!el)return;var messages={granted:'麦克风权限已开启，可开始录音。',prompt:'点击“开启麦克风”，浏览器将请求麦克风权限。',denied:'麦克风权限已被拒绝。请在浏览器地址栏的网站设置中开启麦克风权限，再返回本页继续练习。文本辅助输入可以继续完成本轮。',unsupported:'当前设备不支持录音。请使用文本辅助输入完成本轮。'};drill.microphonePermission=state;el.textContent=detail||messages[state]||messages.prompt}
async function refreshMicrophonePermission(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){showMicrophonePermission('unsupported');return}if(!navigator.permissions||!navigator.permissions.query){showMicrophonePermission('prompt');return}try{var permission=await navigator.permissions.query({name:'microphone'});showMicrophonePermission(permission.state);permission.onchange=function(){showMicrophonePermission(permission.state)}}catch(e){showMicrophonePermission('prompt')}}
async function submitTurn(){var text=document.getElementById('turnText').value.trim(),button=document.getElementById('submitTurnBtn');if(!drill.attempt){notice('当前演练已失效，请返回后重新开始。');return}if(!text){setConversationState('ready','请先输入本轮回答，再点击“发送文本”。');notice('请先输入本轮回答，再点击“发送文本”。');document.getElementById('turnText').focus();return}setConversationState('submitting');if(button){button.disabled=true;button.textContent='正在发送…'}try{var res=await apiPost('/api/drill/v2/turns.php',{attempt_id:drill.attempt.id,status_version:drill.attempt.status_version,content:text});if(drill.turnDraft)drill.turnDraft.clearLocal();var data=res.data||{};if(res.status===202||data.status==='retry_pending'){saveAttemptDraft({pending_action:'customer_response'});setConversationState('customer_response');pollStatus(drill.attempt.id);return}data.turns=(drill.turns||[]).concat([{speaker:'employee',content:text},{speaker:'customer',content:(data.customer_turn||{}).content||''}]);applyAttemptState(data);openConversation(drill.attempt,data)}catch(e){saveAttemptDraft({pending_action:'submit_turn'});setConversationState('recoverable');notice(e.message||'文本发送失败，请重试。');window.alert(e.message||'文本发送失败，请重试。')}finally{if(button&&button.isConnected){button.disabled=false;button.textContent='发送文本'}}}
async function finishAttempt(){if(!drill.attempt)return;setConversationState('evaluating');try{var res=await apiPost('/api/drill/v2/attempts.php',{action:'end',attempt_id:drill.attempt.id,status_version:drill.attempt.status_version});applyAttemptState(res.data||{});saveAttemptDraft({pending_action:'evaluation'});pollStatus(drill.attempt.id)}catch(e){saveAttemptDraft({pending_action:'evaluation'});setConversationState('recoverable');notice(e.message)}}
async function pollStatus(attemptId){try{var res=await apiGet('/api/drill/v2/attempt-status.php?attempt_id='+encodeURIComponent(attemptId)),data=res.data||{},evaluation=(data.evaluations||[])[0]||{};applyAttemptState(data);var status=evaluation.status||drill.attempt&&drill.attempt.status;if(status==='evaluating'||status==='ai_evaluating')setConversationState('evaluating');else if(status==='turn_finalizing'||status==='retry_pending')setConversationState('customer_response');else setConversationState('ready','当前状态：'+statusLabel(status));if(['completed','failed'].indexOf(evaluation.status)>=0){await openResult(attemptId);return}drill.poll=setTimeout(function(){pollStatus(attemptId)},Math.max(2,Number(data.poll_after_seconds||2))*1000)}catch(e){setConversationState('recoverable');notice('状态刷新失败，网络恢复后可在历史记录查看：'+e.message)}}
 async function openResult(attemptId){try{var res=await apiGet('/api/drill/v2/results.php?attempt_id='+encodeURIComponent(attemptId)),item=(res.data.items||[])[0]||{},report=item.report||{},recommendations=item.learning_recommendations||[],review=item.review||{},growth=item.growth||[],media=item.media||[],insufficient=report.evidence_status==='insufficient_evidence',evidenceNotice=insufficient?'<div class="notice show">本次对练证据不足，当前分数不用于能力判断。请补充完整对话后重新练习并评分。</div>':'';openSheet('完整流程报告',evidenceNotice+'<div class="row"><strong>总分 '+esc(item.total_score==null?'评分中':item.total_score)+' · '+esc(report.evaluation_grade||'待评级')+'</strong><small>'+esc(report.overall_conclusion||report.summary||'评分完成后将展示整体结论。')+'</small></div><h3>四段反馈</h3>'+feedbackHtml(report)+'<h3>复核结论</h3><div class="row"><strong>'+esc(review.decision||review.status||'暂不需要复核')+'</strong><small>'+esc(review.comment||review.adjustment_reason||'AI 评分完成后按规则进入复核。')+'</small></div><h3>学习推荐</h3>'+recommendations.map(function(x){return '<div class="row"><strong>'+esc(x.title||x.criterion_code)+'</strong><small>'+esc(x.reason||'根据本次证据推荐')+'</small></div>'}).join('')+'<h3>成长记录</h3>'+growth.map(function(x){return '<div class="row"><strong>'+esc(x.scope_key)+' · '+esc(x.latest_score)+' 分</strong><small>有效最佳成绩 '+esc(x.effective_best_score)+' 分</small></div>'}).join('')+'<h3>录音状态</h3>'+media.map(function(x){return '<div class="row"><strong>'+esc(x.status==='expired'?'录音已到期':x.status||'处理中')+'</strong><small>'+esc(x.expired_at||x.retention_until||'媒体状态同步中')+'</small></div>'}).join('')+'<h3>认证详情</h3><div class="row"><strong>'+esc(item.certification_id?'已生成认证记录':'当前尚未认证')+'</strong><small>'+esc(item.certified_at||'评分或人工复核完成后更新')+'</small></div>')}catch(e){notice(e.message)}}
function feedbackHtml(report){var sections=[['做得好的地方',report.strengths],['需要改进的地方',report.improvements],['下一次优化方法',report.smart_tasks||report.next_actions],['对应学习资源',report.learning_recommendations]];return sections.map(function(x){var v=Array.isArray(x[1])?x[1].join('；'):x[1]||'评分完成后生成';return '<div class="row"><strong>'+x[0]+'</strong><small>'+esc(v)+'</small></div>'}).join('')}
async function sha256(blob){var bytes=await blob.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  async function toggleRecord(){if(drill.recording){drill.recording.stop();return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){showMicrophonePermission('unsupported');setConversationState('text_fallback');notice('当前设备无法录音，请使用文本输入');return}try{var stream=await navigator.mediaDevices.getUserMedia({audio:true}),parts=[],rec=new MediaRecorder(stream);showMicrophonePermission('granted');drill.recording=rec;document.getElementById('recordBtn').textContent='结束录音';document.getElementById('recordBtn').classList.add('recording');setConversationState('recording');rec.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};rec.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});drill.recording=null;document.getElementById('recordBtn').textContent='开启麦克风';document.getElementById('recordBtn').classList.remove('recording');await uploadRecording(new Blob(parts,{type:rec.mimeType||'audio/webm'}))};rec.start(1000)}catch(e){var denied=e&&['NotAllowedError','SecurityError'].indexOf(e.name)>=0,message=denied?'麦克风权限未授予。请在浏览器地址栏的网站设置中开启“麦克风”，然后返回本页重新点击“开启麦克风”。':'未能开启麦克风，请检查浏览器权限后重试。';showMicrophonePermission(denied?'denied':'prompt',message+' 文本辅助输入可以继续完成本轮。');setConversationState('text_fallback');notice(message);if(denied)window.alert(message)}}
async function blobBase64(blob){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1])};reader.onerror=reject;reader.readAsDataURL(blob)})}
async function uploadRecording(blob){if(!drill.attempt)return;var assetId=0,chunkCount=0,uploadedChunks=0;setConversationState('uploading');try{var checksum=await sha256(blob),asset=await apiPost('/api/drill/v2/audio-assets.php',{attempt_id:drill.attempt.id,mime_type:blob.type||'audio/webm',byte_size:blob.size,checksum:checksum,asset_type:'turn_recording',purpose_code:'drill_training',consent_status:'not_required',retention_days:180,access_scope:{owner:true,reviewer:true}}),audio=(asset.data||{}).audio_asset||asset.data||{};assetId=audio.audio_asset_id||audio.id;if(!assetId)throw new Error('音频资源创建失败');drill.audioAssetId=assetId;document.getElementById('playAudio').disabled=false;var chunkSize=4*1024*1024;chunkCount=Math.ceil(blob.size/chunkSize);for(var index=0;index<chunkCount;index++){var chunk=blob.slice(index*chunkSize,Math.min(blob.size,(index+1)*chunkSize));await apiPost('/api/drill/v2/audio-chunks.php',{audio_asset_id:assetId,chunk_no:index+1,checksum:await sha256(chunk),byte_size:chunk.size,content_base64:await blobBase64(chunk)});uploadedChunks=index+1;saveAttemptDraft({recording_recovery:{audio_asset_id:assetId,chunk_count:chunkCount,uploaded_chunks:uploadedChunks,size:blob.size}});setConversationState('uploading','录音上传进度：'+uploadedChunks+'/'+chunkCount)}var transcript=window.prompt('请确认本轮转写文本；可在语音转写服务接入后自动填充。','');if(!transcript||!transcript.trim())throw new Error('请补充本轮文本后再继续对练');var finalized=await apiPost('/api/drill/v2/turns/finalize.php',{attempt_id:drill.attempt.id,audio_asset_id:assetId,expected_chunks:chunkCount,final_transcript_text:transcript.trim(),provider:'pwa_text_fallback',status_version:drill.attempt.status_version});saveAttemptDraft({recording_recovery:null});applyAttemptState((finalized.data||{}).turn||{});setConversationState('customer_response');pollStatus(drill.attempt.id)}catch(e){saveAttemptDraft({pending_action:'audio_upload',recording_recovery:{audio_asset_id:assetId,chunk_count:chunkCount,uploaded_chunks:uploadedChunks,size:blob.size}});setConversationState('recoverable');notice('上传中断，网络恢复后可从当前实例继续：'+e.message)}}
async function playLatestAudio(){if(!drill.audioAssetId)return;try{var res=await apiGet('/api/drill/v2/audio-access.php?audio_asset_id='+encodeURIComponent(drill.audioAssetId)),data=res.data||{},url=data.url||data.public_locator||data.audio_url;if(!url)throw new Error('录音仍在处理中');await new Audio(url).play()}catch(e){notice(e.message||'录音暂时无法播放')}}
function refreshAuthoritativeAttempt(){refreshAll();if(drill.attempt&&drill.attempt.id)pollStatus(drill.attempt.id)}
window.addEventListener('online',function(){setConversationState('recovering');notice('网络已恢复，正在刷新服务端权威状态');refreshAuthoritativeAttempt()});window.addEventListener('pwa:session-restored',function(){setConversationState('recovering');notice('会话已恢复，正在刷新服务端权威状态');refreshAuthoritativeAttempt()});window.addEventListener('offline',function(){setConversationState('recoverable');notice('当前离线：写请求保持在线发送，完成轮次与本地恢复信息已保留。')});window.addEventListener('DOMContentLoaded',function(){refreshAll();restoreActiveAttempt()});
