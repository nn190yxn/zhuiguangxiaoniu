<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库 - 追光小牛</title>
    <link rel="stylesheet" href="/css/mobile.css">
    <style>
        .search-bar {
            background: #fff;
            padding: 12px 16px;
            border-radius: 24px;
            margin: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            border: none;
            font-size: 14px;
            outline: none;
        }
        .filter-section {
            padding: 0 16px;
            margin-bottom: 12px;
        }
        .filter-label {
            font-size: 12px;
            color: #9a958e;
            margin-bottom: 8px;
        }
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .filter-tag {
            padding: 6px 14px;
            background: #fff;
            border-radius: 16px;
            font-size: 13px;
            color: #6b625c;
            white-space: nowrap;
            border: 1px solid #e8e5e0;
            cursor: pointer;
        }
        .filter-tag.active {
            background: #ff6b35;
            color: #fff;
            border-color: #ff6b35;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .category-tab {
            padding: 8px 16px;
            background: #fff;
            border-radius: 20px;
            font-size: 13px;
            color: #6b625c;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #e8e5e0;
        }
        .category-tab.active {
            background: #ff6b35;
            color: #fff;
            border-color: #ff6b35;
        }
        .sub-tabs {
            display: flex;
            padding: 0 16px;
            gap: 16px;
            margin-bottom: 16px;
        }
        .sub-tab {
            font-size: 14px;
            color: #9a958e;
            padding-bottom: 8px;
            border-bottom: 2px solid transparent;
        }
        .sub-tab.active {
            color: #ff6b35;
            border-color: #ff6b35;
        }
        .knowledge-list {
            padding: 0 16px;
        }
        .knowledge-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .knowledge-card:active {
            opacity: 0.9;
        }
        .knowledge-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .knowledge-cover {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #f0f0f0;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .knowledge-cover.video {
            position: relative;
        }
        .knowledge-cover.video::after {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
        }
        .knowledge-info {
            flex: 1;
            overflow: hidden;
        }
        .knowledge-title {
            font-size: 15px;
            font-weight: 600;
            color: #1f1a17;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .knowledge-summary {
            font-size: 12px;
            color: #9a958e;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .knowledge-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 2px 8px;
            background: #f5f3f0;
            border-radius: 8px;
            font-size: 11px;
            color: #6b625c;
        }
        .tag.public {
            background: #fff3e0;
            color: #ff6b35;
        }
        .tag.filter {
            background: #e8f5e9;
            color: #4caf50;
        }
        .knowledge-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid #f5f5f5;
        }
        .knowledge-meta {
            font-size: 12px;
            color: #9a958e;
        }
        .knowledge-status {
            font-size: 12px;
            color: #4caf50;
        }
        .knowledge-status.pending {
            color: #9a958e;
        }
        .search-result-header {
            padding: 16px;
            background: #fff;
            margin: -16px -16px 16px;
        }
        .search-result-keyword {
            font-size: 14px;
            color: #6b625c;
        }
        .search-result-keyword strong {
            color: #ff6b35;
        }
        .quick-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px 12px;
        }
        .quick-tab {
            flex: 1;
            text-align: center;
            padding: 9px 8px;
            font-size: 13px;
            color: #6b625c;
            background: #fff;
            border-radius: 18px;
            border: 1px solid #e8e5e0;
            cursor: pointer;
        }
        .quick-tab.active {
            background: #ff6b35;
            color: #fff;
            border-color: #ff6b35;
            font-weight: 600;
        }
        .filter-toolbar {
            margin: 0 16px 10px;
            padding: 12px 14px;
            background: #fff;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .filter-toolbar .filter-title {
            font-size: 14px;
            font-weight: 700;
            color: #1f1a17;
        }
        .filter-actions {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #ff6b35;
            cursor: pointer;
        }
        .expanded-filters {
            background: #fff;
            padding: 12px 16px;
            margin: 0 16px 12px;
            border-radius: 12px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .favorite-mark {
            font-size: 12px;
            color: #ff6b35;
        }
        .card-props {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .prop-item {
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 11px;
            background: #f5f3f0;
            color: #6b625c;
        }
        .prop-item.level {
            background: #fff3e0;
            color: #e65100;
        }
        .prop-item.risk.low { background: #e8f5e9; color: #2e7d32; }
        .prop-item.risk.medium { background: #fff8e1; color: #f57c00; }
        .prop-item.risk.high { background: #ffebee; color: #c62828; }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #f5f3f0;
        }
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag.time {
            background: #fff8e1;
            color: #8d6e63;
        }
        .expanded-filter-row {
            margin-bottom: 12px;
        }
        .expanded-filter-row:last-child {
            margin-bottom: 0;
        }
        .expanded-filter-label {
            font-size: 12px;
            color: #9a958e;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <header class="header">
            <h1>知识库</h1>
            <a href="/mobile/mine.html" class="back-btn">我的</a>
        </header>

        <div class="search-bar">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="搜索动作、话术、知识..." oninput="handleSearchInput(event)" onkeypress="handleSearchEnter(event)">
        </div>

        <div class="quick-tabs">
            <div class="quick-tab active" data-mode="all">全部阅读</div>
            <div class="quick-tab" data-mode="favorite">我的收藏</div>
            <div class="quick-tab" data-mode="recent">最近浏览</div>
        </div>

        <div class="filter-toolbar">
            <div class="filter-title">高级筛选</div>
            <div class="filter-actions">
                <span id="clearFiltersBtn">清空</span>
                <span id="toggleFiltersBtn">展开</span>
            </div>
        </div>

        <div class="expanded-filters" id="expandedFilters" style="display:none;">
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">类型</div>
                <div class="filter-row" id="typeFilter">
                    <div class="filter-tag active" data-field="type" data-value="">全部</div>
                    <div class="filter-tag" data-field="type" data-value="action">动作库</div>
                    <div class="filter-tag" data-field="type" data-value="script">话术库</div>
                    <div class="filter-tag" data-field="type" data-value="knowledge_card">知识卡</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">内容类型</div>
                <div class="filter-row" id="contentTypeFilter">
                    <div class="filter-tag active" data-field="contentType" data-value="">全部</div>
                    <div class="filter-tag" data-field="contentType" data-value="method">方法</div>
                    <div class="filter-tag" data-field="contentType" data-value="principle">原理</div>
                    <div class="filter-tag" data-field="contentType" data-value="case">案例</div>
                    <div class="filter-tag" data-field="contentType" data-value="checklist">清单</div>
                    <div class="filter-tag" data-field="contentType" data-value="coach_growth">教练成长</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">专业领域</div>
                <div class="filter-row" id="domainFilter">
                    <div class="filter-tag active" data-field="domain" data-value="">全部</div>
                    <div class="filter-tag" data-field="domain" data-value="fitness">体能</div>
                    <div class="filter-tag" data-field="domain" data-value="sensory">感统</div>
                    <div class="filter-tag" data-field="domain" data-value="sales">销售</div>
                    <div class="filter-tag" data-field="domain" data-value="coach">教练</div>
                    <div class="filter-tag" data-field="domain" data-value="operation">运营</div>
                    <div class="filter-tag" data-field="domain" data-value="G01">儿童发展</div>
                    <div class="filter-tag" data-field="domain" data-value="G02">运动与大脑</div>
                    <div class="filter-tag" data-field="domain" data-value="G03">心理与情绪</div>
                    <div class="filter-tag" data-field="domain" data-value="G04">行为与课堂</div>
                    <div class="filter-tag" data-field="domain" data-value="G05">教学法</div>
                    <div class="filter-tag" data-field="domain" data-value="G06">家长协同</div>
                    <div class="filter-tag" data-field="domain" data-value="G07">健康边界</div>
                    <div class="filter-tag" data-field="domain" data-value="G08">教练成长</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">科目</div>
                <div class="filter-row" id="subjectFilter">
                    <div class="filter-tag active" data-field="subject" data-value="">全部</div>
                    <div class="filter-tag" data-field="subject" data-value="fitness">体能</div>
                    <div class="filter-tag" data-field="subject" data-value="sensory">感统</div>
                    <div class="filter-tag" data-field="subject" data-value="skill">技能</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">年龄段</div>
                <div class="filter-row" id="ageGroupFilter">
                    <div class="filter-tag active" data-field="ageGroup" data-value="">全部</div>
                    <div class="filter-tag" data-field="ageGroup" data-value="3-6">3-6岁</div>
                    <div class="filter-tag" data-field="ageGroup" data-value="7-12">7-12岁</div>
                    <div class="filter-tag" data-field="ageGroup" data-value="13-18">13-18岁</div>
                    <div class="filter-tag" data-field="ageGroup" data-value="成人">成人</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">训练类别</div>
                <div class="filter-row" id="trainingTypeFilter">
                    <div class="filter-tag active" data-field="trainingType" data-value="">全部</div>
                    <div class="filter-tag" data-field="trainingType" data-value="strength">力量</div>
                    <div class="filter-tag" data-field="trainingType" data-value="cardio">心肺</div>
                    <div class="filter-tag" data-field="trainingType" data-value="flexibility">柔韧</div>
                    <div class="filter-tag" data-field="trainingType" data-value="balance">平衡</div>
                    <div class="filter-tag" data-field="trainingType" data-value="coordination">协调</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">难度</div>
                <div class="filter-row" id="difficultyFilter">
                    <div class="filter-tag active" data-field="difficulty" data-value="">全部</div>
                    <div class="filter-tag" data-field="difficulty" data-value="1">1级</div>
                    <div class="filter-tag" data-field="difficulty" data-value="2">2级</div>
                    <div class="filter-tag" data-field="difficulty" data-value="3">3级</div>
                    <div class="filter-tag" data-field="difficulty" data-value="4">4级</div>
                    <div class="filter-tag" data-field="difficulty" data-value="5">5级</div>
                </div>
            </div>
            <div class="expanded-filter-row">
                <div class="expanded-filter-label">风险</div>
                <div class="filter-row" id="riskFilter">
                    <div class="filter-tag active" data-field="riskLevel" data-value="">全部</div>
                    <div class="filter-tag" data-field="riskLevel" data-value="low">低风险</div>
                    <div class="filter-tag" data-field="riskLevel" data-value="medium">中风险</div>
                    <div class="filter-tag" data-field="riskLevel" data-value="high">高风险</div>
                </div>
            </div>
        </div>

        <div class="knowledge-list" id="knowledgeList">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script src="/js/app-auth.js?v=3"></script>
    <script src="/internal-auth.js?v=8"></script>
    <script>
        const API_BASE = '/api';
        const FILTERS = {
            type: '', contentType: '', domainCode: '', subject: '', ageGroup: '',
            trainingType: '', difficulty: '', riskLevel: '', quickMode: 'all', keyword: ''
        };
        let searchTimer = null;
        let filtersExpanded = false;
        let currentPage = 1;
        let hasMore = true;
        let loading = false;

        async function init() {
            parseUrlParams();
            bindEvents();
            syncQuickTabs();
            syncFilters();
            await loadKnowledge();
            window.addEventListener('scroll', () => {
                if (!hasMore || loading) return;
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 120) {
                    loadKnowledge(currentPage + 1, true);
                }
            });
        }

        function parseUrlParams() {
            const params = new URLSearchParams(window.location.search);
            FILTERS.keyword = params.get('keyword') || '';
            FILTERS.quickMode = params.get('mode') || (params.get('favorite') === '1' ? 'favorite' : params.get('recent') === '1' ? 'recent' : 'all');
            ['type','contentType','domainCode','subject','ageGroup','trainingType','difficulty','riskLevel'].forEach((key) => {
                const paramKey = key === 'domainCode' ? 'domain_code' : key === 'contentType' ? 'content_type' : key === 'ageGroup' ? 'age_group' : key === 'trainingType' ? 'training_type' : key === 'riskLevel' ? 'risk_level' : key;
                FILTERS[key] = params.get(paramKey) || '';
            });
            filtersExpanded = Boolean(FILTERS.type || FILTERS.contentType || FILTERS.domainCode || FILTERS.subject || FILTERS.ageGroup || FILTERS.trainingType || FILTERS.difficulty || FILTERS.riskLevel);
        }

        function bindEvents() {
            document.getElementById('searchInput').value = FILTERS.keyword;
            document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
            document.getElementById('toggleFiltersBtn').addEventListener('click', toggleFilters);
            document.querySelectorAll('.quick-tab').forEach(tab => tab.addEventListener('click', () => selectQuickMode(tab.dataset.mode || 'all')));
            document.querySelectorAll('.filter-row .filter-tag').forEach(tag => tag.addEventListener('click', () => selectFilter(tag.dataset.field, tag.dataset.value || '')));
        }

        function syncQuickTabs() {
            document.querySelectorAll('.quick-tab').forEach(tab => {
                tab.classList.toggle('active', (tab.dataset.mode || 'all') === FILTERS.quickMode);
            });
        }

        function syncFilters() {
            document.getElementById('expandedFilters').style.display = filtersExpanded ? 'block' : 'none';
            document.getElementById('toggleFiltersBtn').textContent = filtersExpanded ? '收起' : '展开';
            const mapping = {
                type: 'typeFilter', contentType: 'contentTypeFilter', domainCode: 'domainFilter', subject: 'subjectFilter',
                ageGroup: 'ageGroupFilter', trainingType: 'trainingTypeFilter', difficulty: 'difficultyFilter', riskLevel: 'riskFilter'
            };
            Object.keys(mapping).forEach((key) => {
                document.querySelectorAll(`#${mapping[key]} .filter-tag`).forEach(tag => tag.classList.toggle('active', (tag.dataset.value || '') === (FILTERS[key] || '')));
            });
        }

        function selectQuickMode(mode) {
            FILTERS.quickMode = mode || 'all';
            syncQuickTabs();
            loadKnowledge(1, false);
        }

        function toggleFilters() {
            filtersExpanded = !filtersExpanded;
            syncFilters();
        }

        function clearFilters() {
            FILTERS.type = FILTERS.contentType = FILTERS.domainCode = FILTERS.subject = FILTERS.ageGroup = FILTERS.trainingType = FILTERS.difficulty = FILTERS.riskLevel = '';
            FILTERS.quickMode = 'all';
            FILTERS.keyword = '';
            document.getElementById('searchInput').value = '';
            filtersExpanded = false;
            syncQuickTabs();
            syncFilters();
            loadKnowledge(1, false);
        }

        function selectFilter(field, value) {
            const keyMap = {
                type: 'type', contentType: 'contentType', domain: 'domainCode', subject: 'subject', ageGroup: 'ageGroup',
                trainingType: 'trainingType', difficulty: 'difficulty', riskLevel: 'riskLevel'
            };
            const key = keyMap[field];
            if (!key) return;
            FILTERS[key] = value || '';
            filtersExpanded = true;
            syncFilters();
            loadKnowledge(1, false);
        }

        function handleSearchInput(event) {
            FILTERS.keyword = String(event.target.value || '').trim();
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadKnowledge(1, false), 250);
        }

        function handleSearchEnter(event) {
            if (event.key === 'Enter') {
                FILTERS.keyword = String(event.target.value || '').trim();
                loadKnowledge(1, false);
            }
        }

        function buildQuery(page) {
            const params = [`page=${page}`, 'page_size=20'];
            const map = {
                type: FILTERS.type, content_type: FILTERS.contentType, domain_code: FILTERS.domainCode, subject: FILTERS.subject,
                age_group: FILTERS.ageGroup, training_type: FILTERS.trainingType, difficulty: FILTERS.difficulty, risk_level: FILTERS.riskLevel,
                keyword: FILTERS.keyword
            };
            Object.keys(map).forEach(key => { if (map[key]) params.push(`${key}=${encodeURIComponent(map[key])}`); });
            if (FILTERS.quickMode === 'favorite') params.push('favorite=1');
            if (FILTERS.quickMode === 'recent') params.push('recent=1');
            return params.join('&');
        }

        async function loadKnowledge(page = 1, append = false) {
            const listEl = document.getElementById('knowledgeList');
            if (loading) return;
            loading = true;
            if (!append) listEl.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch(`${API_BASE}/knowledge/list.php?${buildQuery(page)}`, { headers: authHeaders() });
                const data = await res.json();
                if (data.code === 0) {
                    currentPage = page;
                    const list = data.data.list || [];
                    hasMore = list.length === Number(data.data.page_size || 20);
                    renderKnowledge(list, append);
                } else if (!append) {
                    listEl.innerHTML = '<div class="empty">加载失败</div>';
                }
            } catch (err) {
                if (!append) listEl.innerHTML = '<div class="empty">网络错误</div>';
            } finally {
                loading = false;
            }
        }

        function renderKnowledge(list, append = false) {
            const listEl = document.getElementById('knowledgeList');
            if (!list.length && !append) {
                listEl.innerHTML = `<div class="empty">${escapeHtml(FILTERS.quickMode === 'favorite' ? '暂无收藏知识' : FILTERS.quickMode === 'recent' ? '暂无最近浏览' : FILTERS.keyword ? '未找到匹配的知识' : '暂无知识库内容')}</div>`;
                return;
            }
            const typeNames = { action: '动作', script: '话术', knowledge_card: '知识卡' };
            const contentTypeNames = { method: '方法', principle: '原理', case: '案例', checklist: '清单', coach_growth: '教练成长' };
            const domainNames = { fitness: '体能', sensory: '感统', sales: '销售', coach: '教练', operation: '运营', G01: '儿童发展', G02: '运动与大脑', G03: '心理与情绪', G04: '行为与课堂', G05: '教学法', G06: '家长协同', G07: '健康边界', G08: '教练成长' };
            const subjectNames = { fitness: '体能', sensory: '感统', skill: '技能' };
            const trainingNames = { strength: '力量', cardio: '心肺', flexibility: '柔韧', balance: '平衡', coordination: '协调' };
            const riskNames = { low: '低风险', medium: '中风险', high: '高风险' };
            const html = list.map(item => {
                const coverHtml = (item.media_type === 'video' || item.media_type === 'image')
                    ? `<div class="knowledge-cover ${item.media_type === 'video' ? 'video' : ''}" style="background-image:url('${safeUrl(item.cover_image || item.media_url || '')}')"></div>`
                    : `<div class="knowledge-cover" style="background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:24px;">${item.category_type === 'action' ? '💪' : item.category_type === 'script' ? '📞' : '📖'}</div>`;
                const props = [];
                if (item.content_type) props.push(`<span class="prop-item">${escapeHtml(contentTypeNames[item.content_type] || item.content_type)}</span>`);
                if (item.domain_code) props.push(`<span class="prop-item">${escapeHtml(domainNames[item.domain_code] || item.domain_code)}</span>`);
                if (item.subject) props.push(`<span class="prop-item">${escapeHtml(subjectNames[item.subject] || item.subject)}</span>`);
                if (item.age_group) props.push(`<span class="prop-item">${escapeHtml(item.age_group)}岁</span>`);
                if (item.training_type) props.push(`<span class="prop-item">${escapeHtml(trainingNames[item.training_type] || item.training_type)}</span>`);
                if (item.difficulty) props.push(`<span class="prop-item level">${escapeHtml(String(item.difficulty))}级</span>`);
                if (item.risk_level) props.push(`<span class="prop-item risk ${escapeHtml(item.risk_level)}">${escapeHtml(riskNames[item.risk_level] || item.risk_level)}</span>`);
                return `
                    <div class="knowledge-card" onclick="goToDetail(${Number(item.id)})">
                        <div class="knowledge-header">
                            ${coverHtml}
                            <div class="knowledge-info">
                                <div class="card-top">
                                    <div class="knowledge-title">${escapeHtml(item.title)}</div>
                                    ${Number(item.is_favorite || 0) > 0 ? '<div class="favorite-mark">已收藏</div>' : ''}
                                </div>
                                <div class="knowledge-summary">${escapeHtml(item.summary || '')}</div>
                                <div class="knowledge-tags">
                                    <span class="tag public">${escapeHtml(typeNames[item.category_type] || '知识')}</span>
                                    ${Number(item.is_public) === 1 ? '<span class="tag public">公开</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <div class="card-props">${props.join('')}</div>
                        <div class="card-footer">
                            <div class="card-tags">
                                ${item.updated_at ? `<span class="tag time">更新 ${escapeHtml(item.updated_at)}</span>` : ''}
                                ${item.last_viewed_at ? `<span class="tag time">最近 ${escapeHtml(item.last_viewed_at)}</span>` : ''}
                            </div>
                            <span class="knowledge-meta">${escapeHtml(typeNames[item.category_type] || '知识')}</span>
                        </div>
                    </div>`;
            }).join('');
            if (append) {
                listEl.insertAdjacentHTML('beforeend', html);
            } else {
                listEl.innerHTML = html;
            }
        }

        function goToDetail(id) {
            location.href = `/mobile/knowledge-detail.html?id=${id}`;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function safeUrl(url) {
            if (!url) return '';
            const value = String(url).trim();
            if (/[\u0000-\u001f\u007f\)]/.test(value) || value.startsWith('//')) return '';
            try {
                const parsed = new URL(value, location.origin);
                if (parsed.protocol !== 'https:' || parsed.origin !== location.origin) return '';
                if (!parsed.pathname.startsWith('/uploads/knowledge/') || parsed.pathname.includes('..')) return '';
                return parsed.href;
            } catch (error) {
                return '';
            }
        }

        requirePageAuth({ onAuthed: init });
    </script>
</body>
</html>
