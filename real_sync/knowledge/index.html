<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识中心 | 追光小牛</title>
  <link rel="stylesheet" href="/styles.css?v=20260904">
  <style>
    :root { color-scheme:light; --ink:#201b18; --muted:#766d65; --paper:#f7f3ee; --orange:#ef6b3d; --line:#e8dfd5; --card:#fffaf5; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,"Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1180px,calc(100% - 32px)); margin:auto; padding:22px 0 48px; }
     .page-head { min-height:58px; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
    .brand { font-size:13px; font-weight:800; letter-spacing:.04em; color:var(--muted); }
    h1 { margin:7px 0 0; font-size:28px; line-height:1.2; }
    .search { width:min(360px,100%); display:flex; gap:8px; }
    .search input { width:100%; min-height:42px; border:1px solid var(--line); border-radius:10px; padding:0 13px; background:#fff; color:var(--ink); outline:none; }
    .search input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(239,107,61,.12); }
    .search button,.load-more { border:0; border-radius:10px; background:var(--ink); color:#fff; padding:0 16px; font-weight:700; cursor:pointer; }
    .line-tabs { display:flex; gap:8px; margin:24px 0 14px; }
    .line-tab { min-height:40px; border:1px solid var(--line); border-radius:10px; background:#fff; padding:0 18px; color:var(--muted); font-weight:700; cursor:pointer; }
    .line-tab.active { border-color:var(--orange); background:var(--orange); color:#fff; }
    .workspace { display:grid; grid-template-columns:220px minmax(0,1fr); gap:16px; }
    .sidebar,.toolbar,.knowledge-card,.state { border:1px solid var(--line); background:#fff; border-radius:12px; }
    .sidebar { padding:12px; align-self:start; position:sticky; top:68px; }
    .side-title { padding:5px 8px 9px; color:var(--muted); font-size:12px; font-weight:700; }
    .topic-list { display:grid; gap:3px; }
    .topic { width:100%; min-height:36px; border:0; border-radius:8px; padding:0 10px; background:transparent; color:var(--ink); text-align:left; cursor:pointer; }
    .topic:hover { background:#f8f1ea; }
    .topic.active { background:#fff0e9; color:#c94f28; font-weight:700; }
    .content { min-width:0; }
    .toolbar { min-height:54px; padding:8px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .modes { display:flex; gap:4px; flex-wrap:wrap; }
    .mode { min-height:34px; border:0; border-radius:8px; padding:0 11px; background:transparent; color:var(--muted); cursor:pointer; }
    .mode.active { background:#f1ece6; color:var(--ink); font-weight:700; }
    .type-select { min-height:34px; border:1px solid var(--line); border-radius:8px; padding:0 28px 0 10px; background:#fff; color:var(--ink); }
    .result-meta { min-height:38px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; }
    .clear { border:0; background:transparent; color:var(--orange); cursor:pointer; }
    .knowledge-list { display:grid; gap:9px; }
     .knowledge-card { display:block; padding:15px 17px; background:#fff !important; color:var(--ink) !important; transition:transform .18s,box-shadow .18s,border-color .18s; }
    .knowledge-card:hover { transform:translateY(-1px); border-color:#ddcfc1; box-shadow:0 8px 22px rgba(75,49,31,.07); }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .card-title { margin:0; font-size:15px; line-height:1.45; }
    .favorite { flex:0 0 auto; color:var(--orange); font-size:12px; font-weight:700; }
    .card-summary { margin:7px 0 12px; color:var(--muted); font-size:13px; line-height:1.65; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .tags { display:flex; gap:6px; flex-wrap:wrap; }
    .tag { border-radius:999px; padding:4px 8px; background:#f3eee8; color:#695f58; font-size:11px; }
    .tag.line { background:#fff0e9; color:#c94f28; }
    .card-foot { margin-top:12px; padding-top:10px; border-top:1px solid #f0e9e1; display:flex; justify-content:space-between; color:#9a8f86; font-size:11px; }
    .state { padding:54px 18px; text-align:center; color:var(--muted); }
    .state strong { display:block; margin-bottom:6px; color:var(--ink); font-size:15px; }
    .load-wrap { display:flex; justify-content:center; padding-top:14px; }
    .load-more { min-height:38px; }
    .preview-note { margin-bottom:9px; border:1px solid #efd8c8; border-radius:10px; padding:10px 12px; background:#fff7f1; color:#9a593d; font-size:12px; }
    [hidden] { display:none!important; }
    @media (max-width:980px) { .page-head { padding-right:0; padding-top:52px; } }
    @media (max-width:760px) {
      .shell { width:min(100% - 20px,1180px); padding-top:12px; }
      .page-head { align-items:stretch; flex-direction:column; padding-top:48px; }
      .search { width:100%; }
      .workspace { grid-template-columns:1fr; }
      .sidebar { position:static; }
      .topic-list { display:flex; overflow-x:auto; }
      .topic { width:auto; flex:0 0 auto; }
      .toolbar { align-items:flex-start; flex-direction:column; }
      .type-select { width:100%; }
    }
  </style>
  <script src="/internal-auth.js?v=20260904-fixed-nav" defer></script>
  <script src="/knowledge/knowledge.js?v=20260904-desktop" defer></script>
</head>
<body>
  <!-- Legacy route target: /mobile/knowledge.html + window.location.search -->
  <main class="shell">
    <header class="page-head">
      <div><a class="brand" href="/internal.html">追光小牛 · 内网</a><h1>知识中心</h1></div>
      <form class="search" id="searchForm"><input id="searchInput" type="search" autocomplete="off" placeholder="搜索知识、动作、话术"><button type="submit">搜索</button></form>
    </header>

    <nav class="line-tabs" aria-label="知识主线">
      <button class="line-tab" type="button" data-primary-category="professional">专业知识</button>
      <button class="line-tab" type="button" data-primary-category="sales">销售知识</button>
    </nav>

    <div class="workspace">
      <aside class="sidebar">
        <div class="side-title">分类</div>
        <div class="topic-list" id="topicList"></div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div class="modes" aria-label="阅读范围">
            <button class="mode" type="button" data-mode="all">全部</button>
            <button class="mode" type="button" data-mode="favorite">我的收藏</button>
            <button class="mode" type="button" data-mode="recent">最近浏览</button>
          </div>
          <select class="type-select" id="contentType" aria-label="内容类型">
            <option value="">全部类型</option>
            <option value="knowledge_card">知识卡</option>
            <option value="action">动作</option>
            <option value="game">游戏</option>
            <option value="script">话术</option>
            <option value="case">案例</option>
            <option value="lesson">教案参考</option>
          </select>
        </div>
        <div class="result-meta"><span id="resultCount">正在加载</span><button class="clear" id="clearFilters" type="button">清空筛选</button></div>
        <div class="preview-note" id="previewNote" hidden>预览环境当前展示已发布的静态内容入口。</div>
        <div class="knowledge-list" id="knowledgeList"><div class="state">加载中...</div></div>
        <div class="load-wrap" id="loadWrap" hidden><button class="load-more" id="loadMore" type="button">加载更多</button></div>
      </section>
    </div>
  </main>
</body>
</html>
