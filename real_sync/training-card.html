<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>训练卡片 - 追光小牛</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root {
            --brand-orange: #ff6b35;
            --brand-ink: #1f1a17;
            --brand-muted: #6b625c;
            --bg: #f5f3f0;
            --card: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--brand-ink);
            min-height: 100vh;
        }

        .header {
            background: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            font-size: 20px;
            color: var(--brand-ink);
            text-decoration: none;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }

        .card-type-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .card-type-badge.K { background: #e3f2fd; color: #1976d2; }
        .card-type-badge.S { background: #f3e5f5; color: #7b1fa2; }
        .card-type-badge.D { background: #fff8e1; color: #f57f17; }
        .card-type-badge.C { background: #e8f5e9; color: #388e3c; }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            line-height: 1.8;
            font-size: 15px;
        }

        .card-body h3 {
            font-size: 15px;
            color: var(--brand-muted);
            margin-bottom: 8px;
        }

        .script-text {
            background: #fafafa;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid var(--brand-orange);
            white-space: pre-wrap;
            margin: 12px 0;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .option-item {
            background: var(--card);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:active {
            transform: scale(0.98);
        }

        .option-item.selected {
            border-color: var(--brand-orange);
            background: #fff5f0;
        }

        .option-item.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option-item.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .answer-section {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .answer-section h3 {
            font-size: 15px;
            color: var(--brand-muted);
            margin-bottom: 12px;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            resize: none;
            min-height: 100px;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--brand-orange);
        }

        .tips-box {
            background: #fff8e1;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .tips-box h4 {
            font-size: 13px;
            color: #f57f17;
            margin-bottom: 8px;
        }

        .tips-box p {
            font-size: 14px;
            color: var(--brand-ink);
            line-height: 1.6;
        }

        .feedback-box {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
        }

        .feedback-box.pass {
            border: 2px solid #4caf50;
        }

        .feedback-box.fail {
            border: 2px solid #f44336;
        }

        .feedback-score {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feedback-score.pass { color: #4caf50; }
        .feedback-score.fail { color: #f44336; }

        .feedback-text {
            font-size: 15px;
            color: var(--brand-muted);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #eee;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            background: var(--brand-orange);
            color: white;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--brand-muted);
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .formatted-text > * + * { margin-top: 10px; }
        .formatted-text h2 { font-size: 18px; line-height: 1.45; }
        .formatted-text h3 { font-size: 16px; line-height: 1.5; color: var(--brand-ink); }
        .formatted-text ul, .formatted-text ol { padding-left: 24px; }
        .formatted-text blockquote { padding: 8px 12px; border-left: 4px solid #bdb7b2; background: #fafafa; color: var(--brand-muted); }
        .formatted-text .text-correct, .formatted-text .text-wrong { padding: 8px 12px; border-radius: 8px; font-weight: 600; }
        .formatted-text .text-correct { color: #2e7d32; background: #e8f5e9; }
        .formatted-text .text-wrong { color: #c62828; background: #ffebee; }
        .formatted-text .table-wrap { overflow-x: auto; }
        .formatted-text table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .formatted-text th, .formatted-text td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .formatted-text th { background: #f5f3f0; }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:history.back()" class="back-btn">&#8592;</a>
        <h1 id="cardTitle">加载中...</h1>
        <span class="card-type-badge K" id="typeBadge">知识卡</span>
    </div>

    <div class="card-content" id="cardContent">
        <div class="loading">加载中...</div>
    </div>

    <div class="bottom-bar">
        <button class="btn" id="actionBtn" onclick="handleAction()">提交答案</button>
    </div>

    <script src="/internal-auth.js?v=7"></script>
    <script>
        const API_BASE = '/api/drill';
        function getToken() {
            return localStorage.getItem('jwt_token') || localStorage.getItem('token') || '';
        }

        function authHeaders(extraHeaders) {
            extraHeaders = extraHeaders || {};
            var token = getToken();
            if (!token) return extraHeaders;
            return Object.assign({}, extraHeaders, { Authorization: 'Bearer ' + token });
        }

        async function checkAuth() {
            const res = await fetch('/api/auth/me.php', { headers: authHeaders(), cache: 'no-store' });
            const data = await res.json();
            if (!res.ok || data.code !== 0) {
                window.location.href = '/mobile/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
                throw new Error('未登录');
            }
            return data.data || {};
        }

        let cardData = null;
        let selectedAnswer = null;
        let isSubmitted = false;
        let startTime = Date.now();

        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        if (!cardId) {
            window.location.href = '/training-pass.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            loadCard();
        });

        async function loadCard() {
            try {
                const res = await fetch(API_BASE + '/training-cards.php?action=get&id=' + encodeURIComponent(cardId), { headers: authHeaders() });
                const data = await res.json();

                if (data.code === 0) {
                    cardData = data.data;
                    renderCard();
                } else {
                    document.getElementById('cardContent').innerHTML = '<div class="loading">加载失败</div>';
                }
            } catch (err) {
                document.getElementById('cardContent').innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        function normalizeCardType(value) {
            return ['K', 'S', 'D', 'C'].includes(value) ? value : 'K';
        }

        function renderCard() {
            const card = cardData;
            const typeNames = { K: '知识卡', S: '话术卡', D: '演练卡', C: '通关卡' };
            const cardType = normalizeCardType(card.card_type);

            document.getElementById('cardTitle').textContent = card.title;
            document.getElementById('typeBadge').textContent = typeNames[cardType];
            document.getElementById('typeBadge').className = `card-type-badge ${cardType}`;

            const contentHtml = formatText(card.content || '');
            const tipsHtml = formatText(card.tips || '');
            const standardAnswerHtml = formatText(card.standard_answer || '');
            const safeTitle = escapeHtml(card.title || '');

            let html = `
                <div class="card-title">
                    <span class="card-type-badge ${cardType}">${cardType}</span>
                    ${safeTitle}
                </div>
            `;

            // 根据卡片类型渲染不同内容
            if (cardType === 'K') {
                // 知识卡 - 显示内容供学习
                html += `
                    <div class="card-body">
                        <div class="formatted-text">${contentHtml || '<p>暂无内容</p>'}</div>
                        ${card.tips ? `
                            <div class="tips-box">
                                <h4>教练提示</h4>
                                <div class="formatted-text">${tipsHtml}</div>
                            </div>
                        ` : ''}
                    </div>
                    <button class="btn" onclick="markAsLearned()">我已学习完成</button>
                `;
            } else if (cardType === 'S') {
                // 话术卡 - 显示场景和参考话术
                html += `
                    <div class="card-body">
                        <h3>场景说明</h3>
                        <div class="formatted-text">${contentHtml || '<p>请根据以下场景进行话术练习</p>'}</div>

                        ${card.standard_answer ? `
                            <h3>参考话术</h3>
                            <div class="script-text formatted-text">${standardAnswerHtml}</div>
                        ` : ''}

                        ${card.tips ? `
                            <div class="tips-box">
                                <h4>教练提示</h4>
                                <div class="formatted-text">${tipsHtml}</div>
                            </div>
                        ` : ''}
                    </div>
                    <button class="btn" onclick="markAsLearned()">我已学习完成</button>
                `;
            } else if (cardType === 'D') {
                // 演练卡 - 显示演练题目，需要提交
                html += `
                    <div class="card-body">
                        <h3>演练题目</h3>
                        <div class="formatted-text">${contentHtml || '<p>请按照题目要求进行演练</p>'}</div>

                        ${card.tips ? `
                            <div class="tips-box">
                                <h4>演练提示</h4>
                                <div class="formatted-text">${tipsHtml}</div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="answer-section">
                        <h3>请填写您的演练要点或录音链接</h3>
                        <textarea class="answer-input" id="answerInput" placeholder="记录您的演练要点或输入录音URL..."></textarea>
                    </div>
                `;
                document.getElementById('actionBtn').textContent = '提交演练';
            } else if (cardType === 'C') {
                // 通关卡 - 显示通关项，选择答案
                const options = card.options || [];
                html += `
                    <div class="card-body">
                        <h3>通关项</h3>
                        <div class="formatted-text">${contentHtml || '<p>请完成以下通关项</p>'}</div>
                    </div>

                    ${options.length > 0 ? `
                        <div class="options-list">
                            ${options.map((opt, i) => `
                                <div class="option-item" data-index="${i}" onclick="selectOption(this, Number(this.dataset.index))">
                                    ${escapeHtml(opt)}
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="answer-section">
                            <textarea class="answer-input" id="answerInput" placeholder="请输入答案..."></textarea>
                        </div>
                    `}
                `;
                document.getElementById('actionBtn').textContent = '提交答案';
            }

            document.getElementById('cardContent').innerHTML = html;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatText(value) {
            const lines = escapeHtml(value).replace(/\r\n?/g, '\n').split('\n');
            const output = [];
            let i = 0;
            const tableCells = line => {
                const trimmed = line.trim();
                const body = trimmed.startsWith('|') ? trimmed.slice(1) : trimmed;
                const withoutEnd = body.endsWith('|') ? body.slice(0, -1) : body;
                return withoutEnd.split('|').map(cell => cell.trim());
            };
            const isDivider = cells => cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) { i++; continue; }
                if (line.includes('|') && i + 1 < lines.length) {
                    const header = tableCells(line);
                    const divider = tableCells(lines[i + 1]);
                    if (header.length > 1 && divider.length === header.length && isDivider(divider)) {
                        const rows = [];
                        let j = i + 2;
                        let consistent = true;
                        while (j < lines.length && lines[j].includes('|')) {
                            const cells = tableCells(lines[j]);
                            if (cells.length !== header.length) consistent = false;
                            rows.push(cells);
                            j++;
                        }
                        if (consistent && rows.length > 0) {
                            const headHtml = header.map(cell => `<th>${cell}</th>`).join('');
                            const bodyHtml = rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('');
                            output.push(`<div class="table-wrap"><table><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div>`);
                            i = j;
                            continue;
                        }
                    }
                }

                let match;
                if ((match = line.match(/^###\s+(.+)$/))) output.push(`<h3>${match[1]}</h3>`);
                else if ((match = line.match(/^##\s+(.+)$/))) output.push(`<h2>${match[1]}</h2>`);
                else if ((match = line.match(/^&gt;\s?(.*)$/))) output.push(`<blockquote>${match[1]}</blockquote>`);
                else if ((match = line.match(/^✓\s*(.*)$/))) output.push(`<p class="text-correct">✓ ${match[1]}</p>`);
                else if ((match = line.match(/^✗\s*(.*)$/))) output.push(`<p class="text-wrong">✗ ${match[1]}</p>`);
                else if (/^[-*]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && (match = lines[i].match(/^[-*]\s+(.+)$/))) { items.push(`<li>${match[1]}</li>`); i++; }
                    output.push(`<ul>${items.join('')}</ul>`);
                    continue;
                } else if (/^\d+[.)]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && (match = lines[i].match(/^\d+[.)]\s+(.+)$/))) { items.push(`<li>${match[1]}</li>`); i++; }
                    output.push(`<ol>${items.join('')}</ol>`);
                    continue;
                } else {
                    const paragraph = [line];
                    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(###?\s+|[-*]\s+|\d+[.)]\s+|&gt;\s?|✓\s*|✗\s*)/.test(lines[i + 1])) paragraph.push(lines[++i]);
                    output.push(`<p>${paragraph.join('<br>')}</p>`);
                }
                i++;
            }
            return output.join('');
        }

        function selectOption(el, index) {
            if (isSubmitted) return;
            if (!cardData || !Array.isArray(cardData.options) || !Number.isInteger(index) || index < 0 || index >= cardData.options.length) return;

            document.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            selectedAnswer = cardData.options[index];
        }

        function markAsLearned() {
            submitAnswer('completed');
        }

        async function handleAction() {
            const cardType = normalizeCardType(cardData.card_type);
            if (cardType === 'K' || cardType === 'S') {
                markAsLearned();
                return;
            }

            const answerInput = document.getElementById('answerInput');
            const answer = answerInput ? answerInput.value : selectedAnswer;

            if (!answer && cardType !== 'D') {
                alert('请输入答案');
                return;
            }

            await submitAnswer(answer);
        }

        async function submitAnswer(answer) {
            const timeSpent = Math.round((Date.now() - startTime) / 1000);

            try {
                const res = await fetch(`${API_BASE}/training-cards.php?action=submit`, {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({
                        card_id: cardId,
                        answer: answer,
                        time_spent: timeSpent
                    })
                });

                const data = await res.json();

                if (data.code === 0) {
                    showResult(data.data);
                } else {
                    alert(data.message || '提交失败');
                }
            } catch (err) {
                alert('提交失败，请重试');
            }
        }

        function showResult(result) {
            isSubmitted = true;
            const card = cardData;
            const feedbackHtml = formatText(result.feedback || '');
            const standardAnswerHtml = formatText(result.standard_answer || '');
            const tipsHtml = formatText(result.tips || '');
            const scoreHtml = escapeHtml(result.score == null ? '' : result.score);

            let html = `
                <div class="feedback-box ${result.is_correct ? 'pass' : 'fail'}">
                    <div class="feedback-score ${result.is_correct ? 'pass' : 'fail'}">${scoreHtml}分</div>
                    <div class="feedback-text formatted-text">${feedbackHtml}</div>
                </div>
            `;

            if (result.standard_answer) {
                html += `
                    <div class="card-body">
                        <h3>正确答案</h3>
                        <div class="script-text formatted-text">${standardAnswerHtml}</div>
                    </div>
                `;
            }

            if (result.tips) {
                html += `
                    <div class="tips-box">
                        <h4>教练点评</h4>
                        <div class="formatted-text">${tipsHtml}</div>
                    </div>
                `;
            }

            document.getElementById('cardContent').innerHTML = html;
            document.getElementById('actionBtn').textContent = '返回列表';
            document.getElementById('actionBtn').onclick = () => {
                const moduleId = urlParams.get('module');
                if (moduleId) {
                    window.location.href = `/training-module.html?id=${moduleId}`;
                } else {
                    window.location.href = '/training-pass.html';
                }
            };
        }
    </script>
</body>
</html>
