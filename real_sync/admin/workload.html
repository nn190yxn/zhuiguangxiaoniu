<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>工作量驾驶舱 - 追光小牛管理后台</title>
    <script src="/internal-auth.js?v=8"></script>
    <script src="/js/app-auth.js?v=3"></script>
    <script src="/js/api-client.js?v=3"></script>
    <style>
      :root {
        --orange: #ff6b35;
        --ink: #1f1a17;
        --muted: #6b625c;
        --bg: #f6f4f1;
        --card: #fff;
        --line: rgba(31, 26, 23, 0.1);
        --danger: #b42318;
        --ok: #087443;
        --warn: #b76e00;
        --blue: #155eef;
        --shadow: 0 12px 32px rgba(52, 41, 34, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: var(--ink);
        font-size: 14px;
      }
      .top {
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand {
        font-size: 16px;
        font-weight: 800;
      }
      .nav {
        display: flex;
        gap: 14px;
      }
      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      .nav a.active {
        color: var(--orange);
      }
      .main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 20px 24px 48px;
      }
      .hero {
        background: linear-gradient(135deg, #1f1a17, #4b3a31);
        color: #fff;
        border-radius: 18px;
        padding: 22px 26px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        box-shadow: var(--shadow);
      }
      .hero h1 {
        margin: 0 0 7px;
        font-size: 24px;
      }
      .hero p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
      }
      .hero-meta {
        text-align: right;
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        line-height: 1.7;
      }
      .quick-buttons,
      .view-tabs,
      .actions,
      .summary-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .quick-buttons {
        margin-top: 15px;
      }
      .quick-btn,
      .view-tab,
      .btn,
      .icon-btn {
        border: 1px solid transparent;
        border-radius: 8px;
        min-height: 44px;
        padding: 9px 13px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .quick-btn {
        min-height: 36px;
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .quick-btn[aria-pressed="true"] {
        background: var(--orange);
      }
      .view-tabs {
        margin: 16px 0 0;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 6px;
      }
      .analytics-tabs {
        margin-top: 10px;
        background: transparent;
        border-style: dashed;
      }
      .analytics-tabs[hidden] {
        display: none;
      }
      .action-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .action-bar p {
        margin: 0;
        color: var(--muted);
      }
      .timeline {
        display: grid;
        gap: 12px;
      }
      .timeline-item {
        border-left: 3px solid #ffd4c3;
        padding: 2px 0 2px 14px;
      }
      .timeline-item p {
        margin: 6px 0 0;
        color: var(--muted);
      }
      .inline-form {
        display: grid;
        gap: 10px;
      }
      .inline-form textarea {
        width: 100%;
        min-height: 110px;
        resize: vertical;
        border: 1px solid #d8d2cd;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      .funnel-track {
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 8px;
      }
      .funnel-stage {
        padding: 16px;
        border-radius: 10px;
        background: linear-gradient(135deg, #fff3ed, #fff);
        border: 1px solid #ffd4c3;
      }
      .funnel-stage strong {
        display: block;
        margin-top: 8px;
        font-size: 20px;
      }
      .view-tab {
        flex: 1;
        background: transparent;
        color: var(--muted);
        white-space: nowrap;
      }
      .view-tab[aria-selected="true"] {
        background: #fff3ed;
        color: #a63c12;
        box-shadow: inset 0 0 0 1px #ffd4c3;
      }
      .filters {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-top: 12px;
      }
      .filter-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(150px, 1fr));
        gap: 12px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .field input,
      .field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid #d8d2cd;
        border-radius: 8px;
        padding: 9px 11px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      .field-error {
        min-height: 16px;
        color: var(--danger);
        font-size: 12px;
      }
      .filter-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-top: 12px;
      }
      .applied {
        display: grid;
        gap: 7px;
        min-width: 0;
      }
      .applied-label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #f2efec;
        color: #514741;
        font-size: 12px;
      }
      .btn {
        background: #fff;
        border-color: #d8d2cd;
        color: var(--ink);
      }
      .btn.primary {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .workspace {
        margin-top: 16px;
      }
      .error-banner {
        display: none;
        background: #fff0ed;
        border: 1px solid #f1b5aa;
        color: #7a271a;
        border-radius: 12px;
        padding: 13px 15px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .error-banner.show {
        display: flex;
      }
      .trace {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .state-panel {
        display: none;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        min-height: 220px;
        padding: 40px;
        text-align: center;
        place-items: center;
      }
      .state-panel.show {
        display: grid;
      }
      .state-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .state-copy {
        color: var(--muted);
        line-height: 1.7;
      }
      .skeleton {
        width: min(760px, 100%);
        display: grid;
        gap: 12px;
      }
      .skeleton span {
        height: 20px;
        border-radius: 8px;
        background: linear-gradient(90deg, #eee9e5, #faf8f6, #eee9e5);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
      }
      .skeleton span:first-child {
        height: 80px;
      }
      .content {
        display: none;
      }
      .content.ready {
        display: block;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
      }
      .kpi {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 7px 18px rgba(52, 41, 34, 0.04);
      }
      .kpi.primary {
        border-top: 4px solid var(--orange);
      }
      .kpi-value {
        font-size: 29px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }
      .kpi-label {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .kpi-note {
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .meta-strip {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .meta-item {
        background: #eeeae6;
        border-radius: 10px;
        padding: 9px 11px;
        color: #5c514a;
        font-size: 12px;
      }
      .meta-item strong {
        display: block;
        color: var(--ink);
        margin-top: 3px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 12px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 7px 18px rgba(52, 41, 34, 0.04);
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .card-title {
        font-size: 15px;
        font-weight: 850;
      }
      .card-subtitle {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        margin-left: 8px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }
      .table th,
      .table td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        white-space: nowrap;
      }
      .table th {
        background: #faf9f7;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.03em;
      }
      .table tbody tr[data-action] {
        cursor: pointer;
      }
      .table tbody tr[data-action]:hover {
        background: #fff7f2;
      }
      .number {
        text-align: right !important;
        font-variant-numeric: tabular-nums;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 800;
        background: #eeeae6;
        color: #5c514a;
      }
      .pill.ok {
        background: #e8f7ef;
        color: var(--ok);
      }
      .pill.warn {
        background: #fff4db;
        color: var(--warn);
      }
      .pill.danger {
        background: #ffebe8;
        color: var(--danger);
      }
      .progress {
        height: 8px;
        background: #eeeae6;
        border-radius: 999px;
        overflow: hidden;
        min-width: 90px;
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--orange);
        border-radius: inherit;
      }
      .trend-layout {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 16px;
      }
      .trend-canvas {
        width: 100%;
        height: 220px;
      }
      .trend-summary {
        margin: 0 0 12px;
        color: #514741;
        line-height: 1.7;
      }
      .mobile-cards {
        display: none;
        gap: 10px;
      }
      .mobile-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        background: #fff;
      }
      .mobile-card button {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
      }
      .drawer-overlay,
      .preview {
        position: fixed;
        inset: 0;
        background: rgba(22, 18, 16, 0.46);
        opacity: 0;
        visibility: hidden;
        transition: 0.18s;
        z-index: 40;
      }
      .drawer-overlay.show,
      .preview.show {
        opacity: 1;
        visibility: visible;
      }
      .drawer {
        position: fixed;
        right: 0;
        top: 0;
        height: 100%;
        width: min(600px, 92vw);
        background: #fff;
        z-index: 41;
        transform: translateX(100%);
        transition: 0.22s;
        box-shadow: -20px 0 50px rgba(0, 0, 0, 0.16);
        display: flex;
        flex-direction: column;
      }
      .drawer.show {
        transform: translateX(0);
      }
      .drawer-head {
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .drawer-title {
        font-size: 17px;
        font-weight: 850;
      }
      .drawer-body {
        padding: 18px 20px;
        overflow: auto;
      }
      .drawer-section {
        border-bottom: 1px solid var(--line);
        padding: 0 0 14px;
        margin-bottom: 14px;
      }
      .drawer-section-title {
        font-weight: 800;
        margin-bottom: 8px;
      }
      .evidence-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 10px;
      }
      .evidence-button {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #faf8f6;
        padding: 7px;
        cursor: pointer;
      }
      .evidence-button img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 7px;
      }
      .preview {
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 30px;
      }
      .preview-inner {
        position: relative;
        max-width: 92vw;
        max-height: 92vh;
      }
      .preview img {
        max-width: 92vw;
        max-height: 88vh;
        border-radius: 12px;
        background: #fff;
      }
      .preview .icon-btn {
        position: absolute;
        right: 8px;
        top: 8px;
        background: #fff;
      }
      .icon-btn {
        background: #fff;
        border-color: #d8d2cd;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid rgba(21, 94, 239, 0.38);
        outline-offset: 2px;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (max-width: 1020px) {
        .filter-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .grid,
        .trend-layout {
          grid-template-columns: 1fr;
        }
        .meta-strip {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 760px) {
        .main {
          padding: 14px 12px 36px;
        }
        .top {
          padding: 11px 14px;
        }
        .hero {
          align-items: flex-start;
          flex-direction: column;
        }
        .hero-meta {
          text-align: left;
        }
        .view-tabs {
          overflow-x: auto;
          flex-wrap: nowrap;
        }
        .view-tab {
          flex: 0 0 auto;
        }
        .filter-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .filter-footer {
          align-items: stretch;
          flex-direction: column;
        }
        .actions .btn {
          flex: 1;
        }
        .kpis {
          grid-template-columns: 1fr;
        }
        .table-wrap {
          display: none;
        }
        .mobile-cards {
          display: grid;
        }
        .funnel-track {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        .filter-grid,
        .meta-strip {
          grid-template-columns: 1fr;
        }
        .field {
          min-width: 0;
        }
        .nav a:first-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">工作量驾驶舱</div>
      <nav class="nav" aria-label="后台导航">
        <a href="/admin/dashboard.html">后台首页</a
        ><a class="active" href="/admin/workload.html" aria-current="page"
          >工作量</a
        ><a href="/internal.html">工作台</a>
      </nav>
    </header>
    <main class="main">
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <h1 id="pageTitle">管理层工作量驾驶舱</h1>
          <p>统一口径查看完成、项目、员工、审核与全维度数据</p>
          <div class="quick-buttons" aria-label="快捷日期">
            <button
              class="quick-btn"
              data-range="yesterday"
              aria-pressed="false"
            >
              昨日</button
            ><button class="quick-btn" data-range="7d" aria-pressed="true">
              近 7 日</button
            ><button class="quick-btn" data-range="30d" aria-pressed="false">
              近 30 日
            </button>
          </div>
        </div>
        <div class="hero-meta">
          <div id="rangeStamp">准备加载</div>
          <div id="permissionStamp">正在确认数据权限</div>
        </div>
      </section>
      <div class="view-tabs" role="tablist" aria-label="工作量管理工作区">
        <button
          class="view-tab"
          id="tab-workspace-dashboard"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="true"
          data-workspace="dashboard"
        >
          数据驾驶舱
        </button>
        <button
          class="view-tab"
          id="tab-workspace-audit"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="audit"
        >
          审核队列
        </button>
        <button
          class="view-tab"
          id="tab-workspace-funnel"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="funnel"
        >
          经营漏斗
        </button>
        <button
          class="view-tab"
          id="tab-workspace-alerts"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="alerts"
        >
          预警建议
        </button>
        <button
          class="view-tab"
          id="tab-workspace-standards"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="standards"
        >
          岗位标准
        </button>
        <button
          class="view-tab"
          id="tab-workspace-imports"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="imports"
        >
          导入记录
        </button>
      </div>
      <div
        class="view-tabs analytics-tabs"
        id="analyticsTabs"
        role="tablist"
        aria-label="驾驶舱分析视图"
      >
        <button
          class="view-tab"
          id="tab-dashboard"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="true"
          data-view="dashboard"
        >
          驾驶舱
        </button>
        <button
          class="view-tab"
          id="tab-store"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="store"
        >
          门店周期完成
        </button>
        <button
          class="view-tab"
          id="tab-metric"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="metric"
        >
          项目选取度
        </button>
        <button
          class="view-tab"
          id="tab-staff"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="staff"
        >
          个人全数据
        </button>
        <button
          class="view-tab"
          id="tab-matrix"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="matrix"
        >
          项目全维度
        </button>
      </div>
      <section class="filters" aria-label="统一统计筛选器">
        <div class="filter-grid">
          <div class="field">
            <label for="dateFrom">开始日期</label
            ><input
              type="date"
              id="dateFrom"
              aria-describedby="dateError"
            /><span class="field-error" id="dateError"></span>
          </div>
          <div class="field">
            <label for="dateTo">结束日期</label
            ><input type="date" id="dateTo" />
          </div>
          <div class="field">
            <label for="storeId">门店</label
            ><select id="storeId">
              <option value="">全部可见门店</option>
            </select>
          </div>
          <div class="field">
            <label for="roleCode">岗位</label
            ><select id="roleCode">

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside
      class="drawer"

      role="dialog"
      aria-modal="true"

      tabindex="-1"
    >
      <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle">数据明细</div>
        <button
          class="icon-btn"

          关闭

    </aside>
    <div
      class="preview"

      role="dialog"

    >
      <div class="preview-inner">
        <h2 class="sr-only" id="previewTitle">凭证图片预览</h2>
        <button
          class="icon-btn"

        ><img id="previewImg" alt="工作量凭证大图" />

    </div>
    <script>
      var context = null,
        currentWorkspace = "dashboard",
        currentView = "dashboard",
        currentPayload = null,
        currentTrendRows = [],
        lastTrigger = null,
        drawerReturnFocus = null,
        previewReturnFocus = null,
        requestVersion = 0,
        storeOptions = [];
      var viewLabels = {
        dashboard: "驾驶舱",
        store: "门店周期完成",
        metric: "项目选取度",
        staff: "个人全数据",
        matrix: "项目全维度",
      };
      var workspaceLabels = {
        dashboard: "数据驾驶舱",
        audit: "审核队列",
        funnel: "经营漏斗",
        alerts: "预警建议",
        standards: "岗位标准",
        imports: "导入记录",
      };
      function byId(id) {
        return document.getElementById(id);
      }
      function esc(value) {
        return String(value == null ? "" : value).replace(
          /[&<>"']/g,
          function (char) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[char];
          },
        );
      }
      function today() {
        var date = new Date();
        return (
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(date.getDate()).padStart(2, "0")
        );
      }
      function daysAgo(count) {
        var date = new Date();
        date.setDate(date.getDate() - count);
        return (
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(date.getDate()).padStart(2, "0")
        );
      }
      function percent(ratio) {
        var value = ratio && typeof ratio === "object" ? ratio.value : ratio;
        return Math.round(Number(value || 0) * 100) + "%";
      }
      function valueOf(value) {
        return value && typeof value === "object"
          ? Number(value.value || 0)
          : Number(value || 0);
      }
      function formatNumber(value) {
        return Number(value || 0).toLocaleString("zh-CN", {
          maximumFractionDigits: 2,
        });
      }
      function roleLabel(value) {
        return (
          {
            sales: "销售",
            coach: "教练",
            manager: "店长",
            operation: "运营",
            finance: "财务",
          }[value] ||
          value ||
          "-"
        );
      }
      function sourceLabel(value) {
        return (
          {
            h5: "手机填报页",
            mini_program: "微信小程序",
            manual_correction: "管理更正",
            synthetic: "系统生成",
            import: "批量导入",
          }[value] ||
          value ||
          "-"
        );
      }
      function displayName(primary, fallback) {
        return primary || fallback || "未命名";
      }
      function metricName(row) {
        return displayName(row && row.metric_name, "未命名项目");
      }
      function relationName(row) {
        return displayName(row && row.relation_name, "未命名关系");
      }
      function versionName(value) {
        if (!value) return "当前版本";
        return "版本 " + String(value).replace(/^v/i, "").replace(/[-_]/g, " ");
      }
      function auditModeLabel(value) {
        return (
          { none: "无需审核", manual: "人工审核", evidence: "凭证审核", full: "完整审核" }[
            value
          ] || "按规则审核"
        );
      }
      function valueTypeLabel(value) {
        return (
          { number: "数值", integer: "整数", decimal: "小数", percentage: "百分比", currency: "金额" }[
            value
          ] || "数值"
        );
      }
      function directionLabel(value) {
        return ({ higher: "越高越好", lower: "越低越好", neutral: "中性" }[value] || "中性");
      }
      function relationStateLabel(value) {
        return ({ comparable: "可对比", empty: "暂无样本", unavailable: "暂无口径" }[value] || "暂无数据");
      }
      function importStatusLabel(value) {
        return (
          {
            uploaded: "已上传",
            preflight_ready: "预检通过",
            preflight_has_errors: "预检有问题",
            confirmed: "已生成草稿",
            failed: "处理失败",
          }[value] || "处理中"
        );
      }
      function differenceSummary(diff) {
        diff = diff || {};
        var added = (diff.added || []).length,
          modified = (diff.modified || []).length,
          removed = (diff.removed || []).length;
        return "新增 " + added + " 项，调整 " + modified + " 项，停用 " + removed + " 项。";
      }
      function statusLabel(value) {
        return (
          {
            missing: "缺交",
            draft: "草稿",
            submitted: "已提交",
            locked_missing: "锁定缺交",
            corrected: "管理更正",
            pending: "待审核",
            approved: "已通过",
            rejected: "已驳回",
            needs_resubmit: "待补凭证",
            not_required: "无需审核",
            sample_low: "样本不足",
            open: "待处理",
            resolved: "已处理",
            closed: "已关闭",
            published: "已发布",
            retired: "已停用",
          }[value] ||
          value ||
          "-"
        );
      }
      function auditStatusLabel(value) {
        return (
          {
            missing: "缺少审核任务",
            pending: "待审核",
            approved: "已通过",
            rejected: "已驳回",
            needs_resubmit: "待补凭证",
            not_required: "无需审核",
          }[value] ||
          value ||
          "-"
        );
      }
      function pill(value) {
        var kind = [
          "submitted",
          "corrected",
          "approved",
          "not_required",
        ].includes(value)
          ? "ok"
          : ["draft", "pending", "needs_resubmit"].includes(value)
            ? "warn"
            : ["missing", "locked_missing", "rejected"].includes(value)
              ? "danger"
              : "";
        return (
          '<span class="pill ' +
          kind +
          '">' +
          esc(statusLabel(value)) +
          "</span>"
        );
      }
      function filterScopeText() {
        var f = filters(), parts = [];
        parts.push((f.date_from || '-') + ' 至 ' + (f.date_to || '-'));
        if (f.store_id) {
          var store = storeOptions.find(function (item) {
            return String(item.id) === String(f.store_id);
          });
          parts.push(store ? store.name : '门店 ' + f.store_id);
        } else {
          parts.push('全部可见门店');
        }
        parts.push(f.role_code ? roleLabel(f.role_code) : '全部岗位');
        return parts.join(' · ');
      }
      function setRange(type, trigger) {
        byId("dateTo").value = type === "yesterday" ? daysAgo(1) : today();
        byId("dateFrom").value =
          type === "yesterday"
            ? daysAgo(1)
            : type === "30d"
              ? daysAgo(29)
              : daysAgo(6);
        document.querySelectorAll("[data-range]").forEach(function (button) {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.range === type),
          );
        });
        lastTrigger = trigger || null;
        loadData();
      }
      function setView(view, trigger) {
        currentView = view;
        lastTrigger = trigger || document.activeElement;
        document.querySelectorAll("[data-view]").forEach(function (tab) {
          var selected = tab.dataset.view === view;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        byId("analyticsContent").setAttribute("aria-labelledby", "tab-" + view);
        byId("primaryDimensionField").hidden = view !== "matrix";
        byId("secondaryDimensionField").hidden = view !== "matrix";
        byId("granularityField").hidden = !["staff", "matrix"].includes(view);
        var role = String(
          (context && context.role) || (context && context.role_code) || "",
        ).toLowerCase();
        if (
          view === "staff" &&
          context &&
          context.staff_id &&
          !context.is_hq &&
          !context.is_admin &&
          role !== "manager"
        ) {
          byId("staffId").value = context.staff_id;
          byId("staffId").readOnly = true;
        } else if (role === "manager") {
          byId("staffId").readOnly = false;
        }
        loadData();
      }
      function setWorkspace(workspace, trigger) {
        currentWorkspace = workspace;
        lastTrigger = trigger || document.activeElement;
        document.querySelectorAll("[data-workspace]").forEach(function (tab) {
          var selected = tab.dataset.workspace === workspace;
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        byId("analyticsTabs").hidden = workspace !== "dashboard";
        byId("exportBtn").hidden = workspace !== "dashboard";
        byId("analyticsContent").setAttribute(
          "aria-labelledby",
          workspace === "dashboard"
            ? "tab-" + currentView
            : "tab-workspace-" + workspace,
        );
        loadData();
      }
      function validateFilters() {
        byId("dateError").textContent = "";
        var from = byId("dateFrom").value,
          to = byId("dateTo").value;
        if (!from || !to) {
          byId("dateError").textContent = "请选择完整日期范围";
          byId(!from ? "dateFrom" : "dateTo").focus();
          return false;
        }
        if (from > to) {
          byId("dateError").textContent = "开始日期需早于或等于结束日期";
          byId("dateFrom").focus();
          return false;
        }
        var days = (new Date(to) - new Date(from)) / 86400000;
        if (days > 365) {
          byId("dateError").textContent = "日期范围最多 366 天";
          byId("dateFrom").focus();
          return false;
        }
        if (
          currentView === "staff" &&
          !/^\d+$/.test(byId("staffId").value.trim())
        ) {
          byId("dateError").textContent = "个人视图需要有效员工编号";
          byId("staffId").focus();
          return false;
        }
        if (
          currentView === "matrix" &&
          byId("primaryDimension").value === byId("secondaryDimension").value
        ) {
          byId("dateError").textContent = "主维度和次维度需要不同";
          byId("secondaryDimension").focus();
          return false;
        }
        return true;
      }
      function filters() {
        var result = {
          date_from: byId("dateFrom").value,
          date_to: byId("dateTo").value,
        };
        [
          ["storeId", "store_id"],
          ["roleCode", "role_code"],
          ["staffId", "staff_id"],
          ["metricCode", "metric_code"],
          ["reportStatus", "report_status"],
          ["auditStatus", "audit_status"],
          ["source", "source"],
        ].forEach(function (pair) {
          var value = byId(pair[0]).value.trim();
          if (value) result[pair[1]] = value;
        });
        return result;
      }
      function queryString(input) {
        var params = new URLSearchParams();
        Object.keys(input).forEach(function (key) {
          if (input[key] !== "" && input[key] != null)
            params.set(key, input[key]);
        });
        return params.toString();
      }
      function updateApplied() {
        var f = filters(),
          labels = {
            date_from: "开始",
            date_to: "结束",
            store_id: "门店",
            role_code: "岗位",
            staff_id: "员工",
            metric_code: "项目",
            report_status: "日报",
            audit_status: "审核",
            source: "来源",
          };
        var chips = Object.keys(f).map(function (key) {
          var value = f[key];
          if (key === "store_id") {
            var store = storeOptions.find(function (item) {
              return String(item.id) === String(value);
            });
            value = store ? store.name : value;
          }
          if (key === "role_code") value = roleLabel(value);
          if (key === "report_status") value = statusLabel(value);
          if (key === "audit_status") value = auditStatusLabel(value);
          if (key === "source") value = sourceLabel(value);
          return (
            '<span class="chip">' +
            esc(labels[key]) +
            ": " +
            esc(value) +
            "</span>"
          );
        });
        byId("appliedFilters").innerHTML =
          chips.join("") || '<span class="chip">默认权限范围</span>';
        byId("rangeStamp").textContent =
          f.date_from +
          " 至 " +
          f.date_to +
          " · " +
          (currentWorkspace === "dashboard"
            ? viewLabels[currentView]
            : workspaceLabels[currentWorkspace]);
      }
      function setAsyncState(state, error) {
        var workspace = document.querySelector(".workspace"),
          content = byId("analyticsContent");
        workspace.setAttribute("aria-busy", String(state === "loading"));
        content.className = "content" + (state === "ready" ? " ready" : "");
        content.dataset.state = state;
        byId("loadingState").classList.toggle("show", state === "loading");
        byId("emptyState").classList.toggle("show", state === "empty");
        byId("errorBanner").classList.toggle(
          "show",
          state === "error" || state === "timeout",
        );
        byId("refreshBtn").disabled = state === "loading";
        byId("exportBtn").disabled = state === "loading";
        if (error) {
          var trace =
            error.data &&
            error.data.data &&
            (error.data.data.trace_id || error.data.data.request_id);
          byId("errorTitle").textContent =
            state === "timeout" ? "查询超时" : "加载失败";
          byId("errorMessage").textContent = error.message || "统计查询失败";
          byId("traceId").textContent = trace ? "问题编号：" + trace : "";
        }
        byId("liveStatus").textContent =
          {
            loading: "正在加载",
            ready: "统计已更新",
            empty: "当前筛选无数据",
            error: "加载失败",
            timeout: "查询超时",
          }[state] || "";
      }
      function endpointForView(view, f) {
        var query = queryString(f);
        if (view === "store")
          return ["/api/workload/analytics/store-completion.php?" + query];
        if (view === "metric")
          return ["/api/workload/analytics/metric-selection.php?" + query];
        if (view === "staff")
          return [
            "/api/workload/analytics/staff-profile.php?" +
              query +
              "&granularity=" +
              encodeURIComponent(byId("granularity").value),
          ];
        if (view === "matrix")
          return [
            "/api/workload/analytics/cross-analysis.php?" +
              query +
              "&primary_dimension=" +
              byId("primaryDimension").value +
              "&secondary_dimension=" +
              byId("secondaryDimension").value +
              "&time_granularity=" +
              (byId("granularity").value === "week"
                ? "business_week"
                : byId("granularity").value),
          ];
        return [
          "/api/workload/analytics/store-completion.php?" + query,
          "/api/workload/analytics/metric-selection.php?" + query,
        ];
      }
      function endpointForWorkspace(workspace, f) {
        var query = queryString(f);
        if (workspace === "audit") {
          return [
            "/api/workload/audit-list.php?include_history=1&page_size=50&" +
              query,
          ];
        }
        if (workspace === "funnel") {
          return ["/api/workload/analytics/operating-funnel.php?" + query];
        }
        if (workspace === "alerts") {
          return ["/api/workload/alerts.php?page_size=50&" + query];
        }
        if (workspace === "standards") {
          return [
            "/api/admin/workload/standards.php?status=all&role_code=" +
              encodeURIComponent(f.role_code || ""),
          ];
        }
        if (workspace === "imports") {
          return [
            "/api/admin/workload/standard-import-batches.php?page_size=50",
          ];
        }
        return endpointForView(currentView, f);
      }
      async function loadData() {
        if (!validateFilters()) return;
        var version = ++requestVersion;
        updateApplied();
        currentPayload = null;
        byId("analyticsContent").innerHTML = "";
        setAsyncState("loading");
        try {
          var endpoints = endpointForWorkspace(currentWorkspace, filters());
          var responses = await Promise.all(
            endpoints.map(function (url) {
              return ApiClient.get(url, { timeout: 15000 });
            }),
          );
          if (version !== requestVersion) return;
          currentPayload = responses.map(function (response) {
            return response.data;
          });
          renderCurrent(currentPayload);
          setAsyncState(hasCurrentRows(currentPayload) ? "ready" : "empty");
        } catch (error) {
          if (version !== requestVersion) return;
          setAsyncState(
            Number(error.code) === 408 || /超时/.test(error.message || "")
              ? "timeout"
              : "error",
            error,
          );
        }
      }
      function hasCurrentRows(payload) {
        if (
          currentWorkspace === "audit" ||
          currentWorkspace === "alerts" ||
          currentWorkspace === "standards" ||
          currentWorkspace === "imports"
        ) {
          return (payload[0].list || []).length > 0;
        }
        if (currentWorkspace === "funnel") return true;
        if (currentView === "dashboard")
          return (
            (payload[0].store_summaries || []).length > 0 ||
            (payload[1].project_summaries || []).length > 0
          );
        if (currentView === "store")
          return (payload[0].store_summaries || []).length > 0;
        if (currentView === "metric")
          return (payload[0].project_summaries || []).length > 0;
        if (currentView === "staff")
          return (payload[0].daily_records || []).length > 0;
        if (currentView === "matrix")
          return (payload[0].matrix || []).length > 0;
        return false;
      }

      function aggregateDailyCompletion(rows) {
        var days = {};

            business_date: date,
            required_count: 0,
            completed_count: 0,
          };
          days[date].required_count += Number(row.required_count || 0);
          days[date].completed_count += Number(row.completed_count || 0);
        });
        return Object.keys(days)
          .sort()
          .map(function (date) {
            var row = days[date];
            row.completion_rate = {
              numerator: row.completed_count,
              denominator: row.required_count,
              value: row.required_count

            return row;

      function trendText(rows) {

        var first = valueOf(rows[0].completion_rate),

          delta = Math.round((last - first) * 100);
        return (

          percent(first) +
          " 变化到 " +
          percent(last) +
          "，" +
          (delta > 0 ? "上升 " : delta < 0 ? "下降 " : "保持 ") +
          Math.abs(delta) +

      function drawVisibleTrend() {
        var canvas = byId("trendChart");
        if (!canvas || !currentPayload) return;
        var rows = currentTrendRows;
        var rect = canvas.getBoundingClientRect(),
          ratio = window.devicePixelRatio || 1;
        canvas.width = Math.max(300, rect.width) * ratio;
        canvas.height = 220 * ratio;
        var ctx = canvas.getContext("2d");
        ctx.scale(ratio, ratio);
        var width = canvas.width / ratio,
          height = 220,
          pad = 28;
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#e3ddd8";
        for (var grid = 0; grid <= 4; grid++) {
          var y = pad + ((height - pad * 2) * grid) / 4;
          ctx.beginPath();
          ctx.moveTo(pad, y);
          ctx.lineTo(width - pad, y);
          ctx.stroke();
        }
        if (!rows.length) return;
        ctx.strokeStyle = "#ff6b35";
        ctx.lineWidth = 3;
        ctx.beginPath();
        rows.forEach(function (row, index) {
          var x =
            rows.length === 1
              ? width / 2
              : pad + ((width - pad * 2) * index) / (rows.length - 1);
          var y =
            height - pad - valueOf(row.completion_rate) * (height - pad * 2);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

      function idempotencyKey(prefix) {
        return (
          prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2)

      async function apiMutation(url, body, key) {
        var headers = {
          "Content-Type": "application/json",
          "Idempotency-Key": key || idempotencyKey("workload"),
        };
        if (window.AppAuth && AppAuth.authHeaders)
          headers = AppAuth.authHeaders(headers);
        var response = await fetch(url, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(body || {}),
        });
        var json = await response.json();
        if (!response.ok || Number(json.code) !== 0)
          throw new Error(json.message || "操作失败");
        return json.data;
      }

      async function handleBusinessAction() {
        var action = this.dataset.business;
        var index = Number(this.dataset.index || 0);
        var row = (currentPayload[0].list || [])[index];
        try {
          if (action === "audit-open") return openAuditAction(row);
          if (action === "alert-open") return openAlertAction(row);
          if (action === "funnel-drill")
            return openFunnelDrill(this.dataset.kind, index);
          if (action === "standard-detail") return openStandardDetail(row);
          if (action === "standard-create") return openStandardEditor();
          if (action === "standard-copy") {
            await apiMutation(
              "/api/admin/workload/standard-copy.php",
              { source_version_id: row.id, effective_from: today() },
              idempotencyKey("standard-copy"),
            );
          } else if (action === "standard-publish") {
            return openStandardPublish(row);
          } else if (action === "standard-disable") {
            await apiMutation(
              "/api/admin/workload/standard-disable.php",
              { version_id: row.id, effective_to: today() },
              idempotencyKey("standard-disable"),
            );
          } else if (action === "standard-delete") {
            if (!window.confirm("确认删除这个未引用草稿？")) return;
            await apiMutation(
              "/api/admin/workload/standard-delete.php",
              { version_id: row.id },
              idempotencyKey("standard-delete"),
            );
          } else if (action === "import-detail") return openImportDetail(row);
          else if (action === "import-confirm") {
            await apiMutation(
              "/api/admin/workload/standard-import-batches.php",
              {
                batch_id: row.id,
                action: "confirm",
                publish: false,
                effective_from: today(),
              },
              idempotencyKey("standard-import-confirm"),

          setAsyncState("error", error);

      async function uploadStandardFile(event) {
        event.preventDefault();
        var input = byId("standardImportFile");
        if (!input.files.length) {
          input.focus();
          return;
        }
        var headers = { "Idempotency-Key": idempotencyKey("standard-import") };
        if (window.AppAuth && AppAuth.authHeaders)
          headers = AppAuth.authHeaders(headers);
        var form = new FormData();
        form.append("file", input.files[0]);
        try {
          var response = await fetch(
            "/api/admin/workload/standard-import.php",
            { method: "POST", headers: headers, body: form },
          );
          var json = await response.json();
          if (!response.ok || Number(json.code) !== 0)
            throw new Error(json.message || "导入预检失败");
          loadData();
        } catch (error) {
          setAsyncState("error", error);
        }

      function bindRowActions() {
        byId("analyticsContent")
          .querySelectorAll("[data-action]")
          .forEach(function (element) {
            element.addEventListener("click", activateRow);
            element.addEventListener("keydown", function (event) {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                activateRow.call(element, event);
              }
            });
          });
      }
      function activateRow() {
        var action = this.dataset.action,
          index = Number(this.dataset.index),
          data = currentPayload[0];
        if (action === "store")
          openStoreDetail((data.store_summaries || [])[index]);
        if (action === "metric")
          openMetricDetail(
            ((currentView === "dashboard" ? currentPayload[1] : data)

          );

        if (action === "matrix") openMatrixDetail((data.matrix || [])[index]);

        byId("drawerOverlay").classList.add("show");
        byId("detailDrawer").classList.add("show");

        });

      function closeDrawer() {

            percent(row.selection_rate) +

            "，门店覆盖率 " +

            esc(row.sample_size || 0) +

      function evidenceHtml(metrics) {
        var evidences = [];
        (metrics || []).forEach(function (metric) {
          (metric.evidences || []).forEach(function (item) {
            evidences.push(item);
          });
        });
        if (!evidences.length) return "<p>无凭证</p>";
        return (
          '<div class="evidence-grid">' +
          evidences
            .map(function (item, index) {
              var url = item.file_url || item.url || "";
              return (
                '<button class="evidence-button" data-evidence-url="' +
                esc(url) +
                '" aria-label="预览第 ' +
                (index + 1) +
                ' 张工作量凭证"><img src="' +
                esc(url) +
                '" alt="第 ' +
                (index + 1) +
                ' 张工作量凭证缩略图"></button>'
              );

            .join("") +
          "</div>"

      }
      function openStaffRecord(row) {
        openDrawer(
          row.business_date + " · " + (row.store_name || "日报"),

            pill(row.completion_status) +

            esc(roleLabel(row.role_code)) +

            (row.metrics || [])
              .map(function (metric) {
                return (
                  "<p><strong>" +
                  esc(metricName(metric)) +

                  formatNumber(metric.raw_value) +

              .join("") +

      async function openMatrixDetail(row) {
        openDrawer(
          "最细事实记录",
          '<div class="state-copy">正在加载下钻明细...</div>',
          document.activeElement,
        );
        try {
          var drill = row.drilldown || {},
            response = await ApiClient.get(
              (drill.endpoint || "/api/workload/analytics/metric-detail.php") +

          byId("drawerContent").innerHTML = rows.length
            ? rows
                .map(function (item) {
                  return (
                    '<div class="drawer-section"><strong>' +

                    esc(item.store_name || item.store_id) +
                    " · " +
                    esc(item.staff_name || item.staff_id) +
                    "</strong><p>" +
                    esc(metricName(item)) +
                    "：原始 " +
                    formatNumber(item.raw_value) +
                    "，有效 " +
                    formatNumber(item.effective_value) +
                    "，" +
                    auditStatusLabel(item.audit_status) +

                  );
                })

            : '<div class="state-copy">暂无最细事实记录</div>';
        } catch (error) {

      function bindEvidenceButtons() {
        byId("drawerContent")
          .querySelectorAll("[data-evidence-url]")
          .forEach(function (button) {
            button.addEventListener("click", function () {
              openPreview(button.dataset.evidenceUrl, button);

      }
      function openPreview(url, trigger) {
        previewReturnFocus = trigger || document.activeElement;
        byId("previewImg").src = url;
        byId("previewModal").classList.add("show");
        requestAnimationFrame(function () {
          byId("closePreviewBtn").focus();
        });
      }
      function closePreview() {
        byId("previewModal").classList.remove("show");
        byId("previewImg").src = "";
        if (previewReturnFocus && previewReturnFocus.focus)
          previewReturnFocus.focus();
        previewReturnFocus = null;
      }
      function focusables(layer) {
        return Array.from(
          layer.querySelectorAll(
            'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])',
          ),
        ).filter(function (element) {
          return !element.closest("[hidden]");
        });
      }
      function trapFocus(event, layer) {
        if (event.key !== "Tab") return;
        var items = focusables(layer),
          first = items[0],
          last = items[items.length - 1];
        if (!first) return;
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
      function waitForExport(delay) {
        return new Promise(function (resolve) {
          setTimeout(resolve, delay);
        });
      }
      async function downloadExportJob(jobId, headers) {
        for (var attempt = 0; attempt < 120; attempt++) {
          var statusResponse = await fetch(
            "/api/workload/exports.php?id=" + encodeURIComponent(jobId),
            { headers: headers },
          );
          var statusJson = await statusResponse.json();
          if (!statusResponse.ok || Number(statusJson.code) !== 0)
            throw new Error(statusJson.message || "查询导出任务失败");
          var job = statusJson.data || {};
          if (job.status === "failed")
            throw new Error(job.error_message || "异步导出失败");
          if (job.download_ready) {
            var downloadResponse = await fetch(
              "/api/workload/exports.php?id=" +
                encodeURIComponent(jobId) +
                "&download=1",
              { headers: headers },
            );
            if (!downloadResponse.ok) throw new Error("异步导出下载失败");
            var blob = await downloadResponse.blob(),
              url = URL.createObjectURL(blob),
              link = document.createElement("a");
            link.href = url;
            link.download = "workload-export-" + jobId + ".csv";
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            byId("liveStatus").textContent = "异步导出已完成，下载已开始";
            return;
          }
          byId("liveStatus").textContent = "异步导出处理中，任务编号 " + jobId;
          await waitForExport(2000);
        }
        throw new Error("异步导出等待超时，请稍后重试");
      }
      async function exportCurrent() {
        if (!validateFilters()) return;
        var exportType = {
          dashboard: "store_completion",
          store: "store_completion",
          metric: "metric_selection",
          staff: "staff_full_data",
          matrix: "metric_full_dimension",
        }[currentView];
        var button = byId("exportBtn");
        button.disabled = true;
        button.textContent = "正在导出...";
        try {
          var headers = { "Content-Type": "application/json" };
          if (window.AppAuth && AppAuth.authHeaders)
            headers = AppAuth.authHeaders(headers);
          var controller = new AbortController(),
            timer = setTimeout(function () {
              controller.abort();
            }, 15000);
          var response = await fetch("/api/workload/exports.php", {
            method: "POST",
            headers: headers,
            body: JSON.stringify(
              Object.assign({ export_type: exportType }, filters()),
            ),
            signal: controller.signal,
          });
          clearTimeout(timer);
          var contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            var json = await response.json();
            if (!response.ok || Number(json.code) !== 0)
              throw new Error(json.message || "导出失败");
            var jobId = json.data && json.data.job_id;
            if (!jobId) throw new Error("导出任务编号缺失");
            button.textContent = "后台生成中...";
            await downloadExportJob(jobId, headers);
            setAsyncState("ready");
            return;
          }
          if (!response.ok) throw new Error("导出失败");
          var blob = await response.blob(),
            url = URL.createObjectURL(blob),
            link = document.createElement("a");
          link.href = url;
          link.download =
            "workload-" +
            currentView +
            "-" +
            byId("dateFrom").value +
            "-" +
            byId("dateTo").value +
            ".csv";
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          byId("liveStatus").textContent = "表格导出已开始";
        } catch (error) {
          setAsyncState(
            error.name === "AbortError" ? "timeout" : "error",
            new Error(
              error.name === "AbortError" ? "导出请求超时" : error.message,
            ),
          );
        } finally {
          button.disabled = false;
          button.textContent = "导出当前视图";
        }
      }
      async function loadStores() {
        try {
          var response = await ApiClient.get(
            "/api/statistics/store.php?page_size=100",
          );
          storeOptions =
            response.data && Array.isArray(response.data.list)
              ? response.data.list
              : [];
          byId("storeId").innerHTML =
            '<option value="">全部可见门店</option>' +
            storeOptions
              .map(function (store) {
                return (
                  '<option value="' +
                  esc(store.id) +
                  '">' +
                  esc(store.name || "门店 " + store.id) +
                  "</option>"
                );
              })
              .join("");
        } catch (error) {
          storeOptions = [];
        }
      }
      function clearFilters() {
        byId("dateFrom").value = daysAgo(6);
        byId("dateTo").value = today();
        [
          "storeId",
          "roleCode",
          "staffId",
          "metricCode",
          "reportStatus",
          "auditStatus",
          "source",
        ].forEach(function (id) {
          if (!byId(id).disabled && !byId(id).readOnly) byId(id).value = "";
        });
        byId("granularity").value = "day";
        byId("primaryDimension").value = "store";
        byId("secondaryDimension").value = "metric";
        loadData();
      }
      async function init() {
        byId("dateFrom").value = daysAgo(6);
        byId("dateTo").value = today();
        byId("dateFrom").max = today();
        byId("dateTo").max = today();
        try {
          var response = await ApiClient.get("/api/common/context-info.php");
          context = response.data.context || {};
          await loadStores();
          var role = String(
            context.role || context.role_code || "",
          ).toLowerCase();
          if (context.store_id && !context.is_hq && !context.is_admin) {
            byId("storeId").value = String(context.store_id);
            byId("storeId").disabled = true;
          }
          if (!context.is_hq && !context.is_admin && role === "manager")
            currentView = "store";
          if (!context.is_hq && !context.is_admin && role !== "manager") {
            currentView = "staff";
            byId("staffId").value = String(context.staff_id || "");
            byId("staffId").readOnly = true;
          }
          document
            .querySelectorAll(
              '[data-workspace="standards"],[data-workspace="imports"]',
            )
            .forEach(function (tab) {
              tab.hidden =
                !context.is_hq &&
                !context.is_admin &&
                !["operation", "admin", "ceo"].includes(role);
            });
          setView(currentView);
        } catch (error) {
          setAsyncState(
            Number(error.code) === 408 ? "timeout" : "error",
            error,
          );
        }
      }
      document.querySelectorAll("[data-range]").forEach(function (button) {
        button.addEventListener("click", function () {
          setRange(button.dataset.range, button);
        });
      });
      function bindTabs(selector, activate) {
        document.querySelectorAll(selector).forEach(function (tab) {
          tab.addEventListener("click", function () {
            activate(tab, tab);
          });
          tab.addEventListener("keydown", function (event) {
            if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key))
              return;
            event.preventDefault();
            var tabs = Array.from(document.querySelectorAll(selector)).filter(
                function (item) {
                  return !item.hidden;
                },
              ),
              index = tabs.indexOf(tab);
            if (event.key === "Home") index = 0;
            else if (event.key === "End") index = tabs.length - 1;
            else
              index =
                (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                tabs.length;
            tabs[index].focus();
            activate(tabs[index], tabs[index]);
          });
        });
      }
      bindTabs("[data-workspace]", function (tab, trigger) {
        setWorkspace(tab.dataset.workspace, trigger);
      });
      bindTabs("[data-view]", function (tab, trigger) {
        setView(tab.dataset.view, trigger);
      });
      byId("refreshBtn").addEventListener("click", loadData);
      byId("retryBtn").addEventListener("click", loadData);
      byId("clearFiltersBtn").addEventListener("click", clearFilters);
      byId("exportBtn").addEventListener("click", exportCurrent);
      byId("closeDrawerBtn").addEventListener("click", closeDrawer);
      byId("drawerOverlay").addEventListener("click", closeDrawer);
      byId("closePreviewBtn").addEventListener("click", closePreview);
      byId("previewModal").addEventListener("click", function (event) {
        if (event.target === byId("previewModal")) closePreview();
      });
      document.addEventListener("keydown", function (event) {
        if (byId("previewModal").classList.contains("show")) {
          if (event.key === "Escape") {
            event.preventDefault();
            closePreview();
          } else trapFocus(event, byId("previewModal"));
          return;
        }
        if (byId("detailDrawer").classList.contains("show")) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeDrawer();
          } else trapFocus(event, byId("detailDrawer"));
        }
      });
      window.addEventListener("resize", function () {
        if (byId("trendChart")) drawVisibleTrend();
      });
      window.requirePageAuth({
        onAuthed: async function (user) {
          var role = String((user && user.role) || "").toLowerCase(),
            allowed =
              !!(user && user.is_hq) ||
              ["admin", "ceo", "operation", "finance", "manager"].includes(
                role,
              );
          if (!allowed) {
            window.location.replace("/internal.html");
            return;
          }
          init();
        },
      });
    </script>
