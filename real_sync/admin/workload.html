<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>工作量驾驶舱 - 追光小牛管理后台</title>
    <script src="/js/app-auth.js?v=3"></script>
    <script src="/internal-auth.js?v=8"></script>
    <script src="/js/api-client.js?v=3"></script>
    <link rel="stylesheet" href="/assets/pages/admin-workload.css?v=r2">
  </head>
  <body>
    <header class="top">
      <div class="brand">工作量驾驶舱</div>
      <nav class="nav" aria-label="后台导航">
        <a href="/admin/dashboard.html">后台首页</a
        ><a class="active" href="/admin/workload.html" aria-current="page"
          >工作量</a
        ><a href="/internal.html">工作台</a>
      </nav>
    </header>
    <main class="main">
      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <h1 id="pageTitle">工作量每日追踪</h1>
          <p>优先跟进每日差额、补齐、审核和处罚处理进度</p>
          <div class="quick-buttons" aria-label="快捷日期">
            <button
              class="quick-btn"
              data-range="yesterday"
              aria-pressed="false"
            >
              昨日</button
            ><button class="quick-btn" data-range="7d" aria-pressed="true">
              近 7 日</button
            ><button class="quick-btn" data-range="30d" aria-pressed="false">
              近 30 日
            </button>
          </div>
        </div>
        <div class="hero-meta">
          <div id="rangeStamp">准备加载</div>
          <div id="permissionStamp">正在确认数据权限</div>
        </div>
      </section>
      <div class="view-tabs" role="tablist" aria-label="工作量管理工作区">
        <button
          class="view-tab"
          id="tab-workspace-tracking"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="true"
          data-workspace="tracking"
        >
          每日追踪
        </button>
        <button
          class="view-tab"
          id="tab-workspace-penalties"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="penalties"
        >
          处罚处理
        </button>
        <button
          class="view-tab"
          id="tab-workspace-dashboard"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="dashboard"
        >
          数据驾驶舱
        </button>
        <button
          class="view-tab"
          id="tab-workspace-audit"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="audit"
        >
          审核队列
        </button>
        <button
          class="view-tab"
          id="tab-workspace-funnel"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="funnel"
        >
          经营漏斗
        </button>
        <button
          class="view-tab"
          id="tab-workspace-alerts"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="alerts"
        >
          预警建议
        </button>
        <button
          class="view-tab"
          id="tab-workspace-standards"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="standards"
        >
          岗位标准
        </button>
        <button
          class="view-tab"
          id="tab-workspace-imports"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-workspace="imports"
        >
          导入记录
        </button>
      </div>
      <div
        class="view-tabs analytics-tabs"
        id="analyticsTabs"
        role="tablist"
        aria-label="驾驶舱分析视图"
      >
        <button
          class="view-tab"
          id="tab-dashboard"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="true"
          data-view="dashboard"
        >
          驾驶舱
        </button>
        <button
          class="view-tab"
          id="tab-store"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="store"
        >
          门店周期完成
        </button>
        <button
          class="view-tab"
          id="tab-metric"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="metric"
        >
          项目选取度
        </button>
        <button
          class="view-tab"
          id="tab-staff"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="staff"
        >
          个人全数据
        </button>
        <button
          class="view-tab"
          id="tab-matrix"
          role="tab"
          aria-controls="analyticsContent"
          aria-selected="false"
          data-view="matrix"
        >
          项目全维度
        </button>
      </div>
      <section class="filters" aria-label="统一统计筛选器">
        <div class="filter-grid">
          <div class="field">
            <label for="dateFrom">开始日期</label
            ><input
              type="date"
              id="dateFrom"
              aria-describedby="dateError"
            /><span class="field-error" id="dateError"></span>
          </div>
          <div class="field">
            <label for="dateTo">结束日期</label
            ><input type="date" id="dateTo" />
          </div>
          <div class="field">
            <label for="storeId">门店</label
            ><select id="storeId">
              <option value="">全部可见门店</option>
            </select>
          </div>
          <div class="field">
            <label for="roleCode">岗位</label
            ><select id="roleCode">
              <option value="">全部岗位</option>
              <option value="sales">销售</option>
              <option value="coach">教练</option>
              <option value="manager">店长</option>
              <option value="operation">运营</option>
            </select>
          </div>
          <div class="field">
            <label for="staffName">员工姓名</label
            ><input id="staffName" autocomplete="off" placeholder="输入姓名后选择员工" aria-describedby="staffMatchHint" /><input id="staffId" type="hidden" /><div class="staff-match-list" id="staffMatchList" aria-live="polite"></div><span class="field-error" id="staffMatchHint"></span>
          </div>
          <div class="field">
            <label for="metricCode">项目名称</label
            ><input id="metricCode" placeholder="全部项目" />
          </div>
          <div class="field">
            <label for="reportStatus">日报状态</label
            ><select id="reportStatus">
              <option value="">全部日报状态</option>
              <option value="submitted">已提交</option>
              <option value="draft">草稿</option>
            </select>
          </div>
          <div class="field">
            <label for="auditStatus">审核状态</label
            ><select id="auditStatus">
              <option value="">全部审核状态</option>
              <option value="missing">缺少审核任务</option>
              <option value="pending">待审核</option>
              <option value="approved">已通过</option>
              <option value="rejected">已驳回</option>
              <option value="needs_resubmit">待补凭证</option>
              <option value="not_required">无需审核</option>
            </select>
          </div>
          <div class="field">
            <label for="source">数据来源</label
            ><select id="source">
              <option value="">默认经营来源</option>
              <option value="h5">手机填报页</option>
              <option value="mini_program">微信小程序</option>
            </select>
          </div>
          <div class="field" id="granularityField">
            <label for="granularity">趋势粒度</label
            ><select id="granularity">
              <option value="day">按日</option>
              <option value="week">按周</option>
              <option value="month">按月</option>
            </select>
          </div>
          <div class="field" id="primaryDimensionField" hidden>
            <label for="primaryDimension">主维度</label
            ><select id="primaryDimension">
              <option value="store">门店</option>
              <option value="metric">项目</option>
              <option value="staff">员工</option>
              <option value="time">时间</option>
            </select>
          </div>
          <div class="field" id="secondaryDimensionField" hidden>
            <label for="secondaryDimension">次维度</label
            ><select id="secondaryDimension">
              <option value="metric">项目</option>
              <option value="staff">员工</option>
              <option value="time">时间</option>
              <option value="store">门店</option>
            </select>
          </div>
        </div>
        <div class="filter-footer">
          <div class="applied">
            <span class="applied-label">已生效条件</span>
            <div class="summary-chips" id="appliedFilters" aria-live="polite">
              <span class="chip">等待查询</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn" id="clearFiltersBtn">清空</button
            ><button class="btn" id="exportBtn">导出当前视图</button
            ><button class="btn primary" id="refreshBtn">应用筛选</button>
          </div>
        </div>
      </section>
      <section class="workspace" aria-live="polite" aria-busy="false">
        <div
          class="error-banner"
          id="errorBanner"
          role="alert"
          data-testid="workload-error"
        >
          <div>
            <strong id="errorTitle">加载失败</strong>
            <div id="errorMessage"></div>
            <div class="trace" id="traceId"></div>
          </div>
          <button class="btn" id="retryBtn">重试</button>
        </div>
        <div
          class="state-panel"
          id="loadingState"
          data-testid="workload-loading"
        >
          <div class="skeleton">
            <span></span><span></span><span></span><span></span>
            <div class="state-copy">正在读取工作量数据...</div>
          </div>
        </div>
        <div class="state-panel" id="emptyState" data-testid="workload-empty">
          <div>
            <div class="state-title">当前条件下暂无数据</div>
            <div class="state-copy">调整日期或筛选范围后重新查询。</div>
          </div>
        </div>
        <div
          class="content"
          id="analyticsContent"
          role="tabpanel"
          aria-labelledby="tab-workspace-tracking"
          data-state="idle"
        ></div>
        <div
          class="sr-only"
          id="liveStatus"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </main>
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside
      class="drawer"
      id="detailDrawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawerTitle"
      tabindex="-1"
    >
      <div class="drawer-head">
        <div class="drawer-title" id="drawerTitle">数据明细</div>
        <button
          class="icon-btn"
          id="closeDrawerBtn"
          aria-label="关闭数据明细抽屉"
        >
          关闭
        </button>
      </div>
      <div class="drawer-body" id="drawerContent"></div>
    </aside>
    <div
      class="preview"
      id="previewModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="previewTitle"
      tabindex="-1"
    >
      <div class="preview-inner">
        <h2 class="sr-only" id="previewTitle">凭证图片预览</h2>
        <button
          class="icon-btn"
          id="closePreviewBtn"
          aria-label="关闭凭证图片预览"
        >
          关闭</button
        ><img id="previewImg" alt="工作量凭证大图" />
      </div>
    </div>
    <script src="/assets/pages/admin-workload.js?v=r2"></script>
  </body>
</html>
