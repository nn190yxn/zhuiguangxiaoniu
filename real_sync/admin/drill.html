<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>销售演练中心 - 追光小牛管理后台</title>
    <script>window.__SKIP_AUTO_INTERNAL_AUTH__ = true;</script>
    <script src="/internal-auth.js?v=8"></script>
    <script src="/js/app-auth.js?v=3"></script>
    <script src="/js/api-client.js?v=3"></script>
    <script src="/js/drill-admin.js?v=1" defer></script>
    <style>
      :root{--orange:#ff6b35;--ink:#1f1a17;--muted:#6b625c;--bg:#f6f4f1;--card:#fff;--line:rgba(31,26,23,.1);--danger:#b42318;--ok:#087443;--warn:#b76e00;--blue:#155eef;--shadow:0 12px 32px rgba(52,41,34,.08)}
      *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px} button,input,select,textarea{font:inherit} button{cursor:pointer} a{text-decoration:none;color:inherit}
      .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:16px;font-weight:800}.nav{display:flex;gap:14px}.nav a{color:var(--muted);font-size:13px;font-weight:700}.nav a.active{color:var(--orange)}.main{max-width:1440px;margin:0 auto;padding:20px 24px 48px}
      .hero{background:linear-gradient(135deg,#1f1a17,#4b3a31);color:#fff;border-radius:18px;padding:22px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;box-shadow:var(--shadow)}.hero h1{margin:0 0 7px;font-size:24px}.hero p{margin:0;color:rgba(255,255,255,.72)}.hero-meta{text-align:right;color:rgba(255,255,255,.72);font-size:12px;line-height:1.8}
      .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}.tab,.btn{border:1px solid transparent;border-radius:8px;min-height:40px;padding:8px 12px;font-weight:700}.tab{background:transparent;color:var(--muted)}.tab[aria-selected="true"]{background:#fff0ea;color:var(--orange);border-color:#ffd5c5}.btn{background:var(--orange);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.btn.warn{background:#fff7e6;color:var(--warn);border-color:#f5d49e}.btn:disabled{opacity:.5;cursor:not-allowed}.workspace{display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 22px rgba(52,41,34,.035)}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.heading h2,.heading h3{margin:0;font-size:18px}.heading p{margin:6px 0 0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;min-height:40px;border:1px solid #d8d2cd;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:88px;resize:vertical}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{min-height:20px;color:var(--muted);font-size:13px}.status.error{color:var(--danger)}.status.success{color:var(--ok)}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#7a4d00;border:1px solid #f5d49e}.empty{padding:24px;color:var(--muted);text-align:center;background:#fbfaf8;border-radius:10px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;font-size:13px}.table th{font-size:12px;color:var(--muted);white-space:nowrap}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#f5f1ea;color:var(--muted);font-size:12px;font-weight:700}.badge.published,.badge.passed,.badge.completed{background:#e9f7ef;color:var(--ok)}.badge.draft,.badge.in_review,.badge.awaiting_review{background:#fff7e6;color:var(--warn)}.badge.archived,.badge.failed,.badge.coaching_required{background:#fff0f0;color:var(--danger)}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:7px;font-size:24px}.filter-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.drawer{position:fixed;inset:0;background:rgba(31,26,23,.38);z-index:30;display:flex;justify-content:flex-end}.drawer[hidden]{display:none}.drawer-panel{width:min(680px,100%);height:100%;overflow:auto;background:#fff;padding:22px;box-shadow:-18px 0 40px rgba(31,26,23,.16)}.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.drawer-head h2{margin:0;font-size:20px}.drawer-close{border:0;background:#f5f1ea;border-radius:8px;min-width:40px;min-height:40px}.low-sample{color:var(--warn);font-size:12px;font-weight:700}
      @media(max-width:1100px){.grid,.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.top{padding:12px 16px}.nav a:first-child{display:none}.main{padding:14px 12px 32px}.hero{padding:18px;align-items:flex-start;flex-direction:column}.hero-meta{text-align:left}.tabs{flex-wrap:nowrap;overflow:auto}.tab{white-space:nowrap}.grid,.grid.two,.filter-grid,.summary{grid-template-columns:1fr}.table-wrap{margin:0 -6px}.table th,.table td{padding:10px 6px}.actions .btn{flex:1}.field.full{grid-column:auto}}
    </style>
  </head>
  <body>
    <header class="top"><div class="brand">销售演练中心</div><nav class="nav" aria-label="后台导航"><a href="/admin/dashboard.html">后台首页</a><a href="/admin/workload.html">工作量</a><a class="active" href="/admin/drill.html" aria-current="page">演练中心</a><a href="/internal.html">工作台</a></nav></header>
    <main class="main">
      <section class="hero"><div><h1>销售演练运营中心</h1><p>从内容治理、计划发布到复核辅导，用同一条训练链推动门店能力提升。</p></div><div class="hero-meta"><div id="currentUser">正在确认当前账号</div><div id="scopeStamp">正在确认数据范围</div></div></section>
      <nav class="tabs" role="tablist" aria-label="演练管理工作区">
        <button class="tab" role="tab" aria-selected="true" data-workspace="content">内容与版本</button><button class="tab" role="tab" aria-selected="false" data-workspace="quality">评分与学习</button><button class="tab" role="tab" aria-selected="false" data-workspace="plans">计划与任务</button><button class="tab" role="tab" aria-selected="false" data-workspace="reviews">复核与辅导</button><button class="tab" role="tab" aria-selected="false" data-workspace="analytics">训练分析</button><button class="tab" role="tab" aria-selected="false" data-workspace="migration">迁移预检</button>
      </nav>
      <div id="accessNotice" class="notice" hidden></div><p id="pageStatus" class="status" role="status" aria-live="polite"></p>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
    <div id="actionDrawer" class="drawer" hidden aria-hidden="true"><section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle">处理演练事项</h2><button id="drawerClose" class="drawer-close" type="button" aria-label="关闭">关闭</button></div><div id="drawerBody"></div></section></div>
  </body>
</html>
