<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>体测报告统计 - 追光小牛管理后台</title>
  <script src="/internal-auth.js?v=8"></script>
  <script src="/js/app-auth.js?v=3"></script>
  <style>
    :root { --bg:#f6f3ee; --panel:#fff; --ink:#1f1a17; --muted:#6b625c; --line:rgba(31,26,23,.1); --brand:#ff6b35; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { width:min(calc(100% - 32px),1200px); margin:auto; padding:20px 0 48px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    .top h1 { margin:0; font-size:24px; } .top a { color:var(--muted); text-decoration:none; }
    .filters,.cards,.groups { display:grid; gap:12px; } .filters { grid-template-columns:repeat(4,1fr); background:var(--panel); padding:16px; border-radius:16px; }
    input,button { min-height:42px; border:1px solid var(--line); border-radius:9px; padding:9px 12px; font:inherit; } button { background:var(--brand); color:#fff; border-color:var(--brand); cursor:pointer; font-weight:700; }
    .cards { grid-template-columns:repeat(5,1fr); margin:16px 0; } .card,.group { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; } .label { color:var(--muted); font-size:12px; } .value { margin-top:9px; font-size:28px; font-weight:800; }
    .groups { grid-template-columns:1fr 1fr; } .group h2 { margin:0 0 12px; font-size:17px; } .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; }
    #message { color:var(--muted); padding:20px 0; } @media (max-width:760px) { .filters,.cards,.groups { grid-template-columns:1fr 1fr; } .cards .card:last-child { grid-column:span 2; } } @media (max-width:480px) { .filters,.cards,.groups { grid-template-columns:1fr; } .cards .card:last-child { grid-column:auto; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div><h1>体测报告统计</h1><div style="color:var(--muted);margin-top:5px;">报告次数与去重学员数分开统计</div></div><a href="/admin/dashboard.html">返回后台首页</a></div>
    <form class="filters" id="filters"><input type="date" id="dateFrom" aria-label="开始日期"><input type="date" id="dateTo" aria-label="结束日期"><input id="store" placeholder="门店" aria-label="门店"><input id="coach" placeholder="教练" aria-label="教练"><select id="status" aria-label="报告状态"><option value="">全部状态</option><option value="completed">已完成</option><option value="fallback">本地兜底</option></select><button type="submit">查询统计</button></form>
    <div id="message">正在加载...</div><section class="cards" id="cards" hidden></section><section class="groups" id="groups" hidden></section>
  </main>
  <script>
    function esc(value) { var div = document.createElement('div'); div.textContent = value == null ? '' : String(value); return div.innerHTML; }
    async function load() {
      var params = new URLSearchParams(); [['date_from','dateFrom'],['date_to','dateTo'],['store','store'],['coach','coach'],['status','status']].forEach(function(pair) { var value = document.getElementById(pair[1]).value.trim(); if (value) params.set(pair[0], value); });
      var message = document.getElementById('message'); message.textContent = '正在加载...';
      try {
        var response = await fetch('/api/admin/fitness-reports.php?' + params.toString(), { headers: window.authHeaders ? window.authHeaders({}) : {} });
        var body = await response.json(); if (!response.ok || body.code !== 0) throw new Error(body.message || '加载失败');
        var summary = body.data.summary; var cards = document.getElementById('cards'); cards.hidden = false;
        cards.innerHTML = [['报告次数',summary.report_count],['去重学员',summary.distinct_student_count],['本地兜底',summary.fallback_report_count],['今日报告',summary.today_report_count],['本月报告',summary.month_report_count]].map(function(item) { return '<div class="card"><div class="label">' + item[0] + '</div><div class="value">' + esc(item[1]) + '</div></div>'; }).join('');
        var groups = document.getElementById('groups'); groups.hidden = false;
        groups.innerHTML = [['门店统计',body.data.stores],['教练统计',body.data.coaches]].map(function(section) { return '<div class="group"><h2>' + section[0] + '</h2>' + (section[1].length ? section[1].map(function(row) { return '<div class="row"><span>' + esc(row.name) + '</span><span>' + esc(row.report_count) + ' 份 / ' + esc(row.distinct_student_count) + ' 人</span></div>'; }).join('') : '<div class="label">暂无数据</div>') + '</div>'; }).join('');
        message.textContent = '统计范围：' + (body.data.viewer.role || '当前账号');
      } catch (error) { message.textContent = error.message || '统计加载失败'; }
    }
    document.getElementById('filters').addEventListener('submit', function(event) { event.preventDefault(); load(); }); load();
  </script>
</body>
</html>
