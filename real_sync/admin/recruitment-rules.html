<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>追光小牛 · 招聘规则</title>
    <style>
      :root{--bg:#f5f1ea;--panel:#fff;--ink:#1f1a17;--muted:#6b625c;--line:rgba(31,26,23,.08);--brand:#ff6b35;--brand-soft:#fff2ea;--danger:#d35454}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#faf7f2 0,#f1ece5 100%);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.shell{width:min(calc(100% - 32px),1380px);margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 0 10px}.title h1{margin:0;font-size:24px}.title p{margin:6px 0 0;color:var(--muted);font-size:13px}.nav,.subnav{display:flex;flex-wrap:wrap;gap:8px}.nav a,.subnav a{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}.nav a.current,.subnav a.current{background:var(--brand);border-color:var(--brand);color:#fff}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(31,26,23,.04)}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:10px}.hero-main{background:linear-gradient(135deg,#1f1a17,#423128 56%,#9b4024 120%);color:#fff}.hero-main h2{margin:0;font-size:28px}.hero-main p{margin:10px 0 0;color:rgba(255,255,255,.76);font-size:14px;line-height:1.7}.meta{display:grid;gap:10px}.meta-item strong{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.subnav{margin-top:16px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-title h3{margin:0;font-size:18px}.panel-title span{font-size:12px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink)}.field input,.field select{height:42px}.field textarea{min-height:96px;padding-top:10px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{height:42px;border:0;border-radius:12px;padding:0 16px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.rule-list{display:grid;gap:10px}.rule-item{padding:12px 14px;border-radius:14px;background:#fbf8f4}.rule-title{font-weight:800}.rule-sub{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.6}.empty,.error{padding:18px;border-radius:14px;background:#fbf8f4;color:var(--muted);font-size:14px}.error{background:#fff1f1;color:var(--danger)}@media (max-width:1080px){.hero,.layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}@media (max-width:680px){.shell{width:min(calc(100% - 20px),1380px)}.nav{display:none}.hero-main h2{font-size:24px}}
    </style>
    <script>window.__SKIP_AUTO_INTERNAL_AUTH__=true;</script>
    <script src="/internal-auth.js?v=8"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar"><div class="title"><h1>招聘规则</h1><p>岗位关键词、硬性条件和 A/B/C 初筛口径</p></div><nav class="nav"><a href="/admin/dashboard.html">首页</a><a href="/admin/learning.html">学习汇总</a><a href="/admin/workload.html">工作量中心</a><a href="/admin/drill.html">演练中心</a><a class="current" href="/admin/recruitment-requirements.html">招聘管理</a></nav></header>
      <section class="hero"><article class="card hero-main"><h2 id="heroTitle">正在加载岗位规则台</h2><p id="heroDesc">规则版本将约束关键词门槛、经验门槛、硬性阻断项和分数封顶口径。</p></article><aside class="meta"><div class="card meta-item"><strong>当前账号</strong><span id="currentUser">-</span></div><div class="card meta-item"><strong>接口状态</strong><span id="apiStatus">-</span></div><div class="card meta-item"><strong>数据来源</strong><span>rules.php</span></div></aside></section>
      <nav class="subnav"><a href="/admin/recruitment-requirements.html">岗位需求</a><a class="current" href="/admin/recruitment-rules.html">岗位规则</a><a href="/admin/recruitment-resumes.html">简历初筛</a></nav>
      <section class="layout"><article class="card"><div class="panel-title"><h3 id="formTitle">规则草稿</h3><span>A/B/C 分档</span></div><form id="ruleForm"><div class="form-grid"><div class="field"><label for="ruleJob">适用岗位</label><input id="ruleJob" name="position_name" placeholder="岗位名称" /></div><div class="field"><label for="positionId">岗位 ID</label><input id="positionId" name="position_id" type="number" min="1" placeholder="可选" /></div><div class="field"><label for="minYears">A 级相关经验年限</label><input id="minYears" type="number" min="0" step="0.5" placeholder="例如：2" /></div><div class="field"><label for="promptVersion">提示词版本</label><input id="promptVersion" placeholder="例如：resume-screening-v1" /></div><div class="field full"><label for="jobDescription">岗位说明</label><textarea id="jobDescription" placeholder="岗位职责、经验要求和业务场景"></textarea></div><div class="field full"><label for="keywords">岗位关键词</label><textarea id="keywords" placeholder="销售转化、门店接待、私域跟进、课程顾问"></textarea></div><div class="field full"><label for="hardRules">合法硬性条件</label><textarea id="hardRules" placeholder="每行一个条件，发布前请在接口侧补齐 legal_basis 和 business_necessity"></textarea></div><div class="field full"><label for="reviewItems">人工核验项</label><textarea id="reviewItems" placeholder="通勤、证书、排班等需要人工确认的信息"></textarea></div></div><div class="actions"><button class="btn" type="submit">保存规则草稿</button><button class="btn secondary" type="button" id="resetBtn">清空</button></div></form></article><article class="card"><div class="panel-title"><h3>规则版本</h3><span id="rulesHint">等待加载</span></div><div id="rulesRoot" class="rule-list"></div></article></section>
    </div>
    <script>
      let currentRuleId=0,currentHardConditions=[];
      function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
      function renderState(el,text,isError){el.innerHTML='<div class="'+(isError?'error':'empty')+'">'+escapeHtml(text)+'</div>'}
      function splitLines(value){return String(value||'').split(/[\n,，、]/).map(function(item){return item.trim()}).filter(Boolean)}
      function idempotencyKey(action){return 'rule-'+action+'-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
      async function apiPost(payload,action){const response=await fetch('/api/admin/recruitment/rules.php',{method:'POST',headers:window.authHeaders?window.authHeaders({'Content-Type':'application/json','Idempotency-Key':idempotencyKey(action)}):{'Content-Type':'application/json','Idempotency-Key':idempotencyKey(action)},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(!response.ok||!result||result.code!==0)throw new Error(result?.message||'操作失败');return result.data||{}}
      function payloadFromForm(){const minYears=Number(document.getElementById('minYears').value||0);const existing=new Map(currentHardConditions.map(function(item){return [String(item.condition||item.text||'').trim(),item]}));return {id:currentRuleId||undefined,position_name:document.getElementById('ruleJob').value.trim(),position_id:document.getElementById('positionId').value?Number(document.getElementById('positionId').value):null,job_description:document.getElementById('jobDescription').value.trim(),prompt_version:document.getElementById('promptVersion').value.trim(),experience_rules:{a_min_related_years:minYears},keyword_rules:{required_for_a:splitLines(document.getElementById('keywords').value)},hard_conditions:splitLines(document.getElementById('hardRules').value).map(function(text){const saved=existing.get(text)||{};return {condition:text,legal_basis:saved.legal_basis||'',business_necessity:saved.business_necessity||''}}),grade_rules:{A:{min:80,max:100},B:{min:60,max:79},C:{min:0,max:59},review_items:splitLines(document.getElementById('reviewItems').value)}}}
      function joinKeywordRules(rule){const value=rule.keyword_rules&&rule.keyword_rules.required_for_a;return Array.isArray(value)?value.join('\n'):''}
      function joinHardRules(rule){return Array.isArray(rule.hard_conditions)?rule.hard_conditions.map(function(item){return item.condition||item.text||''}).filter(Boolean).join('\n'):''}
      function fillForm(rule){currentRuleId=Number(rule.id||0);currentHardConditions=Array.isArray(rule.hard_conditions)?rule.hard_conditions:[];document.getElementById('formTitle').textContent=currentRuleId?'编辑规则草稿':'规则草稿';document.getElementById('ruleJob').value=rule.position_name_snapshot||rule.position_name||'';document.getElementById('positionId').value=rule.position_id||'';document.getElementById('jobDescription').value=rule.job_description||'';document.getElementById('promptVersion').value=rule.prompt_version||'';document.getElementById('minYears').value=rule.experience_rules&&rule.experience_rules.a_min_related_years!=null?rule.experience_rules.a_min_related_years:'';document.getElementById('keywords').value=joinKeywordRules(rule);document.getElementById('hardRules').value=joinHardRules(rule);document.getElementById('reviewItems').value=rule.grade_rules&&Array.isArray(rule.grade_rules.review_items)?rule.grade_rules.review_items.join('\n'):''}
      function buttons(rule){const id=Number(rule.id||0);let html='<button class="btn secondary" type="button" data-action="edit" data-id="'+id+'">编辑</button><button class="btn secondary" type="button" data-action="copy" data-id="'+id+'">复制</button>';if(rule.status==='draft')html+='<button class="btn secondary" type="button" data-action="submit" data-id="'+id+'">提交</button>';if(rule.status==='in_review')html+='<button class="btn secondary" type="button" data-action="publish" data-id="'+id+'">发布</button>';if(rule.status!=='archived')html+='<button class="btn secondary" type="button" data-action="archive" data-id="'+id+'">归档</button>';return html}
      function renderRules(data){document.getElementById('apiStatus').textContent='规则接口可用';const list=Array.isArray(data.list)?data.list:[];document.getElementById('rulesHint').textContent=list.length+' 个版本';if(!list.length){renderState(document.getElementById('rulesRoot'),'暂无岗位规则版本',false);return}document.getElementById('rulesRoot').innerHTML=list.map(function(rule){return '<div class="rule-item"><div class="rule-title">'+escapeHtml(rule.position_name_snapshot||'-')+' · v'+escapeHtml(rule.version_no||'-')+'</div><div class="rule-sub">'+escapeHtml(rule.status_label||rule.status||'-')+' · A 级经验门槛 '+escapeHtml(rule.experience_rules&&rule.experience_rules.a_min_related_years!=null?rule.experience_rules.a_min_related_years:'-')+' 年</div><div class="actions">'+buttons(rule)+'</div></div>'}).join('');window.ruleList=list}
      async function reloadRules(){const response=await fetch('/api/admin/recruitment/rules.php',{headers:window.authHeaders?window.authHeaders():{},cache:'no-store'});const result=await response.json();if(!response.ok||!result||result.code!==0)throw new Error(result?.message||'加载失败');renderRules(result.data||{})}
      async function loadPage(user){document.getElementById('currentUser').textContent=[user?.staff_name,user?.display_name,user?.username].find(Boolean)||'已登录';document.getElementById('heroTitle').textContent='岗位规则台已就绪';document.getElementById('heroDesc').textContent='可维护岗位规则版本，并发布为简历匹配与 A/B/C 分级口径。';await reloadRules()}
      document.getElementById('ruleForm').addEventListener('submit',async function(event){event.preventDefault();try{await apiPost(payloadFromForm(),currentRuleId?'update':'create');fillForm({});await reloadRules()}catch(error){renderState(document.getElementById('rulesRoot'),error.message||'保存失败',true)}})
      document.getElementById('resetBtn').addEventListener('click',function(){currentRuleId=0;currentHardConditions=[];document.getElementById('formTitle').textContent='规则草稿';document.getElementById('ruleForm').reset()})
      document.getElementById('rulesRoot').addEventListener('click',async function(event){const button=event.target.closest('button[data-action]');if(!button)return;const id=Number(button.dataset.id||0);const action=button.dataset.action;const rule=(window.ruleList||[]).find(function(item){return Number(item.id)===id});if(action==='edit'){fillForm(rule||{});return}try{await apiPost({id:id,action:action},action);await reloadRules()}catch(error){renderState(document.getElementById('rulesRoot'),error.message||'操作失败',true)}})
      window.requirePageAuth({onAuthed:async(user)=>{try{await loadPage(user)}catch(error){document.getElementById('heroTitle').textContent='岗位规则台加载失败';document.getElementById('heroDesc').textContent=error.message||'请稍后重试';renderState(document.getElementById('rulesRoot'),error.message||'加载失败',true)}}})
    </script>
  </body>
</html>
