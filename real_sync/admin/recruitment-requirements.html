<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>追光小牛 · 招聘需求</title>
    <style>
      :root{--bg:#f5f1ea;--panel:#fff;--ink:#1f1a17;--muted:#6b625c;--line:rgba(31,26,23,.08);--brand:#ff6b35;--brand-soft:#fff2ea;--danger:#d35454;--ok:#2f9e44}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#faf7f2 0,#f1ece5 100%);color:var(--ink)}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.shell{width:min(calc(100% - 32px),1380px);margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 0 10px}.title h1{margin:0;font-size:24px}.title p{margin:6px 0 0;color:var(--muted);font-size:13px}.nav,.subnav{display:flex;flex-wrap:wrap;gap:8px}.nav a,.subnav a{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}.nav a.current,.subnav a.current{background:var(--brand);border-color:var(--brand);color:#fff}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:10px}.hero-main{background:linear-gradient(135deg,#1f1a17,#432d23 56%,#af4d25 120%);color:#fff}.hero-main h2{margin:0;font-size:28px}.hero-main p{margin:10px 0 0;color:rgba(255,255,255,.76);font-size:14px;line-height:1.7}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 28px rgba(31,26,23,.04)}.meta{display:grid;gap:10px}.meta-item strong{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.subnav{margin-top:16px}.layout{display:grid;grid-template-columns:.95fr 1.05fr;gap:16px;margin-top:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-title h3{margin:0;font-size:18px}.panel-title span{font-size:12px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;color:var(--ink)}.field input,.field select{height:42px}.field textarea{min-height:112px;padding-top:10px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{height:42px;border:0;border-radius:12px;padding:0 16px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;background:var(--brand-soft);color:#9b441c;font-size:12px;font-weight:800}.empty,.error{padding:18px;border-radius:14px;background:#fbf8f4;color:var(--muted);font-size:14px}.error{background:#fff1f1;color:var(--danger)}@media (max-width:1080px){.hero,.layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}@media (max-width:680px){.shell{width:min(calc(100% - 20px),1380px)}.nav{display:none}.topbar{align-items:flex-start}.hero-main h2{font-size:24px}}
    </style>
    <script>window.__SKIP_AUTO_INTERNAL_AUTH__=true;</script>
    <script src="/internal-auth.js?v=8"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar"><div class="title"><h1>招聘需求</h1><p>岗位需求录入、范围权限和批次归集入口</p></div><nav class="nav"><a href="/admin/dashboard.html">首页</a><a href="/admin/learning.html">学习汇总</a><a href="/admin/workload.html">工作量中心</a><a href="/admin/drill.html">演练中心</a><a class="current" href="/admin/recruitment-requirements.html">招聘管理</a></nav></header>
      <section class="hero"><article class="card hero-main"><h2 id="heroTitle">正在加载招聘需求台</h2><p id="heroDesc">创建岗位需求后，简历批量上传会按文件名和岗位规则自动推荐归属需求。</p></article><aside class="meta"><div class="card meta-item"><strong>当前账号</strong><span id="currentUser">-</span></div><div class="card meta-item"><strong>招聘范围</strong><span id="scopeText">-</span></div><div class="card meta-item"><strong>数据来源</strong><span id="sourceText">requirements.php</span></div></aside></section>
      <nav class="subnav"><a class="current" href="/admin/recruitment-requirements.html">岗位需求</a><a href="/admin/recruitment-rules.html">岗位规则</a><a href="/admin/recruitment-resumes.html">简历初筛</a></nav>
      <section class="layout"><article class="card"><div class="panel-title"><h3 id="formTitle">新增岗位需求</h3><span>基础信息</span></div><form id="requirementForm"><div class="form-grid"><div class="field"><label for="jobTitle">岗位名称</label><input id="jobTitle" name="job_title" placeholder="例如：门店销售顾问" /></div><div class="field"><label for="storeId">门店 ID</label><input id="storeId" name="store_id" type="number" min="1" placeholder="门店 ID" /></div><div class="field"><label for="headcount">招聘人数</label><input id="headcount" name="headcount" type="number" min="1" placeholder="1" /></div><div class="field"><label for="targetDate">目标到岗日</label><input id="targetDate" name="target_onboard_date" type="date" /></div><div class="field full"><label for="jobDescription">岗位说明</label><textarea id="jobDescription" name="job_description" placeholder="职责、经验要求、门店场景和硬性条件"></textarea></div><div class="field full"><label for="extraRequirements">补充要求</label><textarea id="extraRequirements" name="additional_requirements" placeholder="证书、排班、距离、沟通风格等人工核验项"></textarea></div></div><div class="actions"><button class="btn" type="submit">保存草稿</button><button class="btn secondary" type="button" id="resetBtn">清空</button></div></form></article><article class="card"><div class="panel-title"><h3>需求列表</h3><span id="listHint">等待加载</span></div><div id="requirementsRoot" class="empty">正在确认接口状态</div></article></section>
    </div>
    <script>
      let currentRequirementId=0;
      function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
      function renderState(el,text,isError){el.innerHTML='<div class="'+(isError?'error':'empty')+'">'+escapeHtml(text)+'</div>'}
      function scopeLabel(scope){if(!scope)return '-';if(scope.can_view_all)return '总部全量';if(Array.isArray(scope.store_ids)&&scope.store_ids.length)return '门店 '+scope.store_ids.join(', ');if(Array.isArray(scope.requirement_ids)&&scope.requirement_ids.length)return '临时指派 '+scope.requirement_ids.join(', ');return '暂无招聘需求范围'}
      function idempotencyKey(action){return 'req-'+action+'-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
      async function apiPost(payload,action){const response=await fetch('/api/admin/recruitment/requirements.php',{method:'POST',headers:window.authHeaders?window.authHeaders({'Content-Type':'application/json','Idempotency-Key':idempotencyKey(action)}):{'Content-Type':'application/json','Idempotency-Key':idempotencyKey(action)},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(!response.ok||!result||result.code!==0)throw new Error(result?.message||'操作失败');return result.data||{}}
      function payloadFromForm(){return {id:currentRequirementId||undefined,job_title:document.getElementById('jobTitle').value.trim(),store_id:document.getElementById('storeId').value?Number(document.getElementById('storeId').value):null,headcount:Number(document.getElementById('headcount').value||1),target_onboard_date:document.getElementById('targetDate').value||null,job_description:document.getElementById('jobDescription').value.trim(),additional_requirements:document.getElementById('extraRequirements').value.trim()}}
      function fillForm(item){currentRequirementId=Number(item.id||0);document.getElementById('formTitle').textContent=currentRequirementId?'编辑岗位需求':'新增岗位需求';document.getElementById('jobTitle').value=item.job_title||item.position_name_snapshot||'';document.getElementById('storeId').value=item.store_id||'';document.getElementById('headcount').value=item.headcount||1;document.getElementById('targetDate').value=item.target_onboard_date||'';document.getElementById('jobDescription').value=item.job_description||'';document.getElementById('extraRequirements').value=item.additional_requirements||''}
      function actionButtons(item){const id=Number(item.id||0);let buttons='<button class="btn secondary" type="button" data-action="edit" data-id="'+id+'">编辑</button>';if(['draft','returned'].includes(item.status))buttons+='<button class="btn secondary" type="button" data-action="submit" data-id="'+id+'">提交</button>';if(item.status==='approval_pending')buttons+='<button class="btn secondary" type="button" data-action="approve" data-id="'+id+'">批准</button><button class="btn secondary" type="button" data-action="return" data-id="'+id+'">退回</button>';if(item.status==='approved')buttons+='<button class="btn secondary" type="button" data-action="batch" data-id="'+id+'">创建批次</button><button class="btn secondary" type="button" data-action="close" data-id="'+id+'">关闭</button>';if(item.status==='closed')buttons+='<button class="btn secondary" type="button" data-action="reopen" data-id="'+id+'">重开</button>';return buttons}
      function renderList(data){document.getElementById('scopeText').textContent=scopeLabel(data.scope);const list=Array.isArray(data.list)?data.list:[];document.getElementById('listHint').textContent=list.length+' 条';if(!list.length){renderState(document.getElementById('requirementsRoot'),'暂无招聘需求',false);return}document.getElementById('requirementsRoot').innerHTML='<table class="table"><thead><tr><th>需求</th><th>门店</th><th>状态</th><th>目标</th><th>操作</th></tr></thead><tbody>'+list.map(item=>'<tr><td><strong>'+escapeHtml(item.requirement_no||'-')+'</strong><br>'+escapeHtml(item.job_title||item.position_name_snapshot||'-')+'</td><td>'+escapeHtml(item.store_name||item.store_id||'-')+'</td><td><span class="chip">'+escapeHtml(item.status_label||item.status||'-')+'</span></td><td>'+escapeHtml(item.headcount||0)+' 人<br>'+escapeHtml(item.target_onboard_date||'-')+'</td><td><div class="actions">'+actionButtons(item)+'</div></td></tr>').join('')+'</tbody></table>';window.requirementList=list}
      async function reloadRequirements(){const response=await fetch('/api/admin/recruitment/requirements.php',{headers:window.authHeaders?window.authHeaders():{},cache:'no-store'});const result=await response.json();if(!response.ok||!result||result.code!==0)throw new Error(result?.message||'加载失败');renderList(result.data||{})}
      async function loadPage(user){document.getElementById('currentUser').textContent=[user?.staff_name,user?.display_name,user?.username].find(Boolean)||'已登录';document.getElementById('heroTitle').textContent='招聘需求台已就绪';document.getElementById('heroDesc').textContent='可维护岗位需求、提交审批，并从已批准需求进入简历批次创建。';await reloadRequirements()}
      document.getElementById('requirementForm').addEventListener('submit',async function(event){event.preventDefault();try{await apiPost(payloadFromForm(),currentRequirementId?'update':'create');fillForm({});await reloadRequirements()}catch(error){renderState(document.getElementById('requirementsRoot'),error.message||'保存失败',true)}})
      document.getElementById('resetBtn').addEventListener('click',function(){currentRequirementId=0;document.getElementById('formTitle').textContent='新增岗位需求';document.getElementById('requirementForm').reset()})
      document.getElementById('requirementsRoot').addEventListener('click',async function(event){const button=event.target.closest('button[data-action]');if(!button)return;const id=Number(button.dataset.id||0);const action=button.dataset.action;const item=(window.requirementList||[]).find(row=>Number(row.id)===id);if(action==='edit'){fillForm(item||{});return}if(action==='batch'){window.location.href='/admin/recruitment-resumes.html?requirement_id='+encodeURIComponent(id);return}let comment='';if(action==='return'){comment=window.prompt('请输入退回原因')?.trim()||'';if(!comment)return}try{await apiPost({id,action,comment},action);await reloadRequirements()}catch(error){renderState(document.getElementById('requirementsRoot'),error.message||'操作失败',true)}})
      window.requirePageAuth({onAuthed:async(user)=>{try{await loadPage(user)}catch(error){document.getElementById('heroTitle').textContent='招聘需求台加载失败';document.getElementById('heroDesc').textContent=error.message||'请稍后重试';renderState(document.getElementById('requirementsRoot'),error.message||'加载失败',true)}}})
    </script>
  </body>
</html>
