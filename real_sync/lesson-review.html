<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/styles.css?v=9">
  <title>教案审核工作台</title>
  <style>
    :root{--paper:#f1ede5;--panel:#fffdf8;--ink:#24211d;--muted:#756e64;--line:#ddd5c8;--orange:#ec6a32;--navy:#243b52;--green:#26735a;--red:#b64747;--shadow:0 16px 42px rgba(54,46,36,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#ffe9d6 0,transparent 30%),var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select,textarea{font:inherit}a{color:inherit;text-decoration:none}.shell{width:min(1460px,calc(100% - 36px));margin:auto}.topbar,.hero,.section-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{padding:22px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--navy);color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.filter,.btn{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 14px}.hero{align-items:end;padding:28px 0 22px}.eyebrow{color:var(--orange);font-size:12px;font-weight:850;letter-spacing:.14em}.hero h1{margin:7px 0;font:700 clamp(32px,4vw,52px)/1.05 Georgia,"Songti SC",serif}.hero p{margin:0;color:var(--muted)}.stats{display:flex;gap:10px}.stat{min-width:90px;padding:13px;border-radius:16px;background:#fff9;border:1px solid var(--line);text-align:center}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding-bottom:42px}.card{background:var(--panel);border:1px solid rgba(90,73,53,.13);border-radius:22px;box-shadow:var(--shadow)}.queue{padding:17px;align-self:start;position:sticky;top:14px}.filters{display:flex;gap:8px;margin:14px 0}.filter{min-width:0;flex:1}.task-list{display:grid;gap:9px}.task{width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.task.active{border-color:var(--orange);box-shadow:0 0 0 2px #ec6a3220}.task strong,.task span{display:block}.task span,.meta,.empty,.small{color:var(--muted);font-size:13px}.task .pill,.pill{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#edf2f5;color:var(--navy);font-size:11px;font-weight:800}.detail{display:none;gap:16px}.detail.active{display:grid}.panel{padding:20px}.lesson-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.meta-box{padding:11px;border:1px solid var(--line);border-radius:13px}.meta-box span{display:block;color:var(--muted);font-size:11px}.content-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.content-card{padding:15px;border-radius:15px;background:#fff;border:1px solid var(--line)}.content-card h3{margin:0 0 7px;font-size:15px}.content-card p{margin:0;white-space:pre-wrap;line-height:1.65}.wide{grid-column:1/-1}.phase{display:grid;grid-template-columns:110px 70px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.history{display:grid;gap:9px}.history-item{padding:12px;border-left:3px solid var(--navy);background:#f8f5ef;border-radius:0 12px 12px 0}.decision-box textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.btn{cursor:pointer;font-weight:800}.btn.approve{background:var(--green);border-color:var(--green);color:#fff}.btn.return{background:#fff0f0;border-color:#e3b4b4;color:var(--red)}.btn:disabled{opacity:.5;cursor:default}.notice{display:none;margin-bottom:14px;padding:12px 15px;border-radius:13px;background:#e5f2ec;color:var(--green)}.notice.show{display:block}.notice.bad{background:#fae7e7;color:var(--red)}body.loading{cursor:progress}body.loading .btn{pointer-events:none}.section-head h2,.section-head h3{margin:0}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}.queue{position:static}.lesson-meta,.content-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}}@media(max-width:640px){.shell{width:min(100% - 22px,1460px)}.hero{display:block}.stats{margin-top:18px}.layout,.lesson-meta,.content-grid{grid-template-columns:1fr}.wide{grid-column:auto}.phase{grid-template-columns:1fr}.topbar{align-items:flex-start}.nav{justify-content:flex-end}.panel{padding:16px}}
  </style>
</head>
<body class="internal-page internal-review">
  <header class="shell topbar"><a class="brand" href="/internal.html"><span class="brand-mark">ACE</span><span>教案审核台</span></a><nav class="nav" aria-label="教案审核导航"><a href="/lesson-submission.html">教案编辑</a><a aria-current="page" href="/lesson-review.html">审核任务</a><a href="/lesson-library.html">正式教案库</a></nav></header>
  <main class="shell">
    <div id="notice" class="notice" role="status"></div>
    <section class="hero"><div><div class="eyebrow">TWO-STAGE REVIEW</div><h1>每次决定都有依据<br>每次修改都有记录</h1><p>店长初审与教学主管终审共用同一份冻结版本。</p></div><div class="stats"><div class="stat"><strong id="pendingCount">0</strong><span>待处理</span></div><div class="stat"><strong id="doneCount">0</strong><span>已处理</span></div></div></section>
    <section class="layout">
      <aside class="card queue"><div class="section-head"><h2>审核任务</h2><button id="refreshButton" class="btn" type="button">刷新</button></div><div class="filters"><select id="statusFilter" class="filter"><option value="">全部状态</option><option value="pending">待处理</option><option value="completed">已处理</option></select><select id="stageFilter" class="filter"><option value="">全部阶段</option><option value="store_review">店长初审</option><option value="supervisor_review">主管终审</option></select></div><div id="taskList" class="task-list"><div class="empty">正在读取任务</div></div></aside>
      <div id="detail" class="detail"><section class="card panel"><div class="section-head"><div><h2 id="lessonTitle">教案详情</h2><div id="lessonSubtitle" class="meta"></div></div><span id="taskStatus" class="pill"></span></div><div id="lessonMeta" class="lesson-meta"></div></section><section class="card panel"><div class="section-head"><h3>冻结的结构化教案</h3><span id="versionBadge" class="pill"></span></div><div id="lessonContent" class="content-grid"></div></section><section class="card panel"><div class="section-head"><h3>原始文件与优化建议</h3></div><div id="evidence" class="content-grid"></div></section><section class="card panel"><div class="section-head"><h3>版本与审核历史</h3></div><div id="history" class="history"></div></section><section id="decisionBox" class="card panel decision-box"><div class="section-head"><div><h3>审核决定</h3><div class="small">退回时必须说明需要修改的内容</div></div></div><textarea id="comments" placeholder="填写审核意见或退回原因"></textarea><div class="actions"><button id="returnButton" class="btn return" type="button">退回修改</button><button id="approveButton" class="btn approve" type="button">审核通过</button></div></section></div>
    </section>
  </main>
  <script>window.__SKIP_AUTO_INTERNAL_AUTH__ = true;</script>
  <script src="/internal-auth.js?v=9"></script>
  <script src="/js/lesson-review.js?v=1"></script>
</body>
</html>
