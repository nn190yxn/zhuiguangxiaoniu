<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正式教案库 | 追光小牛</title>
  <style>
    :root {
      --ink: #201b18;
      --muted: #786e67;
      --paper: #f3f0eb;
      --panel: #fffdf9;
      --line: rgba(53, 45, 39, .12);
      --orange: #ef6638;
      --orange-soft: #fff0e9;
      --green: #2c725f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .library-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 56px; }
    .hero { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
     h1 { margin: 0; max-width: 700px; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; letter-spacing: -.04em; }
    .hero-copy { max-width: 650px; margin: 14px 0 0; color: var(--muted); line-height: 1.75; }
    .result-count { min-width: 180px; padding: 15px 18px; border-left: 4px solid var(--orange); background: var(--panel); font-size: 14px; font-weight: 800; }
    .filter-panel { display: grid; grid-template-columns: 1.5fr repeat(2, 1fr) auto auto; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255, 253, 249, .9); }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .field input { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 11px; background: #fff; padding: 0 12px; color: var(--ink); }
    .button { align-self: end; min-height: 42px; border: 0; border-radius: 11px; padding: 0 18px; background: var(--orange); color: #fff; font-weight: 800; }
    .button.secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    .lesson-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
    .lesson-card { display: flex; min-height: 260px; flex-direction: column; gap: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); padding: 20px; color: inherit; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease; }
    .lesson-card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(47, 39, 33, .09); }
    .lesson-card-top, .lesson-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; }
    .level-tag { border-radius: 999px; background: var(--orange-soft); padding: 5px 9px; color: var(--orange); font-weight: 800; }
    .lesson-card h2 { margin: 0; font-size: 20px; line-height: 1.35; }
    .lesson-card dl { display: grid; gap: 8px; margin: 0; }
    .lesson-card dl div { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
    .lesson-card dt { color: var(--muted); font-size: 12px; }
    .lesson-card dd { margin: 0; font-size: 13px; font-weight: 700; }
    .lesson-card-footer { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
    .lesson-card-footer strong { color: var(--green); }
    .status-panel { margin-top: 18px; border-radius: 16px; padding: 34px 20px; background: var(--panel); color: var(--muted); text-align: center; }
    .status-panel.error { background: #fff1ee; color: #a7442f; }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 22px; }
    .pagination button { min-height: 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 0 14px; color: var(--ink); font-weight: 700; }
    .pagination button:disabled { cursor: default; opacity: .4; }
    .pagination span { color: var(--muted); font-size: 13px; }
    .detail-header { position: relative; overflow: hidden; border-radius: 24px; background: #23201d; padding: 28px; color: #fff; }
    .detail-header::after { position: absolute; right: -50px; bottom: -90px; width: 240px; height: 240px; border-radius: 50%; background: var(--orange); content: ""; opacity: .82; }
    .back-button { position: relative; z-index: 1; border: 0; background: transparent; padding: 0; color: #f7c5b1; font-weight: 800; }
    .detail-title-row { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-top: 34px; }
    .detail-title-row h1 { max-width: 780px; font-size: clamp(28px, 4vw, 48px); }
    .detail-title-row p { margin: 10px 0 0; color: #cfc8c1; }
    .version-badge { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 800; }
    .detail-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
    .detail-meta div { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px; }
    .detail-meta span { color: var(--muted); font-size: 11px; }
    .detail-meta strong { font-size: 14px; }
    .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .content-card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 18px; }
    .content-card.wide { grid-column: 1 / -1; }
    .content-card h3 { margin: 0 0 10px; color: var(--green); font-size: 14px; }
    .content-card p { margin: 0; color: #4d4540; line-height: 1.75; white-space: pre-wrap; }
    .phase { display: grid; grid-template-columns: 150px 90px 1fr; gap: 12px; border-top: 1px solid var(--line); padding: 12px 0; }
    .phase:first-of-type { border-top: 0; }
    .phase span { color: var(--muted); font-size: 12px; }
    .phase p { font-size: 13px; }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .result-count { min-width: 0; }
      .filter-panel { grid-template-columns: repeat(2, 1fr); }
      .field:first-child { grid-column: 1 / -1; }
      .lesson-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-meta { grid-template-columns: repeat(2, 1fr); }
    }
     @media (max-width: 640px) {
      .library-shell { width: min(100% - 22px, 1180px); padding-top: 20px; }
      .filter-panel, .lesson-grid, .content-grid, .detail-meta { grid-template-columns: 1fr; }
      .field:first-child, .content-card.wide { grid-column: auto; }
      .button { width: 100%; }
      .detail-header { padding: 22px; }
      .detail-title-row { align-items: start; flex-direction: column; }
       .phase { grid-template-columns: 1fr; gap: 5px; }
       h1 { font-size: clamp(28px, 10vw, 38px); }
    }
  </style>
  <script src="/internal-auth.js?v=20260904-fixed-nav" defer></script>
  <script src="/js/lesson-library.js" defer></script>
</head>
<body class="employee-center internal-lesson-library">
  <main class="library-shell">
    <section id="listView">
      <header class="hero">
        <div>
          <p class="eyebrow">APPROVED LESSONS</p>
          <h1>正式教案库</h1>
          <p class="hero-copy">这里展示教学主管终审通过的固定版本。每份教案都保留批准版本、作者、门店和发布时间，便于团队稳定复用。</p>
        </div>
        <div class="result-count" id="resultCount">正式教案库</div>
      </header>

      <form class="filter-panel" id="searchForm">
        <div class="field">
          <label for="keywordInput">搜索标题、门店或作者</label>
          <input id="keywordInput" name="q" type="search" placeholder="输入关键词">
        </div>
        <div class="field">
          <label for="courseLineFilter">课程线</label>
          <input id="courseLineFilter" name="course_line" type="text" placeholder="例如：体适能">
        </div>
        <div class="field">
          <label for="classLevelFilter">班级或级别</label>
          <input id="classLevelFilter" name="class_level" type="text" placeholder="例如：L2">
        </div>
        <button class="button" type="submit">查询</button>
        <button class="button secondary" id="resetFilters" type="button">重置</button>
      </form>

      <div class="status-panel loading" id="listStatus">正在加载正式教案...</div>
      <section class="lesson-grid" id="lessonGrid" aria-live="polite"></section>
      <nav class="pagination" id="pagination" aria-label="教案列表分页" hidden>
        <button id="previousPage" type="button">上一页</button>
        <span id="pageLabel">第 1 页</span>
        <button id="nextPage" type="button">下一页</button>
      </nav>
    </section>

    <article id="detailView" hidden>
      <header class="detail-header">
        <button class="back-button" id="backToList" type="button">返回正式教案库</button>
        <div class="detail-title-row">
          <div>
            <h1 id="detailTitle">正在加载正式教案...</h1>
            <p id="detailSubtitle"></p>
          </div>
          <span class="version-badge" id="versionBadge">批准版本</span>
        </div>
      </header>
      <section class="detail-meta" id="detailMeta"></section>
      <section class="content-grid" id="lessonContent"></section>
    </article>
  </main>
</body>
</html>
